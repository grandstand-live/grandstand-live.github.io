name: Collect data

on:
  schedule:
    # every 5 minutes — GitHub's shortest interval, and enough to catch a live
    # League of Legends game before Riot's feed is wiped after the broadcast
    - cron: '*/5 * * * *'
  workflow_dispatch:

# only ever one run at a time, so two runs can't race to commit the same files
concurrency:
  group: collect
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Collect
        env:
          PANDASCORE_TOKEN: ${{ secrets.PANDASCORE_TOKEN }}
          APISPORTS_KEY: ${{ secrets.APISPORTS_KEY }}
        run: node scripts/collect.mjs

      - name: Commit changes
        run: |
          if [ -z "$(git status --porcelain data)" ]; then
            echo "nothing new"
            exit 0
          fi
          git config user.name "grandstand-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          git commit -m "Update data $(date -u '+%Y-%m-%d %H:%M UTC')"
          # a scheduled run can collide with a push, so rebase and retry once
          git pull --rebase --autostash || true
          git push
