name: Collect data

on:
  schedule:
    # every 5 minutes — GitHub's shortest interval, and enough to catch a live
    # League of Legends game before Riot's feed is wiped after the broadcast
    - cron: '*/5 * * * *'
  workflow_dispatch:

# only ever one run at a time, so two runs can't race to commit the same files
concurrency:
  group: collect
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Collect
        env:
          PANDASCORE_TOKEN: ${{ secrets.PANDASCORE_TOKEN }}
          APISPORTS_KEY: ${{ secrets.APISPORTS_KEY }}
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
        run: node scripts/collect.mjs

      - name: Commit changes
        run: |
          if [ -z "$(git status --porcelain data)" ]; then
            echo "nothing new"
            exit 0
          fi
          git config user.name "grandstand-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          git commit -m "Update data $(date -u '+%Y-%m-%d %H:%M UTC')"
          # A hand-triggered run and a scheduled one can still start seconds
          # apart, and then whichever pushes second is rejected. Rebase onto
          # what landed and try again rather than failing the whole run.
          for attempt in 1 2 3 4 5; do
            if git push; then
              exit 0
            fi
            echo "push rejected; rebasing and retrying (attempt $attempt)"
            git pull --rebase --autostash origin main || true
            sleep $((attempt * 5))
          done
          echo "could not push after 5 attempts" >&2
          exit 1
