  function pandaRow(m, game) {
    var t = m.teams || [];
    var a = t[0] || {}, b = t[1] || {};
    var live = m.status === 'running';
    var done = m.status === 'finished';
    var has = a.score !== null && a.score !== undefined && b.score !== null && b.score !== undefined;
    var aw = done && has && a.score > b.score;
    var bw = done && has && b.score > a.score;
    var bo = m.bo ? 'BO' + m.bo : '';
    var mid, label;
    if (live || (done && has)) {
      mid = '<div class="score">' + esc(has ? a.score : 0) +
        ' <span style="color:var(--muted)">-</span> ' + esc(has ? b.score : 0) + '</div>';
      label = '<div class="state' + (live ? ' is-live' : '') + '">' +
        (live ? '进行中' : '完场') + (bo ? ' · ' + bo : '') + '</div>';
    } else {
      var d0 = new Date(m.start || '');
      mid = '<div class="kick">' + esc(isNaN(d0) ? '待定' : fmtTime(d0)) + '</div>';
      label = '<div class="state">' + esc(bo) + '</div>';
    }
    if (done && has) {
      settlePick(game, m.id, a.score > b.score ? 'home' : 'away', a.score + '-' + b.score);
    }
    var myPanda = pickOf(game, m.id);
    var pandaPick = (!done && !live) || (myPanda && myPanda.result)
      ? pickBarHTML(game, m.id, 'two',
        { home: a.acronym || a.name || '左', away: b.acronym || b.name || '右' }) : '';

    var key = game + ':' + m.id;
    var open = !!pandaOpen[key];
    var maps = (m.games || []).filter(function (g) { return g.status === 'finished'; });
    var detail = '';
    if (open) {
      // one row per map, with the winner's side coloured — a series is really
      // a sequence, and pills in a line lost that
      var cells = maps.map(function (g) {
        var side = g.winner === a.id ? 'a' : (g.winner === b.id ? 'b' : '');
        var who = side === 'a' ? (a.acronym || a.name)
          : side === 'b' ? (b.acronym || b.name) : '—';
        return '<div class="map-line">' +
          '<span class="map-no">第 ' + esc(g.pos || '?') + ' 图</span>' +
          '<span class="map-win ' + side + '">' + esc(who) + '</span>' +
          '<span class="map-len">' + (g.length ? Math.round(g.length / 60) + ' 分钟' : '') +
          '</span></div>';
      }).join('');
      var when = new Date(m.start || '');
      detail = '<div class="panda-detail">' +
        '<div class="pd-meta">' +
        (m.event ? '<span>' + esc(m.event) + '</span>' : '') +
        (m.tier ? '<span class="pd-tier">' + esc(String(m.tier).toUpperCase()) + ' 级</span>' : '') +
        (isNaN(when) ? '' : '<span>' + esc(fmtDay(when) + ' ' + fmtTime(when)) + '</span>') +
        '</div>' +
        (!done ? pandaOddsHTML(m, game) : '') +
        (cells ? '<div class="map-list">' + cells + '</div>'
               : (done ? '<div class="pd-line muted">这场还没有分图结果。</div>' : '')) +
        (m.stream ? '<div class="pd-line"><a href="' + esc(m.stream.url) +
          '" target="_blank" rel="noopener">观看直播/回放 ↗</a></div>' : '') +
        pandaClipsHTML(m, game) +
        '</div>';
    }
    return '<button class="match' + (live ? ' live' : '') + '" type="button"' +
      ' data-panda="' + esc(key) + '" aria-expanded="' + open + '">' +
      '<span class="side home">' + pandaTeamCell(a, false, bw, aw) + '</span>' +
      '<span class="mid">' + mid + label + '</span>' +
      '<span class="side away">' + pandaTeamCell(b, true, aw, bw) + '</span>' +
      '</button>' +
      (pandaPick ? '<div class="match-note" data-home="' + esc(a.acronym || a.name || '') +
        '" data-away="' + esc(b.acronym || b.name || '') + '" data-when="' + esc(m.start || '') +
        '">' + pandaPick + '</div>' : '') + detail;
  }

  function renderPandaGame(file, label, game) {
    var host = panelFor('panel-fixtures');
    host.innerHTML = '<div class="skeleton">正在读取…</div>';
    $('status').textContent = label;
    archiveGet(file).then(function (d) {
      var all = (d && (d.upcoming || []).concat(d.recent || [])) || [];
      if (!all.length) { $('chips2').hidden = true; host.innerHTML = archiveEmpty(label); return; }

      // chips: the events present in the data, busiest first
      var counts = {}, imgs = {};
      all.forEach(function (m) {
        if (!m.league) return;
        counts[m.league] = (counts[m.league] || 0) + 1;
        if (m.leagueImage && !imgs[m.league]) imgs[m.league] = m.leagueImage;
      });
      var leagues = Object.keys(counts).sort(function (x, y) { return counts[y] - counts[x]; });
      var current = pandaLeague[game];
      if (leagues.indexOf(current) === -1) current = '';
      // a dozen event names was a whole row of chips on a phone; it is a
      // picker now, which costs one line instead of one screenful
      $('chips2').hidden = false;
      $('chips2').dataset.kind = 'panda';
      $('chips2').dataset.game = game;
      $('chips2').innerHTML = '<option value=""' + (current === '' ? ' selected' : '') +
        '>全部赛事</option>' +
        leagues.map(function (l) {
          return '<option value="' + esc(l) + '"' + (l === current ? ' selected' : '') + '>' +
            esc(l) + ' (' + counts[l] + ')</option>';
        }).join('');

      var keep = function (m) { return !current || m.league === current; };
      var soon = (d.upcoming || []).filter(keep);
      var past = (d.recent || []).filter(keep);
      if (!soon.length && !past.length) {
        host.innerHTML = '<div class="empty">这个赛事现在没有比赛。</div>' + archiveFoot(d);
        return;
      }

      // group by day, the way the LoL board does
      function days(list, reverse) {
        var groups = [], idx = {};
        list.forEach(function (m) {
          var d0 = new Date(m.start || '');
          var k = isNaN(d0) ? 'tbd' : dayKey(d0);
          if (!(k in idx)) {
            idx[k] = groups.length;
            groups.push({ key: k, label: isNaN(d0) ? '待定' : fmtDay(d0), items: [] });
          }
          groups[idx[k]].items.push(m);
        });
        if (reverse) groups.reverse();
        return groups;
      }
      var todayKey = dayKey(new Date());
      function block(groups) {
        return groups.map(function (g) {
          return '<div class="day"><div class="day-head"><span class="d">' + esc(g.label) + '</span>' +
            (g.key === todayKey ? '<span class="today">今天</span>' : '') +
            '<span class="n">' + g.items.length + ' 场</span></div>' +
            '<div class="card">' + g.items.map(function (m) { return pandaRow(m, game); }).join('') +
            '</div></div>';
        }).join('');
      }

      var liveCount = soon.filter(function (m) { return m.status === 'running'; }).length;
      host.innerHTML =
        (soon.length ? '<div class="group-name">接下来</div>' + block(days(soon)) : '') +
        (past.length ? '<div class="group-name">最近结果</div>' + block(days(past, true)) : '') +
        archiveFoot(d);
      $('status').innerHTML = (liveCount ? '<span class="dot"></span>' + liveCount + ' 场进行中 · ' : '') +
        esc(label) + ' · ' + esc(current || '全部赛事') + ' · ' + (soon.length + past.length) + ' 场';
    });
  }
  function renderCs2() { renderPandaGame('cs2.json', 'CS2', 'cs2'); }
  function renderValorant() { renderPandaGame('valorant.json', 'Valorant', 'valorant'); }

  /* ---------- CS2 / Valorant: standings and follows ----------
     PandaScore's standings endpoint needs a tournament id per event and the
     free plan is thin on them, but every finished match in the file already
     says who beat whom — so the table is counted from the results we hold
     rather than fetched. Filtered by the event chip, same as the fixtures. */
  function pandaTeams(d, leagueFilter) {
    var table = {};
    function seat(t) {
      if (!t || !t.id) return null;
      var k = String(t.id);
      if (!table[k]) {
        table[k] = {
          id: t.id, name: t.name || t.acronym || '', acronym: t.acronym || t.name || '',
          image: t.image || '', w: 0, l: 0, mapW: 0, mapL: 0, played: 0, form: []
        };
      }
      if (!table[k].image && t.image) table[k].image = t.image;
      return table[k];
    }
    (d.recent || []).forEach(function (m) {
      if (leagueFilter && m.league !== leagueFilter) return;
      if (m.status !== 'finished') return;
      var ts = m.teams || [];
      var a = seat(ts[0]), b = seat(ts[1]);
      if (!a || !b) return;
      var as = ts[0].score, bs = ts[1].score;
      if (as === null || as === undefined || bs === null || bs === undefined) return;
      a.played++; b.played++;
      a.mapW += as; a.mapL += bs;
      b.mapW += bs; b.mapL += as;
      if (as > bs) { a.w++; b.l++; a.form.push('W'); b.form.push('L'); }
      else if (bs > as) { b.w++; a.l++; b.form.push('W'); a.form.push('L'); }
    });
    return Object.keys(table).map(function (k) { return table[k]; })
      .filter(function (t) { return t.played; })
      .sort(function (x, y) {
        if (y.w !== x.w) return y.w - x.w;
        var dx = x.mapW - x.mapL, dy = y.mapW - y.mapL;
        if (dy !== dx) return dy - dx;
        return x.l - y.l;
      });
  }

  function renderPandaTable(file, label) {
    var host = panelFor('panel-table');
    host.innerHTML = '<div class="skeleton">正在统计…</div>';
    archiveGet(file).then(function (d) {

      var game = file === 'cs2.json' ? 'cs2' : 'valorant';
      var current = pandaLeague[game];
      var rows = pandaTeams(d, current);
      if (!rows.length) {
        host.innerHTML = '<div class="empty">这个赛事还没有打完的比赛，' +
          '所以还排不出战绩。<br>换上面的赛事看看。</div>';
        $('status').textContent = label + ' · ' + (current || '全部赛事');
        return;
      }
      var favIds = (favPanda[game] || []).map(function (f) { return String(f.id); });
      host.innerHTML = '<div class="group-name">' + esc(current || '全部赛事') +
        ' · 按胜场排序</div><div class="card"><div class="table-scroll"><table><thead><tr>' +
        '<th class="rk" style="text-align:left">#</th><th class="tm">战队</th>' +
        '<th>胜</th><th>负</th><th>小分</th><th>近况</th></tr></thead><tbody>' +
        rows.map(function (t, i) {
          var fav = favIds.indexOf(String(t.id)) !== -1 ? ' fav' : '';
          var form = t.form.slice(-5).map(function (r) {
            return '<span class="res ' + r + '" style="font-size:11px;margin:0 1px">' +
              (r === 'W' ? '胜' : '负') + '</span>';
          }).join('');
          return '<tr class="' + (i < 3 ? 'z-top' : '') + fav + '"><td class="rk">' + (i + 1) + '</td>' +
            '<td class="tm">' + (t.image
              ? '<img class="crest" src="' + esc(t.image) + '" alt="" loading="lazy" style="width:20px;height:20px">'
              : '<span class="crest" style="width:20px;height:20px"></span>') +
            '<span class="nm">' + esc(t.acronym) + '</span>' +
            '<span class="lol-full">' + esc(t.name) + '</span></td>' +

  var CBA_SHORT = {
    '上海久事': '上海', '北京控股': '北控', '北京首钢': '北京', '南京同曦宙光': '同曦',
    '四川锦城': '四川', '天津先行者': '天津', '宁波町渥': '宁波', '山东高速': '山东',
    '山西汾酒': '山西', '广东东阳光': '广东', '广州智都': '广州', '新疆广汇能源': '新疆',
    '江苏肯帝亚': '江苏', '浙江浙商证券': '浙江', '浙江稠州金租': '稠州',
    '深圳马可波罗': '深圳', '福建晋江文旅': '福建', '辽宁本钢': '辽宁',
    '长白山恩都里': '长白山', '青岛崂山啤酒': '青岛'
  };
  /* A name not in the table is left whole rather than guessed at — sponsors

  function cbaLive() {
    return getJSON(CBA_LIVE).then(function (j) {
      var rows = j && j.data;
      if (!Array.isArray(rows) || !rows.length) return null;
      var num = function (v) {
        return (v === null || v === undefined || v === '') ? null : Number(v);
      };
      var out = rows.map(function (r) {
        /* dates and time are Beijing wall-clock with no zone on them. Stamping
           +08:00 is what stops a 19:35 tip-off being read as UTC and shown a
           day early. */
        var hhmm = String(r.time || '').slice(0, 5);
        var start = r.dates && /^\d{2}:\d{2}$/.test(hhmm)
          ? r.dates + 'T' + hhmm + ':00+08:00' : null;
        var hs = num(r.HomeTeamScore), as = num(r.VisitingTeamScore);
        var played = hs !== null && as !== null;
        var status = Number(r.Status) === 1 ? ''
          : (r.Quarter ? 'Q' + r.Quarter : (played ? 'FT' : ''));
        return {
          start: start, status: status,
          round: r.Round, group: r.GroupName,
          pre: Number(r.ScheduleTypeID) === 3,
          home: { name: r.HomeTeamName, score: hs },
          away: { name: r.VisitingTeamName, score: as }
        };
      }).filter(function (m) { return m.start && m.home.name && m.away.name; });

  var WEIGHT_CN = {

  // ESPN writes the women's divisions as "W Bantamweight", and spells the same

  function weightCN(abbr) {

  function ufcSeason() {

  // ESPN indexes a card by its US Eastern date: UFC 324 starts 2026-01-25T01:30Z
  // but answers to dates=20260124. Local or UTC dates miss by one.
  function ymdET(d) {
    try {
      return d.toLocaleDateString('en-CA', { timeZone: 'America/New_York' }).replace(/-/g, '');
    } catch (e) {
      return d.getUTCFullYear() + String(d.getUTCMonth() + 1).padStart(2, '0') +
        String(d.getUTCDate()).padStart(2, '0');
    }
  }
  // and a card that runs past midnight can still land on the neighbouring day
  function ufcFindEvent(when, wantId) {
    return ufcDay(ymdET(when)).then(function (d) {

      var hit = evs.filter(function (e) { return String(e.id) === String(wantId); })[0];
      if (hit) return hit;
      return ufcDay(ymdET(new Date(when.getTime() - 864e5))).then(function (d2) {
        var alt = (d2 && d2.events) || [];

  function methodOf(comp) {

          (venue.address && venue.address.city ? ' · ' + esc(venue.address.city) : '') + '</span></div>';
      }
      var bc = (bouts[0] || {}).broadcast;
      if (bc) html += '<div class="kv"><span class="k">转播</span><span>' + esc(bc) + '</span></div>';

      html += '<h4>对阵卡</h4><div class="card">' + bouts.map(function (c, i) {
        var cs = c.competitors || [];
        var a = cs[0] || {}, b = cs[1] || {};
        var st = (c.status && c.status.type) || {};
        var done = st.state === 'post';
        var mid;
        if (done) {
          var m = methodOf(c);
          var rd = c.status && c.status.period;
          var clock = (c.status && c.status.displayClock) || '';
          mid = '<div class="method">' + esc(m || '完场') + '</div>' +
            '<div class="method-sub">' + (rd ? 'R' + rd : '') +
            (clock && clock !== '-' && m !== '判定' ? ' ' + esc(clock) : '') + '</div>';
        } else if (st.state === 'in') {
          mid = '<div class="method" style="color:var(--live)">进行中</div>' +
            '<div class="method-sub">' + esc((c.status && c.status.displayClock) || '') + '</div>';
        } else {
          var rounds = ((c.format || {}).regulation || {}).periods;
          mid = '<div class="wclass">' + esc(weightCN(c.type && c.type.abbreviation)) + '</div>' +
            (rounds ? '<div class="method-sub">' + rounds + ' 回合</div>' : '');
        }
        var aName = ((a.athlete || {}).displayName) || '';
        var bName = ((b.athlete || {}).displayName) || '';
        if (done && a.id && b.id) {
          settlePick('fight', c.id, a.winner ? 'home' : (b.winner ? 'away' : ''), '');
        }
        var myBout = pickOf('fight', c.id);
        var boutPick = (!done && a.id && b.id) || (myBout && myBout.result)
          ? pickBarHTML('fight', c.id, 'two', { home: aName, away: bName }) : '';

        /* A fought bout opens into its numbers; one still to come opens into
           the tale of the tape, which is the thing you want before calling it. */
        var opens = a.id && b.id;
        return '<div class="match bout' + (opens ? ' opens' : '') + '"' +
          (i === 0 ? ' style="border-top:none"' : '') +
          (opens ? ' data-bout="' + esc(ev.id) + ':' + esc(c.id) + ':' +
            esc(a.id) + ':' + esc(b.id) + '" data-when="' + esc(c.date || ev.date) + '"' +
            (done ? '' : ' data-preview="1"') : '') + '>' +
          fighterSide(a, true, done && b.winner) +
          '<span class="mid">' + mid +
            (done ? '<div class="wclass" style="margin-top:2px">' +
              esc(weightCN(c.type && c.type.abbreviation)) + '</div>' : '') + '</span>' +
          fighterSide(b, false, done && a.winner) +
          '</div>' +
          (boutPick ? '<div class="match-note" data-home="' + esc(aName) + '" data-away="' +
            esc(bName) + '" data-when="' + esc(c.date || ev.date || '') + '">' + boutPick + '</div>' : '') +
          (done ? scorecardHTML(c) : '');
      }).join('') + '</div>';

      var evDate = new Date(ev.date);
      html += clipSearchHTML(
        String(ev.name || '') + ' highlights ' + (isNaN(evDate) ? '' : dayEN(evDate)),
        String(ev.name || '') + ' 集锦 ' + (isNaN(evDate) ? '' : dayCN(evDate)), '赛后集锦');

      box.innerHTML = html;
    });
  }

  /* ---------- UFC rankings (collected: ESPN only serves them as $refs) ---------- */
  function renderUfcRankings() {
    var host = panelFor('panel-table');
    host.innerHTML = '<div class="skeleton">正在读取排名…</div>';
    $('status').textContent = 'UFC 排名';
    archiveGet('ufc-rankings.json').then(function (d) {
      var divs = (d && d.divisions) || [];
      if (!divs.length) { host.innerHTML = archiveEmpty('UFC 排名'); return; }
      var favIds = favFighters.map(function (f) { return String(f.id); });
      host.innerHTML = divs.map(function (g) {
        var rows = [];
        if (g.champion) rows.push({ rank: 'C', f: g.champion, champ: true });
        (g.ranks || []).forEach(function (r) {
          rows.push({ rank: r.rank, f: r, champ: false });
        });
        if (!rows.length) return '';
        return '<div class="group-name">' + esc(g.nameCN || g.name || '') + '</div>' +
          '<div class="card" style="padding:4px 14px">' + rows.map(function (r) {
            var f = r.f || {};
            var fav = favIds.indexOf(String(f.id)) !== -1 ? ' fav' : '';
            return '<div class="rank-row' + (r.champ ? ' champ' : '') + fav + '">' +
              '<span class="rpos">' + esc(r.champ ? '冠军' : r.rank) + '</span>' +
              (f.flag ? '<img class="flag-sm" src="' + esc(f.flag) + '" alt="" loading="lazy">' : '') +
              '<span class="rnm">' + esc(f.name || '') + '</span>' +
              '<span class="rrec">' + esc(f.record || '') + '</span></div>';
          }).join('') + '</div>';
      }).join('') + archiveFoot(d);
    });
  }

  /* ---------- my fighters ---------- */
  // One request per card day, kept for the life of the page: the scans below
  // overlap heavily and a card that has already been fought never changes.
  var ufcDayCache = {};
  function ufcDayOnce(key) {
    if (!ufcDayCache[key]) {
      ufcDayCache[key] = ufcDay(key).catch(function () { return null; });
    }
    return ufcDayCache[key];
  }
  function ufcChunk(c) {
    return ufcDayOnce(ymdET(new Date(c.startDate))).then(function (day) {
      return { cal: c, events: (day && day.events) || [] };
    });
  }
  function ufcCalendar() {
    return ufcSeason().then(function (d) {
      var cal = (((d && d.leagues) || [])[0] || {}).calendar || [];
      return cal.slice().sort(function (a, b) {
        return new Date(a.startDate) - new Date(b.startDate);
      });
    });
  }

  // Scan the cards either side of today. Good enough for building a name pool;
  // not for finding a given fighter — see ufcCardsForFighters.
  function ufcNearbyCards(back, ahead) {
    return ufcCalendar().then(function (rows) {
      var now = Date.now();
      var idx = rows.findIndex(function (c) {
        return new Date(c.endDate || c.startDate).getTime() >= now;
      });
      if (idx === -1) idx = rows.length;
      return Promise.all(rows.slice(Math.max(0, idx - back), idx + ahead).map(ufcChunk));
    });
  }

  /* A fighter competes two or three times a year, so looking a few cards either
     side of today finds nothing at all — which is why "我的选手" kept saying there
     were no bouts. Take every card still to come (there are only a dozen, and
     that is where a booking would be), then walk backwards through finished
     cards until each fighter has a result, six at a time. */
  function ufcCardsForFighters(ids, backStop) {
    backStop = backStop || 26;
    return ufcCalendar().then(function (rows) {
      var now = Date.now();
      var isPast = function (c) {
        return new Date(c.endDate || c.startDate).getTime() < now;
      };
      var future = rows.filter(function (c) { return !isPast(c); });
      var past = rows.filter(isPast).reverse();
      var order = future.concat(past.slice(0, backStop));

      var wanted = {};
      ids.forEach(function (id) { if (id) wanted[String(id)] = false; });
      var keys = Object.keys(wanted);
      var found = function () {
        return keys.every(function (k) { return wanted[k]; });
      };

      var out = [], i = 0;
      function step() {
        if (i >= order.length) return out;
        if (i >= future.length && (!keys.length || found())) return out;
        var batch = order.slice(i, i + 6);
        i += batch.length;
        return Promise.all(batch.map(ufcChunk)).then(function (chunk) {
          chunk.forEach(function (ch) {
            out.push(ch);
            if (!isPast(ch.cal)) return;   // only a fought card settles a fighter
            ch.events.forEach(function (ev) {
              (ev.competitions || []).forEach(function (cp) {
                (cp.competitors || []).forEach(function (x) {
                  if (String(x.id) in wanted) wanted[String(x.id)] = true;
                });
              });
            });
          });
          return step();
        });
      }
      return step();
    });
  }
  function boutsOfFighter(chunks, id) {
    var out = [];
    chunks.forEach(function (ch) {
      ch.events.forEach(function (ev) {
        (ev.competitions || []).forEach(function (c) {
          var cs = c.competitors || [];
          var me = cs.filter(function (x) { return String(x.id) === String(id); })[0];
          if (!me) return;
          out.push({ ev: ev, comp: c, me: me, opp: cs.filter(function (x) { return x !== me; })[0] || {} });
        });
      });
    });
    return out.sort(function (a, b) { return new Date(a.comp.date) - new Date(b.comp.date); });
  }

  function renderMyFighters() {
    var host = panelFor('panel-mine');
    if (!favFighters.length) {
      host.innerHTML = '<div class="empty">还没有关注选手。<br>点右上角的「选手」挑最多 ' + MAX_FIGHTERS +
        ' 位，这里会显示他们最近一战的结果和下一场的安排。</div>';
      return;
    }
    host.innerHTML = '<div class="skeleton">正在获取选手动态…</div>';
    ufcCardsForFighters(favFighters.map(function (f) { return f.id; })).then(function (chunks) {
      host.innerHTML = favFighters.map(function (f) {
        var list = boutsOfFighter(chunks, f.id);
        var done = list.filter(function (x) {
          return ((x.comp.status || {}).type || {}).state === 'post';
        });
        var next = list.filter(function (x) {
          return ((x.comp.status || {}).type || {}).state !== 'post';
        });
        var rows = '';
        var last = done[done.length - 1];
        if (last) {
          var won = last.me.winner === true;
          var lost = last.opp.winner === true;
          var mark = won ? 'W' : (lost ? 'L' : 'D');
          var m = methodOf(last.comp);
          var rd = last.comp.status && last.comp.status.period;
          rows += '<div class="fix"><span class="when">' +
            esc(fmtDay(new Date(last.comp.date))) + '</span>' +
            '<span class="vs">vs ' + esc((last.opp.athlete && last.opp.athlete.displayName) || '') + '</span>' +
            '<span class="res ' + mark + '">' + (won ? '胜' : lost ? '负' : '平') +
            (m ? ' · ' + esc(m) : '') + (rd ? ' R' + rd : '') + '</span></div>';
        }
        next.slice(0, 2).forEach(function (x) {
          var d0 = new Date(x.comp.date);
          rows += '<div class="fix"><span class="when">' +
            esc(isNaN(d0) ? '待定' : fmtDay(d0)) + '</span>' +
            '<span class="vs">vs ' + esc((x.opp.athlete && x.opp.athlete.displayName) || '') +
            ' · ' + esc(weightCN(x.comp.type && x.comp.type.abbreviation)) + '</span>' +
            '<span class="res" style="color:var(--muted);font-weight:600">' +
            esc(String(x.ev.shortName || x.ev.name || '').split(':')[0]) + '</span></div>';
        });
        if (!rows) rows = '<div class="fix"><span>近期没有查到比赛</span></div>';

        var rec = (last && ((last.me.records || [])[0] || {}).summary) || f.rec || '';
        return '<div class="card team-card"><div class="tc-head">' +
          (f.flag ? '<img class="flag-sm" src="' + esc(f.flag) +
            '" alt="" style="width:26px;height:18px">' : '') +
          '<span class="nm">' + esc(f.name) + '</span>' +
          '<span class="lg">' + esc(rec) + '</span></div>' + rows + '</div>';
      }).join('');
    });
  }

  /* One flat list of 200-odd names was unusable, so the picker is split by
     weight division and shows the face first — that is how anyone actually
     recognises a fighter. Only one division is on screen at a time, so the
     selection lives in fightPicked rather than in the checked inputs. */
  var fightGroups = [];   // [{ key, label, fighters: [...] }]
  var fightGroup = 0;     // which division is on screen
  var fightPicked = [];   // the working selection, saved on 保存
  // UFC and boxing share these tiles; only the cap and where it saves differ
  var fightPickMode = 'ufc';
  function fightCap() { return fightPickMode === 'boxing' ? MAX_BOXERS : MAX_FIGHTERS; }

  // a portrait is not always there; fall back to a neutral silhouette
  var FACE_FALLBACK = 'data:image/svg+xml;utf8,' + encodeURIComponent(
    '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 40 40">' +
    '<rect width="40" height="40" fill="%23d8dedb"/>' +
    '<circle cx="20" cy="15" r="7" fill="%23fff" opacity=".85"/>' +
    '<path d="M6 40a14 14 0 0 1 28 0z" fill="%23fff" opacity=".85"/></svg>');

  function fighterTile(f) {
    var on = fightPicked.some(function (p) { return String(p.id) === String(f.id); });
    return '<button class="fpick" type="button" data-fid="' + esc(f.id) + '"' +
      ' aria-pressed="' + on + '">' +
      (f.champ ? '<span class="fp-belt" title="' + esc(f.champ) + '">🏆</span>' : '') +
      (f.rank ? '<span class="fp-rank">' + esc(f.rank) + '</span>' : '') +
      (f.champ ? '<span class="fp-div">' + esc(f.champ) + '</span>' : '') +
      (f.flag ? '<img class="fp-flag" src="' + esc(f.flag) + '" alt="" loading="lazy">' : '') +
      '<img class="fp-shot" src="' + esc(f.shot || FACE_FALLBACK) + '" alt="" loading="lazy"' +
      ' onerror="this.src=\'' + FACE_FALLBACK + '\'">' +
      '<span class="fp-nm">' + esc(f.name) + '</span>' +
      (f.rec ? '<span class="fp-rec">' + esc(f.rec) + '</span>' : '') +
      '</button>';
  }

  function paintFighterPicker() {
    var bar = fightGroups.map(function (g, i) {
      var n = g.fighters.filter(function (f) {
        return fightPicked.some(function (p) { return String(p.id) === String(f.id); });
      }).length;
      return '<button type="button" data-fgroup="' + i + '" aria-pressed="' +
        (i === fightGroup) + '">' + esc(g.label) + (n ? ' · ' + n : '') + '</button>';
    }).join('');
    var here = (fightGroups[fightGroup] || {}).fighters || [];
    $('picker').innerHTML = '<div class="fpick-bar">' + bar + '</div>' +
      (here.length
        ? '<div class="fpick-grid">' + here.map(fighterTile).join('') + '</div>'
        : '<div class="fpick-none">这个量级还没有名单。</div>');
    $('pickCount').textContent = '已选 ' + fightPicked.length + ' / ' + fightCap();
  }

  function renderFighterPicker() {
    var host = $('picker');
    host.classList.add('faces');
    fightPickMode = 'ufc';
    $('pickHint').textContent = '按量级挑人，最多 ' + MAX_FIGHTERS +
      ' 位。切换量级不会丢掉已选的，选完点保存。';
    host.innerHTML = '<div class="skeleton">正在载入选手…</div>';
    fightPicked = favFighters.slice(0, MAX_FIGHTERS);
    Promise.all([ufcNearbyCards(4, 6), archiveGet('ufc-rankings.json')]).then(function (r) {
      var chunks = r[0], ranked = r[1];
      var ranking = {};   // id -> true, so the card list only carries the rest
      var groups = [];

      ((ranked && ranked.divisions) || []).forEach(function (g) {
        var rows = [];
        [].concat(g.champion || [], g.ranks || []).forEach(function (f) {
          if (!f || !f.id || !f.name) return;
          ranking[String(f.id)] = true;
          rows.push({
            id: f.id, name: f.name, flag: f.flag || '', rec: f.record || '',
            shot: f.headshot || '', rank: f === g.champion ? '冠军' : (f.rank || '')
          });
        });
        if (rows.length) {
          groups.push({ key: g.nameCN || g.name, label: (g.nameCN || g.name || '').replace(/\s*\(.*\)$/, ''), fighters: rows });
        }
      });

      // anyone booked on a nearby card but outside the top 15 still deserves a tile
      var seen = {}, extra = [];
      chunks.forEach(function (ch) {
        ch.events.forEach(function (ev) {
          (ev.competitions || []).forEach(function (c) {
            (c.competitors || []).forEach(function (x) {
              var a = x.athlete || {};
              var id = String(x.id || a.id || '');
              if (!id || !a.displayName || seen[id] || ranking[id]) return;
              seen[id] = 1;
              extra.push({
                id: id, name: a.displayName,
                flag: (a.flag && a.flag.href) || '',
                rec: ((x.records || [])[0] || {}).summary || '',
                shot: (a.headshot && (a.headshot.href || a.headshot)) || '', rank: ''
              });
            });
          });
        });
      });
      if (extra.length) {
        extra.sort(function (a, b) { return a.name.localeCompare(b.name); });
        groups.push({ key: 'card', label: '近期赛事', fighters: extra });
      }

      if (!groups.length) { host.innerHTML = '<div class="skeleton">选手名单没取到</div>'; return; }
      fightGroups = groups;
      fightGroup = Math.min(fightGroup, groups.length - 1);
      paintFighterPicker();
    });
  }

  function toggleFighter(id) {
    var at = -1;
    fightPicked.forEach(function (p, i) { if (String(p.id) === String(id)) at = i; });
    if (at !== -1) { fightPicked.splice(at, 1); paintFighterPicker(); return; }
    if (fightPicked.length >= fightCap()) {
      alert('最多只能选 ' + fightCap() + (fightPickMode === 'boxing' ? ' 位拳手。' : ' 位选手。'));
      return;
    }
    var found = null;
    fightGroups.forEach(function (g) {
      g.fighters.forEach(function (f) { if (!found && String(f.id) === String(id)) found = f; });
    });
    if (!found) return;
    fightPicked.push({ id: found.id, name: found.name, flag: found.flag, rec: found.rec });
    paintFighterPicker();
  }

  function saveFavFighters() {
    favFighters = fightPicked.slice(0, MAX_FIGHTERS);
    lsSet('favFighters', favFighters);
    $('settings').hidden = true;
    setTab('mine');
  }

  /* ---------- boxing: no public ESPN feed, so it comes from the archive ---------- */
  /* A decimal price is really a probability wearing a disguise: 1/price, then
     scaled so the pair sums to 100 — which strips the bookmaker's margin and
     leaves a straight "how likely is each man to win". */
  function oddsToPct(oddsA, oddsB) {
    var a = Number(oddsA), b = Number(oddsB);
    if (!(a > 0) || !(b > 0)) return [null, null];
    var ia = 1 / a, ib = 1 / b, total = ia + ib;
    return [Math.round(ia / total * 100), Math.round(ib / total * 100)];
  }

  function boxSide(x, isLeft, dim) {
    x = x || {};
    var flag = x.flag ? '<img class="flag-sm" src="' + esc(x.flag) + '" alt="" loading="lazy">' : '';
    var shot = x.shot
      ? '<span class="bout-face"><img src="' + esc(x.shot) + '" alt="" loading="lazy"' +
        ' onerror="this.parentNode.style.display=\'none\'"></span>'
      : '';
    // an upcoming bout has no record on file, but the market has a read on it
    var under = x.record ||
      (x.winPct !== null && x.winPct !== undefined ? '胜率 ' + x.winPct + '%' : '');
    var body = '<span class="fwrap"><span class="fnm' + (dim ? ' dim' : '') + '">' +
      (x.winner ? '<span class="win-pip"></span> ' : '') + esc(x.name || 'TBD') + '</span>' +
      (under ? '<span class="frec">' + esc(under) + '</span>' : '') + '</span>';
    return '<span class="side ' + (isLeft ? 'home' : 'away') + '">' +
      (isLeft ? body + flag + shot : shot + flag + body) + '</span>';
  }
  /* Boxing bouts carry no id of their own, so a call is keyed on the two names
     and the date — stable across refreshes, which is all it has to be. */
  function boxBoutKey(b) {
    return [boxerKey((b.a || {}).name), boxerKey((b.b || {}).name),
      String(b.start || '').slice(0, 10)].join('~');
  }

  function boxRow(b) {
    var a = b.a || {}, c = b.b || {};
    var aw = b.winner === 'a', cw = b.winner === 'b';
    var bKey = boxBoutKey(b);
    if (b.winner) settlePick('boxing', bKey, b.winner === 'a' ? 'home' : 'away', '');
    var myBox = pickOf('boxing', bKey);
    var boxPick = (!b.winner && !b.method) || (myBox && myBox.result)
      ? pickBarHTML('boxing', bKey, 'two', { home: a.name || '红方', away: c.name || '蓝方' }) : '';
    var mid;
    if (b.winner || b.method) {
      mid = '<div class="method">' + esc(b.method || '完场') + '</div>' +
        '<div class="method-sub">' + esc((b.round ? 'R' + b.round : '') +
          (b.time ? ' ' + b.time : '')) + '</div>';
    } else {
      var d0 = new Date(b.start || '');
      // the boxing source publishes the date but never the opening bell
      var noClock = isNaN(d0) || b.timeKnown === false;
      mid = '<div class="kick">' + esc(noClock ? '待定' : fmtTime(d0)) + '</div>' +
        '<div class="method-sub">' + esc(b.rounds ? b.rounds + ' 回合' : '') + '</div>';
    }
    var pct = oddsToPct(a.odds, c.odds);
    return '<div class="match bout opens" data-box="' + esc(b.bucket) + ':' + esc(b.idx) + '">' +
      boxSide({ name: a.name, record: a.record, flag: a.flag, shot: boxFaces[a.name],
        winPct: pct[0], winner: aw }, true, cw) +
      '<span class="mid">' + mid +
        (b.weight ? '<div class="wclass" style="margin-top:2px">' + esc(b.weight) + '</div>' : '') +
      '</span>' +
      boxSide({ name: c.name, record: c.record, flag: c.flag, shot: boxFaces[c.name],
        winPct: pct[1], winner: cw }, false, aw) +
      '</div>' +
      (boxPick ? '<div class="match-note" data-home="' + esc(a.name || '') + '" data-away="' +
        esc(c.name || '') + '" data-when="' + esc(b.start || '') + '">' + boxPick + '</div>' : '');
  }

  /* Boxing carries no per-round numbers anywhere public, so opening a bout
     shows what the source does have: where it was, what was on the line, the
     distance, and both men's records going in. */
  /* A boxing record reads "25–2 (1) (20 KOs)": wins–losses–draws, no contests
     in the first bracket, knockouts in the second. Pulling it apart gives the
     same side-by-side the UFC bouts have. */
  function parseBoxRecord(rec) {
    var s = String(rec || '');
    var m = s.match(/(\d+)[–—-](\d+)(?:[–—-](\d+))?/);
    if (!m) return null;
    var ko = (s.match(/\((\d+)\s*KOs?\)/i) || [])[1];
    var w = Number(m[1]), l = Number(m[2]), d = Number(m[3] || 0);
    return {
      w: w, l: l, d: d, ko: ko ? Number(ko) : null,
      total: w + l + d,
      koRate: (ko && w) ? Math.round(Number(ko) / w * 100) : null
    };
  }

  function boxTapeHTML(b) {
    var A = parseBoxRecord((b.a || {}).record);
    var B = parseBoxRecord((b.b || {}).record);
    if (!A && !B) return '';
    var cell = function (r, fn) { return r ? fn(r) : ''; };
    var rows = [

  // faces are looked up by name while rendering a row, so they load first
  var boxFaces = {};
  function renderBoxing() {

      // tag each bout with where it sits in the file, so opening one can find

      var tag = function (list, bucket) {
        return (list || []).map(function (b, i) {

          return b;
        });
      };
      // The books price dozens of small-hall bouts weeks out; showing all of
      // them buries the results people came to read, so the card leads with the

  /* ---------- 关注的拳手 ----------
     Boxing has no governing-body id the way UFC fighters have an ESPN one, so
     a follow is keyed on the name as the source writes it. */
  var favBoxers = lsGet('favBoxers', []);
  var MAX_BOXERS = 5;
  function boxerKey(name) {
    return plain(String(name || '')).replace(/[^a-z ]/g, '').replace(/\s+/g, ' ').trim();
  }
  function boxersInData(d) {
    var seen = {}, list = [];
    [].concat(d.upcoming || [], d.recent || []).forEach(function (b) {
      [b.a, b.b].forEach(function (x) {
        var k = boxerKey(x && x.name);
        if (!k || seen[k]) return;
        seen[k] = 1;
        list.push({ name: x.name, record: x.record || '', flag: x.flag || '' });
      });
    });
    return list.sort(function (a, b) { return a.name.localeCompare(b.name); });
  }
  function boutsOfBoxer(d, key) {
    var out = [];
    ['upcoming', 'recent'].forEach(function (bucket) {
      (d[bucket] || []).forEach(function (b) {
        var side = boxerKey(b.a && b.a.name) === key ? 'a'
          : boxerKey(b.b && b.b.name) === key ? 'b' : '';
        if (side) out.push({ bout: b, side: side, done: bucket === 'recent' });

  }

        next.slice(0, 2).forEach(function (x) {

          var d1 = new Date(last.bout.start || '');
          rows += '<div class="fix"><span class="when">' +
            esc(isNaN(d1) ? '' : fmtDay(d1)) + '</span>' +
            '<span class="vs">vs ' + esc((opp2 && opp2.name) || '') + '</span>' +
            '<span class="res ' + mark + '">' + (won ? '胜' : lost ? '负' : '平') +
            (last.bout.method ? ' · ' + esc(last.bout.method) : '') +

  // Boxing's divisions have a fixed order — heaviest down to lightest. Sorting
  // them any other way (by how many names each holds, say) reads as noise to
  // anyone who follows the sport.
  var BOX_ORDER = [
    '超重量级', '重量级', '次重量级', '轻重量级', '超中量级', '中量级',
    '超次中量级', '次中量级', '超轻量级', '轻量级', '超羽量级', '羽量级',
    '超雏量级', '雏量级', '超蝇量级', '蝇量级', '轻蝇量级', '草量级'
  ];
  function boxWeightRank(w) {
    var i = BOX_ORDER.indexOf(w);
    return i === -1 ? BOX_ORDER.length : i;
  }

  // "WBA·WBC·IBF 超中量级" is the division plus whatever belts were on the line.
  // "非冠军战" is the collector saying it found no division at all.
  function boxWeightLabel(w) {
    var m = String(w || '').match(/[一-龥]+$/);
    var label = m ? m[0] : '';
    return (!label || label === '非冠军战') ? '其他' : label;
  }

  function renderBoxerPicker() {
    var host = $('picker');
    host.classList.add('faces');
    fightPickMode = 'boxing';
    $('pickHint').textContent = '按量级挑人，最多 ' + MAX_BOXERS +
      ' 位。切换量级不会丢掉已选的，选完点保存。';
    host.innerHTML = '<div class="skeleton">正在载入拳手…</div>';
    fightPicked = favBoxers.map(function (f) {
      return { id: f.name, name: f.name, flag: f.flag || '', rec: f.record || '' };
    });

    Promise.all([
      archiveGet('boxing.json'), archiveGet('boxers.json'), archiveGet('box-champions.json')
    ]).then(function (r) {
      var card = r[0], faces = (r[1] || {}).faces || {}, belts = r[2];
      if (!card) { host.innerHTML = '<div class="skeleton">拳手名单没取到</div>'; return; }

      // One entry per boxer. A man's division is the one he has fought in most
      // often, not whichever bout happened to be latest — that was splitting
      // the list into weight classes holding a single name.
      var byName = {};
      ['upcoming', 'recent'].forEach(function (bucket) {
        (card[bucket] || []).forEach(function (b) {
          var w = boxWeightLabel(b.weight);
          [b.a, b.b].forEach(function (x) {
            if (!x || !x.name) return;
            var hit = byName[x.name];
            if (!hit) {
              hit = byName[x.name] = {
                id: x.name, name: x.name, flag: x.flag || '', rec: x.record || '',
                shot: faces[x.name] || '', weights: {},
                soon: false, when: b.start
              };
            }
            if (w && w !== '其他') hit.weights[w] = (hit.weights[w] || 0) + 1;
            if (bucket === 'upcoming') hit.soon = true;
            if (!hit.when || new Date(b.start) > new Date(hit.when)) {
              hit.when = b.start;
              if (x.record) hit.rec = x.record;
            }
            if (!hit.flag && x.flag) hit.flag = x.flag;
          });
        });
      });

      // reigning champions, by division — the working roster of the sport, and
      // current by definition, unlike a name pulled out of a 2022 undercard
      var champOf = {};
      ((belts && belts.divisions) || []).forEach(function (dv) {
        (dv.champions || []).forEach(function (c) {
          if (!c.name) return;
          champOf[c.name] = dv.nameCN || dv.name;
          var hit = byName[c.name];
          if (!hit) {
            hit = byName[c.name] = {
              id: c.name, name: c.name, flag: '', rec: c.record || '',
              shot: faces[c.name] || '', weights: {}, soon: false, when: null
            };
          }
          if (!hit.rec && c.record) hit.rec = c.record;
          if (!hit.shot) hit.shot = faces[c.name] || '';
          hit.champ = dv.nameCN || dv.name;
        });
      });

      var all = Object.keys(byName).map(function (k) {
        var f = byName[k];
        var best = '', n = 0;
        Object.keys(f.weights).forEach(function (w) {
          if (f.weights[w] > n) { n = f.weights[w]; best = w; }
        });
        f.weight = f.champ || best || '其他';
        return f;
      });
      if (!all.length) { host.innerHTML = '<div class="skeleton">拳手名单没取到</div>'; return; }

      // Someone whose last bout in the archive is years old has effectively
      // retired; a current champion always stays regardless.
      var stale = Date.now() - 30 * 30 * 24 * 3600e3;
      var active = all.filter(function (f) {
        if (f.champ || f.soon) return true;
        return f.when && new Date(f.when).getTime() >= stale;
      });
      if (active.length < 12) active = all;

      var groups = [];
      var champs = active.filter(function (f) { return f.champ; });
      if (champs.length) {
        groups.push({
          key: 'champ', label: '现役金腰带',
          // heaviest division first, so the belts read the way they are listed
          fighters: champs.sort(function (a, b) {
            return boxWeightRank(a.champ) - boxWeightRank(b.champ) ||
              a.name.localeCompare(b.name);
          })

      }
      var soon = active.filter(function (f) { return f.soon; });
      if (soon.length) {
        groups.push({ key: 'soon', label: '有安排', fighters: byName_sort(soon) });
      }
      groups.push({ key: 'all', label: '全部', fighters: byName_sort(active) });
      // a division with one lonely name is noise as a tab of its own
      var buckets = {};
      active.forEach(function (f) { (buckets[f.weight] = buckets[f.weight] || []).push(f); });
      var spare = [];
      Object.keys(buckets).sort(function (a, b) { return boxWeightRank(a) - boxWeightRank(b); })
        .forEach(function (w) {
          if (buckets[w].length >= 3 && w !== '其他') {
            groups.push({ key: w, label: w, fighters: byName_sort(buckets[w]) });
          } else {

          }
        });
      if (spare.length) {
        groups.push({ key: 'misc', label: '其他量级', fighters: byName_sort(spare) });
      }

      fightGroups = groups;
      fightGroup = Math.min(fightGroup, groups.length - 1);
      paintFighterPicker();
    });
  }
  function byName_sort(list) {

  /* ---------- notifications (only while this page is open) ---------- */
  function enableNotifications() {
    if (!('Notification' in window)) { alert('这个浏览器不支持网页通知。'); return; }
    Notification.requestPermission().then(function (p) {
      if (p === 'granted') {
        notifyOn = true;
        lsSet('notifyOn', true);
        $('notifyBtn').textContent = '🔔 提醒已开';
        // a page cannot wake itself, so be straight about what this covers
        alert('开赛前 30 分钟提醒，只在这个页面开着的时候有效。\n' +
          '要在关掉之后也收到，用下面的「导出到日历」。');
      }
      else alert('浏览器没给通知权限，可以在浏览器设置里重新打开。');
    });
  }
  /* Reminders for anything on the Today page — every sport, and anything with
     a call riding on it — rather than football alone. A web page cannot wake
     itself, so these only fire while it is open; the .ics export is the one
     that reaches you with the app closed, which the button says out loud. */
  var notified = lsGet('notified', {});
  function notifyStore(key) {
    notified[key] = Date.now();
    // forget anything older than a day so the record cannot grow forever
    Object.keys(notified).forEach(function (k) {
      if (Date.now() - notified[k] > 24 * 3600e3) delete notified[k];
    });
    lsSet('notified', notified);
  }

  function remindFrom(list) {
    if (!notifyOn || !list || !list.length) return;
    list.forEach(function (u) {
      if (!u.when || isNaN(u.when)) return;
      var mins = (u.when - Date.now()) / 60000;
      if (mins <= 0 || mins > 30) return;
      var key = 'k' + (u.id || '') + (+u.when);
      if (notified[key]) return;
      var plain = String(u.title || '').replace(/<[^>]+>/g, ' ').replace(/\s+/g, ' ').trim();
      try {
        new Notification(plain, {
          body: Math.round(mins) + ' 分钟后开始' + (u.tag ? ' · ' + u.tag : ''),
          tag: key
        });
      } catch (e) { return; }
      notifyStore(key);
    });
  }

  function checkKickoffs() {
    if (!notifyOn || !favorites.length) return;
    var favIds = favorites.map(function (f) { return String(f.id); });
    events.forEach(function (ev) {
      var t = teamsOf(ev);
      var ids = [t.home.team && t.home.team.id, t.away.team && t.away.team.id].map(String);
      if (!ids.some(function (i) { return favIds.indexOf(i) !== -1; })) return;
      var mins = (new Date(ev.date) - new Date()) / 60000;
      var key = 'kick-' + ev.id;
      if (mins > 0 && mins <= 60 && !lsGet(key, false)) {
        try {
          new Notification(cn(t.home.team && t.home.team.displayName) + ' vs ' +
            cn(t.away.team && t.away.team.displayName), { body: '约 ' + Math.round(mins) + ' 分钟后开球' });
        } catch (e) {}
        lsSet(key, true);
      }
    });
  }

  $('chips2').addEventListener('change', function (e) {
    var sel = e.target;
    if (sel.dataset.kind === 'lol') {
      lolLeague = sel.value;
      lsSet('lolLeague', lolLeague);
      setTab(tab);
      return;
    }
    if (sel.dataset.kind === 'panda') {
      var g = sel.dataset.game;
      pandaLeague[g] = sel.value || '';
      lsSet(g === 'cs2' ? 'cs2League' : 'valLeague', pandaLeague[g]);
      setTab(tab);
    }
  });

  // open a CS2 / Valorant series to see the maps inside it
  $('panel-fixtures').addEventListener('click', function (e) {
    var b = e.target.closest && e.target.closest('[data-panda]');
    if (!b) return;
    var key = b.dataset.panda;
    pandaOpen[key] = !pandaOpen[key];
    if (esportsGame === 'cs2') renderCs2();
    else if (esportsGame === 'valorant') renderValorant();
  });

  document.querySelector('.seg').addEventListener('click', function (e) {
    var b = e.target.closest('button[data-tab]');
    if (b) setTab(b.dataset.tab);
  });

  /* The podium is the one call that takes more than a tap: a driver goes into
     the next empty place, a place taps clear. Its own handler, because the
     one-tap path below replaces the whole selection each time. */
  document.addEventListener('click', function (e) {
    if (!e.target.closest) return;
    var box = e.target.closest('.podium');
    if (!box || box.classList.contains('settled')) return;
    var driver = e.target.closest('.pod-driver');
    var slot = e.target.closest('.pod-slot');
    if (!driver && !slot) return;
    e.stopPropagation();

    var parts = String(box.dataset.podiumFor || '').split('|');
    if (parts.length !== 2) return;
    var evId = parts[1];
    var mine = pickOf('f1', evId);
    if (mine && mine.result) return;
    var ids = podiumParse(mine && mine.side);

    if (driver) {
      var key = driver.dataset.key;
      if (ids.indexOf(key) !== -1) return;          // already on the podium
      var free = ids.indexOf('');
      if (free === -1) return;                      // full — clear a place first
      ids[free] = key;
    } else {
      ids[Number(slot.dataset.slot) || 0] = '';
    }

    var label = ids.map(function (k) { return k || '—'; }).join(' / ');

    makePick('f1', evId, podiumSide(ids), {
      when: box.dataset.when || '',
      tag: box.dataset.tag || '',
      home: '', away: '',
      pickName: label
    });
    f1PodiumRefresh(box, evId, box.dataset.when || '', box.dataset.tag || '');
  }, true);

  // calls are made from the row itself — one tap, no dialog, no detail panel
  document.addEventListener('click', function (e) {
    var btn = e.target.closest && e.target.closest('.pick-btn');
    if (!btn) return;
    e.stopPropagation();
    var bar = btn.closest('.pick-bar');
    var note = btn.closest('.match-note');
    var parts = String(bar.dataset.pickFor || '').split('|');
    if (parts.length !== 2) return;
    makePick(parts[0], parts[1], btn.dataset.side, {
      home: (note && note.dataset.home) || '',
      away: (note && note.dataset.away) || '',
      when: (note && note.dataset.when) || '',
      tag: (note && note.dataset.tag) || '',
      // a driver pick has no two sides, so remember who was named
      pickName: btn.dataset.name || ''
    });
    [].forEach.call(bar.querySelectorAll('.pick-btn'), function (b) {
      b.classList.toggle('on', b === btn);
    });
  }, true);

  $('panel-fixtures').addEventListener('click', function (e) {
    var g = e.target.closest('.gp');
    if (g) { toggleGp(g); return; }
    var uc = e.target.closest('.ev-head[data-ufc]');
    if (uc) { toggleUfcCard(uc); return; }
    var nb = e.target.closest('.match[data-nba]');
    if (nb) { nbaDetail(nb); return; }
    var lm = e.target.closest('.match[data-lolm]');
    if (lm) { lolDetail(lm); return; }
    var bt = e.target.closest('.match[data-bout]');
    if (bt) { toggleBoutStats(bt); return; }
    var bx = e.target.closest('.match[data-box]');
    if (bx) { toggleBoxBout(bx); return; }
    // a UFC or boxing bout is also a .match, but it carries no event id — without
    // this guard it fell through to the football handler and asked ESPN for
    // summary?event=undefined, which is what "赛况没取到" was
    var b = e.target.closest('.match[data-ev]');
    if (b) toggleDetail(b);
  });

  $('themeBtn').addEventListener('click', cycleTheme);

  $('refreshBtn').addEventListener('click', function () {
    var el = $('refreshBtn');
    el.classList.add('spinning');
    if (sport === 'today') {
      renderToday();
      setTimeout(function () { el.classList.remove('spinning'); }, 500);
      return;
    }
    if (sport === 'esports') {
      lolCache = {};
      setTab(tab);
      setTimeout(function () { el.classList.remove('spinning'); }, 500);
      return;
    }
    if (sport === 'basketball') {
      nbaCache = {};
      setTab(tab);
      setTimeout(function () { el.classList.remove('spinning'); }, 500);
      return;
    }
    if (sport === 'f1') {
      f1Cache = {};
      setTab(tab);
      setTimeout(function () { el.classList.remove('spinning'); }, 500);
      return;
    }
    if (sport === 'fight') {
      ufcCache = {};
      delete archive['boxing.json'];
      delete archive['ufc-rankings.json'];
      setTab(tab);
      setTimeout(function () { el.classList.remove('spinning'); }, 500);
      return;
    }
    summaryCache = {};
    standingsCache = {};
    var tk = viewSeq;
    loadFixtures().then(function () {
      setTimeout(function () { el.classList.remove('spinning'); }, 500);
      if (viewStale(tk)) return;
      if (tab === 'table') loadStandings();
      if (tab === 'mine') renderMine();
      checkKickoffs();
    });
  });

  $('gearBtn').addEventListener('click', function () {
    var p = $('settings');
    p.hidden = !p.hidden;
    $('notifyBtn').hidden = false;   // reminders cover every sport now
    if (!p.hidden) {
      // only the fighter picker uses the photo grid
      if (sport !== 'fight') $('picker').classList.remove('faces');
      if (sport === 'f1') renderDriverPicker();
      else if (sport === 'esports') {
        if (esportsGame === 'lol') renderLolPicker(); else renderPandaPicker();
      }
      else if (sport === 'basketball') renderNbaPicker();
      else if (sport === 'fight') {
        if (fightLeague === 'boxing') renderBoxerPicker(); else renderFighterPicker();
      }
      else renderPicker();
    }
  });

  // the fighter picker is tiles, not checkboxes, so it listens for clicks
  $('picker').addEventListener('click', function (e) {
    var chip = e.target.closest && e.target.closest('[data-fgroup]');
    if (chip) { fightGroup = Number(chip.dataset.fgroup); paintFighterPicker(); return; }
    var tile = e.target.closest && e.target.closest('[data-fid]');
    if (tile) toggleFighter(tile.dataset.fid);
  });

  $('picker').addEventListener('change', function (e) {
    if (sport === 'esports') {
      var capE = esportsGame === 'lol' ? MAX_LOL : MAX_PANDA;
      if (document.querySelectorAll('#picker input:checked').length > capE) {
        e.target.checked = false;
        alert('最多只能选 ' + capE + ' 支战队。');
      }
      $('pickCount').textContent = '已选 ' +
        document.querySelectorAll('#picker input:checked').length + ' / ' + capE;
      return;
    }
    if (sport === 'basketball') {
      if (document.querySelectorAll('#picker input:checked').length > MAX_NBA) {
        e.target.checked = false;
        alert('最多只能选 ' + MAX_NBA + ' 支球队。');
      }
      $('pickCount').textContent = '已选 ' +
        document.querySelectorAll('#picker input:checked').length + ' / ' + MAX_NBA;
      return;
    }
    if (sport === 'f1') {
      if (document.querySelectorAll('#picker input:checked').length > MAX_DRIVERS) {
        e.target.checked = false;
        alert('最多只能选 ' + MAX_DRIVERS + ' 位车手。');
      }
      updateDriverCount();
      return;
    }
    if (sport === 'fight') {
      var cap = fightLeague === 'boxing' ? MAX_BOXERS : MAX_FIGHTERS;
      var who = fightLeague === 'boxing' ? '位拳手' : '位选手';
      if (document.querySelectorAll('#picker input:checked').length > cap) {
        e.target.checked = false;
        alert('最多只能选 ' + cap + ' ' + who + '。');
      }
      $('pickCount').textContent = '已选 ' +
        document.querySelectorAll('#picker input:checked').length + ' / ' + cap;
      return;
    }
    var others = favorites.filter(function (f) { return f.league !== league; }).length;
    if (currentPicked().length + others > MAX_TEAMS) {
      e.target.checked = false;
      alert('最多只能选 ' + MAX_TEAMS + ' 支球队。');
    }
    updateCount();
  });

  $('saveTeams').addEventListener('click', function () {
    if (sport === 'f1') { saveFavDrivers(); return; }
    if (sport === 'basketball') { saveFavNba(); return; }
    if (sport === 'esports') {
      if (esportsGame === 'lol') saveFavLol(); else saveFavPanda();
      return;
    }
    if (sport === 'fight') {
      if (fightLeague === 'boxing') saveFavBoxers(); else saveFavFighters();
      return;
    }
    var kept = favorites.filter(function (f) { return f.league !== league; });
    var picked = currentPicked().map(function (c) {
      return { id: c.value, name: c.dataset.name, raw: c.dataset.raw, league: league };
    });
    favorites = kept.concat(picked).slice(0, MAX_TEAMS);
    lsSet('favTeams', favorites);
    setFavCount();
    $('settings').hidden = true;
    standingsCache = {};
    if (tab === 'table') loadStandings();
    setTab('mine');
  });

  $('notifyBtn').addEventListener('click', enableNotifications);

  /* ---------- boot ---------- */
  /* The inline script in <head> already put data-theme on <html>; this is what
     brings the button's face and the accent set into line with it. */
  applyTheme();
  /* Which build is this phone actually running? An installed app resumed
     from the background never re-navigates, so it can sit on old code long
     after a fix ships — and then a fixed bug still looks broken. The page
     header answers it for free, no build step and nothing to remember to
     bump. */
  (function () {
    var el = $('build');
    if (!el) return;
    var d = new Date(document.lastModified);
    el.textContent = isNaN(d) ? ''
      : '\u7248\u672c ' + (d.getMonth() + 1) + '/' + d.getDate() + ' ' +
        String(d.getHours()).padStart(2, '0') + ':' + String(d.getMinutes()).padStart(2, '0');
  })();
  renderChips();
  renderSportNav();
  setSport(sport);
  setFavCount();
  (function () {
    var bar = $('stickybar');
    if (!bar) return;
    var inset = 0;
    try {
      inset = parseFloat(getComputedStyle(document.documentElement).paddingTop) || 0;
    } catch (e) {}
    /* Slimming the bar was not enough: reading a list is scrolling down, and
       two rows of navigation you are not using still sit on top of it the
       whole way. So it gets out of the way as you scroll down and comes back
       the moment you scroll up.

       It used to flip at a threshold, which read as the bar snapping away
       underneath you. Now the hidden amount tracks the scroll delta one to
       one — scroll down 20px and 20px of it is gone — so it dissolves with
       the gesture instead of reacting to it. Once scrolling stops it settles
       to whichever end it is nearer, so it never rests half-drawn. */
    var HIDE = 1;                 // px of scrolling that hides the whole bar
    var hidden = 0;               // px of the bar currently tucked away
    var stuck = false, lastY = window.scrollY, settle = null, ticking = false;
    var top = $('toTop'), topOn = false;

    function measure() {
      HIDE = Math.max(40, bar.offsetHeight || 80);
    }
    function paint() {
      var p = HIDE ? hidden / HIDE : 0;
      bar.style.setProperty('--tuck', p.toFixed(4));
      bar.classList.toggle('gone', p > .98);
    }
    function onScroll() {
      var y = Math.max(0, window.scrollY);
      var dy = y - lastY;
      lastY = y;

      var hit = bar.getBoundingClientRect().top <= inset + 1;
      if (hit !== stuck) { stuck = hit; bar.classList.toggle('stuck', hit); }

      /* Near the top the bar is always whole — nothing below it has scrolled
         far enough to be worth hiding it for. */
      if (y < 140) hidden = 0;
      else hidden = Math.min(HIDE, Math.max(0, hidden + dy));

      bar.classList.remove('settling');
      paint();

      if (top) {
        var want = y > 700;
        if (want !== topOn) { topOn = want; top.classList.toggle('on', want); }
      }

      clearTimeout(settle);
      settle = setTimeout(function () {
        if (hidden <= 0 || hidden >= HIDE) return;
        bar.classList.add('settling');
        hidden = hidden > HIDE / 2 ? HIDE : 0;
        paint();
      }, 150);
    }
    function onScrollRaf() {
      if (ticking) return;
      ticking = true;
      requestAnimationFrame(function () { ticking = false; onScroll(); });
    }

    measure();
    window.addEventListener('scroll', onScrollRaf, { passive: true });
    window.addEventListener('resize', function () { measure(); onScroll(); });
    onScroll();

    if (top) {
      top.addEventListener('click', function () {
        /* Bring the bar back on the way up, so arriving at the top does not
           need a second flick to reveal the tabs. */
        bar.classList.add('settling');
        hidden = 0;
        paint();
        try { window.scrollTo({ top: 0, behavior: 'smooth' }); }
        catch (e) { window.scrollTo(0, 0); }
      });
    }
  })();

  /* A paper's nameplate takes you to the front page. */
  $('mast').addEventListener('click', function () {
    if (sport !== 'today') setSport('today');
    try { window.scrollTo({ top: 0, behavior: 'smooth' }); }
    catch (e) { window.scrollTo(0, 0); }
  });

  /* An installed app was opening on whatever it had cached, so a shipped
     update could stay invisible on a phone. Check for a new worker on every
     launch, and reload once when one takes over. */
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', function () {
      navigator.serviceWorker.register('sw.js').then(function (reg) {
        reg.update().catch(function () {});
        setInterval(function () { reg.update().catch(function () {}); }, 15 * 60000);
      }).catch(function () {});

      var reloaded = false;
      navigator.serviceWorker.addEventListener('controllerchange', function () {
        if (reloaded) return;   // controllerchange fires again after the reload
        reloaded = true;
        location.reload();
      });
    });
  }

  if (sport === 'football') loadFixtures().then(checkKickoffs);
  else if (sport === 'today') loadFixtures(true);
})();
</script>
