<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="Grandstand — 足球、篮球、F1、电竞的实时赛程、比分与排名">
<meta name="color-scheme" content="light dark">
<meta name="theme-color" content="#12564A">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Grandstand">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png" sizes="192x192">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
  html { padding: env(safe-area-inset-top, 0px) 0 env(safe-area-inset-bottom, 0px); }
  body { margin: 0; }
  img { max-width: 100%; }
  [hidden] { display: none !important; }
</style>
<script>
  /* Runs before the first paint, and deliberately ahead of the stylesheet: a
     pinned theme has to be on <html> by the time anything renders, or someone
     who chose dark gets a full-page flash of paper white on every launch. */
  (function () {
    try {
      var t = JSON.parse(localStorage.getItem('theme') || '"auto"');
      if (t === 'light' || t === 'dark') {
        document.documentElement.setAttribute('data-theme', t);
        var m = document.querySelector('meta[name="color-scheme"]');
        if (m) m.setAttribute('content', t);
      }
    } catch (e) {}
  })();
</script>
<title>Grandstand</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<!-- Noto Serif SC carries the headlines and every name. Google slices CJK by
     unicode-range, so only the handful of blocks the page actually uses get
     downloaded — but each extra weight is another full set of slices, so this
     asks for one. Hierarchy comes from size and rules, never from bolding it. -->
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700&family=Archivo+Narrow:wght@500;600;700&family=Instrument+Serif:ital@0;1&family=Noto+Serif+SC:wght@600&display=swap" rel="stylesheet">
<style>
  :root {
    --ground: #F5F2EA;
    --surface: #FFFDF7;
    --surface-2: #EDE8DB;
    --hairline: #E3DDCE;
    --hairline-strong: #CFC6B1;
    --ink: #17150F;
    --ink-2: #4D4738;
    --muted: #8B8271;
    --accent: #1D5843;
    --accent-soft: #E3EAE2;
    --accent-ink: #103527;
    --on-accent: #FFFDF7;
    --live: #A8341F;
    --live-soft: #F6E6E0;
    --win: #1D6B4C;
    --loss: #A83F42;
    --draw: #8B8271;
    --brass: #8A6A2C;
    --crest-pad: transparent;
    --pitch: #E8EDE3;
    --pitch-line: #CBD5C4;
    --shadow: 0 1px 2px rgba(40, 32, 18, .05), 0 6px 18px -12px rgba(40, 32, 18, .26);
    --display: 'Archivo', 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif;
    --narrow: 'Archivo Narrow', 'Archivo', 'PingFang SC', 'Microsoft YaHei', sans-serif;
    /* Names and headlines are set in serif; the scoreboard numbers stay narrow.
       That contrast is the whole look, so --serif is never used for digits. */
    /* One serif covers both scripts. Noto Serif SC carries its own Latin, so a
       separate Latin serif would have cost another 119KB to draw letters this
       file already has — and mixing two faces inside one fixture ("Arsenal vs
       曼城") is exactly where a mismatch shows. */
    --serif: 'Noto Serif SC', 'Songti SC', Georgia, serif;
    --mast: 'Instrument Serif', 'Noto Serif SC', 'Songti SC', Georgia, serif;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --ground: #16130E;
      --surface: #1D1912;
      --surface-2: #251F17;
      --hairline: #2E271D;
      --hairline-strong: #43392A;
      --ink: #F0EBDF;
      --ink-2: #B5AD9B;
      --muted: #877E6D;
      --accent: #5FAE8D;
      --accent-soft: #182A22;
      --accent-ink: #A5D6BE;
      --on-accent: #0C1710;
      --live: #E0654A;
      --live-soft: #382016;
      --win: #5FA97F;
      --loss: #D4696B;
      --draw: #877E6D;
      --brass: #CFA860;
      --crest-pad: rgba(255, 253, 247, .92);
      --pitch: #1A2419;
      --pitch-line: #2C3828;
      --shadow: 0 1px 2px rgba(0, 0, 0, .4);
    }
  }
  :root[data-theme="dark"] {
    --ground: #16130E;
    --surface: #1D1912;
    --surface-2: #251F17;
    --hairline: #2E271D;
    --hairline-strong: #43392A;
    --ink: #F0EBDF;
    --ink-2: #B5AD9B;
    --muted: #877E6D;
    --accent: #5FAE8D;
    --accent-soft: #182A22;
    --accent-ink: #A5D6BE;
    --on-accent: #0C1710;
    --live: #E0654A;
    --live-soft: #382016;
    --win: #5FA97F;
    --loss: #D4696B;
    --draw: #877E6D;
    --brass: #CFA860;
    --crest-pad: rgba(255, 253, 247, .92);
    --pitch: #1A2419;
    --pitch-line: #2C3828;
    --shadow: 0 1px 2px rgba(0, 0, 0, .4);
  }

  * { box-sizing: border-box; }
  /* Tapping quickly on a phone can turn two taps into a double-tap gesture,
     and the browser then swallows or replays a click while it decides which
     it was. On a toggle that reads as "that tap did nothing" -- exactly what
     the theme button was accused of. manipulation opts out of double-tap
     zoom, and of the click delay that comes with it. */
  button, select, a { touch-action: manipulation; }
  body {
    margin: 0;
    background: var(--ground);
    color: var(--ink);
    font-family: var(--display);
    font-size: 15px;
    line-height: 1.5;
    -webkit-font-smoothing: antialiased;
    font-variant-numeric: tabular-nums;
  }
  .wrap { max-width: 660px; margin: 0 auto; padding: 0 16px; padding-block: 0 56px; }
  .seg { border-bottom: 1px solid var(--hairline); margin-bottom: -1px; }
  /* The tabs and the division picker share a line. A dozen leagues used to be
     a row of chips of their own, which on a phone pushed the first fixture
     most of a screen down. */
  .segrow {
    display: flex; align-items: flex-end; gap: 10px;
    border-bottom: 1px solid var(--hairline);
  }
  .segrow .seg { flex: 1; min-width: 0; border-bottom: none; margin-bottom: 0; }
  .subpick {
    flex: 0 1 auto; max-width: 48%; margin-bottom: 7px;
    font: inherit; font-size: 12px; color: var(--ink-2);
    background: var(--surface-2); border: 1px solid var(--hairline);
    border-radius: 7px; padding: 4px 6px; cursor: pointer;
    text-overflow: ellipsis;
  }
  .subpick:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }

  /* ---- header ---- */
  header {
    padding-block: 18px 0;
    position: relative;
  }
  /* Each sport signs the masthead with something from its own surface: pitch
     stripes, a hardwood grain, a start-line chequer, canvas weave, a pixel
     grid. Kept under 10% opacity — it should register as texture, not decor. */
  header::before {
    content: '';
    position: absolute;
    inset: -4px -16px -2px;
    pointer-events: none;
    z-index: -1;
    opacity: .5;
    -webkit-mask-image: linear-gradient(100deg, #000 0 42%, transparent 78%);
    mask-image: linear-gradient(100deg, #000 0 42%, transparent 78%);
  }
  [data-sport="football"] header::before,
  [data-sport="today"] header::before {
    background: repeating-linear-gradient(90deg,
      color-mix(in srgb, var(--accent) 9%, transparent) 0 22px,
      transparent 22px 44px);
  }
  [data-sport="basketball"] header::before {
    background: repeating-linear-gradient(90deg,
      color-mix(in srgb, var(--accent) 11%, transparent) 0 1px,
      transparent 1px 9px);
  }
  [data-sport="f1"] header::before {
    background:
      repeating-conic-gradient(color-mix(in srgb, var(--accent) 13%, transparent) 0 25%,
        transparent 0 50%) 0 0 / 14px 14px;
  }
  [data-sport="fight"] header::before {
    background: repeating-linear-gradient(45deg,
      color-mix(in srgb, var(--accent) 8%, transparent) 0 2px,
      transparent 2px 7px);
  }
  [data-sport="esports"] header::before {
    background:
      radial-gradient(color-mix(in srgb, var(--accent) 26%, transparent) 1.1px, transparent 1.2px)
      0 0 / 11px 11px;
  }
  /* Only the navigation follows you down the page, and it slims down once it
     detaches from the title so it stops feeling like a wall on top of the list. */
  .stickybar {
    position: sticky;
    top: env(safe-area-inset-top, 0px);
    z-index: 20;
    background: var(--ground);
    margin: 0 -16px;
    padding: 10px 16px 0;
    border-bottom: 1px solid transparent;
    transition: box-shadow .18s ease, border-color .18s ease, padding .18s ease;
  }
  .stickybar.stuck {
    border-bottom-color: var(--hairline);
    box-shadow: 0 10px 18px -18px rgba(0, 0, 0, .55);
    padding-top: 6px;
  }
  /* --tuck runs 0 → 1 and is driven straight from the scroll delta, so the bar
     slides and fades under the finger instead of snapping away at a threshold.
     No transition while it tracks — that would lag behind the gesture. The
     .settling class is added only for the snap after scrolling stops. */
  .stickybar {
    transform: translateY(calc(var(--tuck, 0) * -104%));
    opacity: calc(1 - var(--tuck, 0) * .88);
  }
  .stickybar.gone { pointer-events: none; }
  .stickybar.settling {
    transition: transform .2s cubic-bezier(.4, 0, .2, 1), opacity .2s ease,
                box-shadow .18s ease, border-color .18s ease, padding .18s ease;
  }
  @media (prefers-reduced-motion: reduce) {
    .stickybar, .stickybar.settling { transition: none; }
  }

  /* Once the bar is gone, this is the way back up without a long swipe. */
  .totop {
    position: fixed;
    right: 14px;
    bottom: calc(16px + env(safe-area-inset-bottom, 0px));
    z-index: 30;
    width: 40px; height: 40px;
    display: flex; align-items: center; justify-content: center;
    background: var(--surface);
    border: 1px solid var(--hairline-strong);
    border-radius: 2px;
    color: var(--ink-2);
    font-size: 15px;
    box-shadow: 0 2px 10px -4px rgba(40, 32, 18, .35);
    cursor: pointer;
    opacity: 0; transform: translateY(8px); pointer-events: none;
    transition: opacity .18s ease, transform .18s ease;
  }
  .totop.on { opacity: 1; transform: none; pointer-events: auto; }
  .totop:active { transform: scale(.92); }
  @media (prefers-reduced-motion: reduce) { .totop { transition: none; } }
  .stickybar.stuck .chips { display: none; }
  .stickybar.stuck .sportnav { margin-top: 0; padding: 2px; }
  .stickybar.stuck .sportnav button { padding: 4px 13px; font-size: 12.5px; }
  .stickybar.stuck .seg button { padding: 6px 0 8px; }
  .head-row { display: flex; align-items: flex-start; justify-content: space-between; gap: 12px; }
  .eyebrow {
    font-family: var(--narrow);
    font-size: 11px;
    font-weight: 600;
    letter-spacing: .16em;
    text-transform: uppercase;
    color: var(--muted);
  }
  /* The masthead is the one place Instrument Serif appears — it is a display
     face and gets fragile below ~24px, so nothing else borrows it. */
  h1 {
    font-family: var(--mast);
    font-size: 30px;
    font-weight: 400;
    letter-spacing: 0;
    margin: 0;
    line-height: 1.08;
    text-wrap: balance;
  }
  /* The masthead doubles as the way home, the way a paper's nameplate does. */
  #mast {
    background: none; border: none; padding: 0; margin: 0;
    font: inherit; color: inherit; cursor: pointer;
    display: block; text-align: left;
  }
  #mast:active { opacity: .6; }
  #mast:focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; }
  .head-row .eyebrow { margin-top: 4px; }
  .tags { display: inline-flex; gap: 4px; flex-wrap: wrap; vertical-align: 1px; }
  .tag {
    font-family: var(--narrow); font-size: 9.5px; font-weight: 700;
    letter-spacing: .04em; white-space: nowrap;
    background: var(--accent-soft); color: var(--accent-ink);
    border-radius: 3px; padding: 1px 5px;
  }
  .tag.hot { background: color-mix(in srgb, var(--win) 18%, transparent); color: var(--win); }
  .tag.cold { background: color-mix(in srgb, var(--loss) 15%, transparent); color: var(--loss); }
  .story {
    font-size: 12px; color: var(--ink-2); line-height: 1.5;
    padding: 2px 0 0;
  }
  .match-note {
    display: flex; align-items: center; gap: 8px; flex-wrap: wrap;
    padding: 0 13px 10px; margin-top: -4px;
  }
  .match-note .story { padding: 0; }
  .pick-bar { display: inline-flex; gap: 4px; margin-left: auto; }
  .pick-btn {
    font-family: var(--serif); font-size: 11.5px; font-weight: 600;
    cursor: pointer;
    background: transparent; color: var(--muted);
    border: 1px solid var(--hairline); border-radius: 2px;
    padding: 3px 11px; white-space: nowrap;
    transition: transform .12s ease, background .12s ease, color .12s ease;
  }
  .pick-btn:hover { border-color: var(--accent); color: var(--accent); }
  .pick-btn:active { transform: scale(.94); }
  .pick-btn.on {
    background: var(--accent); border-color: var(--accent);
    color: var(--on-accent); font-weight: 600;
  }
  .pick-done {
    margin-left: auto; font-size: 11.5px; font-weight: 700; white-space: nowrap;
  }
  .pick-done.hit { color: var(--win); }
  .pick-done.miss { color: var(--muted); }
  .rec-card { padding: 14px 6px 12px; }
  .rec-row { display: flex; }
  .rec-cell {
    flex: 1; display: flex; flex-direction: column; align-items: center; gap: 3px;
    border-right: 1px solid var(--hairline);
  }
  .rec-cell:last-child { border-right: none; }
  .rec-num {
    font-size: 21px; font-weight: 700; color: var(--ink);
    font-variant-numeric: tabular-nums; line-height: 1.1;
  }
  .rec-num.hot { color: var(--accent); }
  .rec-lbl { font-size: 10.5px; color: var(--muted); }
  .rec-line {
    text-align: center; font-size: 12px; color: var(--ink-2);
    padding: 11px 12px 2px; margin-top: 10px;
    border-top: 1px solid var(--hairline);
  }
  .sport-mark {
    color: var(--accent); font-size: 13px; margin-right: 6px;
    display: inline-block; vertical-align: -1px; letter-spacing: 0;
  }
  /* the active sport gets the accent, not just a lighter chip */
  .sportnav button[aria-pressed="true"] { box-shadow: none; }
  /* The sport row used to be pills inside a tray — two nested containers before
     any content. It is now flat on the page, and the tray it lost is one less
     horizontal band between the masthead and the first fixture. Sport reads as
     a filled block, sub-tabs below as an underline, so the two never blur. */
  .sportnav {
    display: flex;
    gap: 3px;
    margin-top: 14px;
    overflow-x: auto;
    scrollbar-width: none;
  }
  .sportnav::-webkit-scrollbar { display: none; }
  .sportnav button {
    flex: 0 0 auto;
    border: none;
    background: none;
    font-family: var(--serif);
    font-size: 13.5px;
    font-weight: 600;
    color: var(--muted);
    padding: 6px 13px;
    border-radius: 2px;
    cursor: pointer;
    white-space: nowrap;
  }
  .sportnav button[aria-pressed="true"] {
    background: var(--accent);
    color: var(--on-accent);
    box-shadow: none;
  }
  .sportnav button:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
  .soon {
    text-align: center;
    padding: 56px 20px;
    color: var(--muted);
  }
  .soon .big {
    font-family: var(--narrow);
    font-size: 21px;
    font-weight: 700;
    letter-spacing: .04em;
    color: var(--ink);
    margin-bottom: 8px;
  }
  .soon p { margin: 0 auto; max-width: 30em; font-size: 13.5px; line-height: 1.7; }
  .head-actions { display: flex; gap: 8px; flex-shrink: 0; padding-top: 6px; }
  .icon-btn {
    background: var(--surface);
    border: 1px solid var(--hairline);
    color: var(--ink-2);
    border-radius: 2px;
    height: 34px;
    padding: 0 13px;
    font: inherit;
    font-size: 13px;
    cursor: pointer;
    display: inline-flex;
    align-items: center;
    gap: 6px;
  }
  .icon-btn:hover { border-color: var(--hairline-strong); }
  .icon-btn:focus-visible, .chip:focus-visible, .seg button:focus-visible, .match:focus-visible {
    outline: 2px solid var(--accent); outline-offset: 2px;
  }
  .spin { display: inline-block; transition: transform .6s ease; }
  .spinning .spin { transform: rotate(360deg); }

  .chips {
    display: flex;
    gap: 6px;
    overflow-x: auto;
    margin-top: 14px;
    padding-bottom: 2px;
    scrollbar-width: none;
  }
  .chips::-webkit-scrollbar { display: none; }
  .chip {
    flex: 0 0 auto;
    font-family: var(--narrow);
    font-weight: 600;
    font-size: 14px;
    letter-spacing: .02em;
    padding: 6px 13px;
    border-radius: 2px;
    border: 1px solid var(--hairline);
    background: var(--surface);
    color: var(--ink-2);
    cursor: pointer;
  }
  .chip[aria-pressed="true"] {
    background: var(--accent);
    border-color: var(--accent);
    color: var(--on-accent);
  }
  .seg {
    display: flex;
    gap: 22px;
    margin-top: 12px;
  }
  .seg button {
    background: none;
    border: none;
    padding: 8px 0 10px;
    font: inherit;
    font-size: 14px;
    font-weight: 600;
    color: var(--muted);
    cursor: pointer;
    border-bottom: 2px solid transparent;
    margin-bottom: -1px;
  }
  .seg button[aria-selected="true"] { color: var(--ink); border-bottom-color: var(--accent); }
  .seg .badge {
    display: inline-block;
    min-width: 17px;
    margin-left: 5px;
    padding: 0 5px;
    border-radius: 999px;
    background: var(--surface-2);
    color: var(--muted);
    font-size: 11px;
    font-weight: 600;
    vertical-align: 1px;
  }

  .status-line {
    font-size: 12px;
    color: var(--muted);
    margin: 14px 0 4px;
    display: flex;
    align-items: center;
    gap: 6px;
  }
  /* cleared on every tab switch, so a panel that sets no status takes no room
     rather than showing the last panel's line */
  .status-line:empty { display: none; }
  .dot {
    width: 7px; height: 7px; border-radius: 50%;
    background: var(--live);
    box-shadow: 0 0 0 0 var(--live);
    animation: pulse 2s infinite;
  }
  /* ---- motion ----
     Everything here is short and has somewhere to be. A list that slides in
     tells you it just changed; a score that flips tells you it just moved.
     Nothing loops except the two things that are genuinely still happening. */
  @keyframes rise {
    from { opacity: 0; transform: translateY(7px); }
    to { opacity: 1; transform: none; }
  }
  @keyframes flip-in {
    from { opacity: 0; transform: translateY(-60%) scale(.9); }
    to { opacity: 1; transform: none; }
  }
  @keyframes breathe {
    0%, 100% { box-shadow: inset 2px 0 0 var(--live), 0 0 0 0 transparent; }
    50% { box-shadow: inset 2px 0 0 var(--live), 0 0 13px -4px var(--live); }
  }
  @keyframes sweep {
    from { background-position: -140% 0; }
    to { background-position: 240% 0; }
  }

  /* the fixtures/table/mine panels lift in when their content is replaced */
  .panel-in > * { animation: rise .26s cubic-bezier(.2, .7, .3, 1) backwards; }
  .panel-in > *:nth-child(1) { animation-delay: .01s; }
  .panel-in > *:nth-child(2) { animation-delay: .05s; }
  .panel-in > *:nth-child(3) { animation-delay: .09s; }
  .panel-in > *:nth-child(4) { animation-delay: .13s; }
  .panel-in > *:nth-child(n+5) { animation-delay: .16s; }

  .match.live { animation: breathe 2.6s ease-in-out infinite; }
  .score.bumped { animation: flip-in .34s cubic-bezier(.2, .8, .3, 1); }

  .skeleton {
    background: linear-gradient(100deg,
      transparent 20%, color-mix(in srgb, var(--accent) 12%, transparent) 50%, transparent 80%)
      0 0 / 220% 100%;
    animation: sweep 1.25s linear infinite;
    border-radius: 8px;
  }

  @keyframes pulse {
    0% { box-shadow: 0 0 0 0 color-mix(in srgb, var(--live) 55%, transparent); }
    70% { box-shadow: 0 0 0 7px transparent; }
    100% { box-shadow: 0 0 0 0 transparent; }
  }
  @media (prefers-reduced-motion: reduce) {
    .dot, .match.live, .skeleton, .score.bumped { animation: none; }
    .panel-in > * { animation: none; }
    .spin { transition: none; }
  }

  /* ---- day groups + matches ---- */
  .day { margin-top: 22px; }
  /* A dateline, not a bar: the date sits on the left and a hairline carries
     across to the margin. The count rides on that rule rather than crowding
     the date, so the eye reads day → rule → fixtures. */
  .day-head {
    display: flex;
    align-items: baseline;
    gap: 9px;
    margin-bottom: 8px;
    padding-left: 2px;
  }
  .day-head::before {
    content: '';
    order: 1;
    flex: 1;
    height: 1px;
    background: var(--hairline);
    transform: translateY(-4px);
  }
  .day-head .n { order: 2; }
  .day-head .jump { order: 3; }
  .day-head .d {
    font-family: var(--serif);
    font-size: 16px;
    font-weight: 600;
    letter-spacing: 0;
  }
  .day-head .n {
    font-family: var(--narrow);
    font-size: 11px; font-weight: 600; letter-spacing: .1em;
    text-transform: uppercase; color: var(--muted);
  }
  .day.past .day-head .d { color: var(--muted); }
  .day.past .card { opacity: .88; }
  .jump {
    margin-left: auto;
    background: var(--surface);
    border: 1px solid var(--hairline);
    border-radius: 2px;
    color: var(--ink-2);
    font: inherit;
    font-size: 11.5px;
    padding: 3px 10px;
    cursor: pointer;
  }
  .jump:hover { border-color: var(--hairline-strong); }
  /* Not scoped to .day-head: the same badge marks the next grand prix and the
     next fight card, and there it was inheriting nothing — so it rendered as
     bare text welded to the end of the name ("阿塞拜疆大奖赛下一站"). */
  .today {
    display: inline-block;
    margin-left: 6px;
    font-family: var(--narrow);
    font-size: 10.5px;
    font-weight: 700;
    letter-spacing: .08em;
    color: var(--accent-ink);
    background: var(--accent-soft);
    border-radius: 2px;
    padding: 1px 6px;
    vertical-align: 1px;
    white-space: nowrap;
  }
  .day-head .today { margin-left: 0; }
  /* Printed on the page, not floating above it. The shadow is gone in light —
     paper does not cast one on itself — and comes back in dark, where a warm
     panel needs some separation from the ground to read as a distinct block. */
  .card {
    background: var(--surface);
    border: 1px solid var(--hairline);
    border-radius: 4px;
    overflow: hidden;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) .card { box-shadow: var(--shadow); }
  }
  :root[data-theme="dark"] .card { box-shadow: var(--shadow); }
  .match {
    display: grid;
    grid-template-columns: 1fr 78px 1fr;
    align-items: center;
    gap: 8px;
    width: 100%;
    background: none;
    border: none;
    border-top: 1px solid var(--hairline);
    padding: 11px 12px;
    font: inherit;
    color: inherit;
    text-align: left;
    cursor: pointer;
  }
  .match:first-child { border-top: none; }
  .match:hover { background: var(--surface-2); }
  .side { display: flex; align-items: center; gap: 8px; min-width: 0; }
  .side.home { justify-content: flex-end; }
  .side.home .nm { text-align: right; }
  /* Serif names are always 600, the one CJK weight loaded. A Song face at 500
     goes hairline-thin around 14px and reads as grey even when the colour is
     solid ink, so the weight is doing legibility work, not emphasis — nothing
     here ever asks for a heavier one, which would synthesise a bold on the
     Chinese while the Latin used a real cut. */
  .nm {
    font-family: var(--serif);
    font-size: 15px;
    font-weight: 600;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .nm.dim { color: var(--muted); }
  .crest {
    width: 24px; height: 24px;
    flex-shrink: 0;
    object-fit: contain;
    border-radius: 50%;
    background: var(--crest-pad);
  }
  span.crest {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    font-family: var(--narrow);
    font-size: 9px;
    font-weight: 700;
    color: #fff;
    letter-spacing: .02em;
  }
  .mid { text-align: center; }
  .score {
    font-family: var(--narrow);
    font-size: 19px;
    font-weight: 700;
    letter-spacing: .01em;
    white-space: nowrap;
    color: var(--ink);
  }
  .kick {
    font-family: var(--narrow); font-size: 16px; font-weight: 600;
    font-variant-numeric: tabular-nums; color: var(--ink-2);
  }
  .state {
    font-family: var(--narrow);
    font-size: 10.5px;
    font-weight: 600;
    letter-spacing: .09em;
    text-transform: uppercase;
    color: var(--muted);
    margin-top: 1px;
  }
  .state.is-live { color: var(--live); }

  /* Three states, three densities. Everything used to be the same row at the
     same weight, so nothing on screen said "look here first": a match kicking
     off in ten minutes read exactly like one from last Tuesday. */
  .match.live {
    background: linear-gradient(90deg, var(--live-soft), transparent 60%);
    padding-block: 15px;
  }
  .match.live .score { font-size: 22px; }
  .match.live .nm { font-size: 15px; }
  .match.live .crest { width: 28px; height: 28px; }

  .day.past .match { padding-block: 8px; }
  .day.past .score { font-size: 15px; font-weight: 600; color: var(--ink-2); }
  .day.past .crest { width: 19px; height: 19px; }
  .day.past .nm { font-size: 12.5px; }
  .day.past .state { font-size: 9.5px; }

  /* the score is the thing people scan for, so it reads as a number, not text */
  .score {
    font-variant-numeric: tabular-nums;
    letter-spacing: -.01em;
  }

  .detail {
    border-top: 1px solid var(--hairline);
    background: var(--surface-2);
    padding: 12px 14px 15px;
    font-size: 13px;
    color: var(--ink-2);
  }
  /* A section label is a label, not a headline — it stays narrow and small, and
     a hairline runs off its right edge to the margin. That rule, repeated, is
     what holds the page together in place of boxes and fills. */
  .detail h4 {
    display: flex;
    align-items: center;
    gap: 9px;
    font-family: var(--narrow);
    font-size: 11px;
    font-weight: 700;
    letter-spacing: .12em;
    text-transform: uppercase;
    color: var(--muted);
    margin: 16px 0 7px;
  }
  .detail h4::after {
    content: '';
    flex: 1;
    height: 1px;
    background: var(--hairline);
  }
  .detail h4:first-child { margin-top: 0; }
  .goals { display: grid; gap: 3px; }
  .goal { display: flex; gap: 7px; align-items: baseline; font-size: 13px; }
  .goal .min {
    font-family: var(--narrow);
    font-weight: 700;
    color: var(--accent);
    min-width: 34px;
  }
  .goal.away { flex-direction: row-reverse; text-align: right; }
  .goal.away .min { text-align: right; }
  .odds-bar {
    display: flex;
    height: 7px;
    border-radius: 4px;
    overflow: hidden;
    background: var(--hairline);
    margin: 7px 0 5px;
  }
  .odds-bar i { display: block; }
  .odds-bar .h { background: var(--accent); }
  .odds-bar .d { background: var(--draw); }
  .odds-bar .a { background: var(--loss); }
  .odds-key { display: flex; justify-content: space-between; font-size: 12px; gap: 8px; }
  .odds-key b { font-weight: 600; }
  .kv { display: flex; gap: 10px; font-size: 12.5px; padding: 3px 0; }
  .kv .k { color: var(--muted); flex: 0 0 auto; min-width: 74px; }
  .lineup { font-size: 12.5px; line-height: 1.65; }
  .lineup b { font-weight: 600; }
  .form { display: inline-flex; gap: 3px; vertical-align: -3px; margin-left: 4px; }
  .f {
    width: 16px; height: 16px; border-radius: 4px;
    font-size: 9px; font-weight: 700; color: #fff;
    display: inline-flex; align-items: center; justify-content: center;
    font-family: var(--narrow);
  }
  .f.W { background: var(--win); }
  .f.D { background: var(--draw); }
  .f.L { background: var(--loss); }

  /* ---- standings ---- */
  .table-scroll { overflow-x: auto; }
  table { border-collapse: collapse; width: 100%; min-width: 460px; font-size: 13.5px; }
  thead th {
    font-family: var(--narrow);
    font-size: 11px;
    font-weight: 700;
    letter-spacing: .1em;
    text-transform: uppercase;
    color: var(--muted);
    text-align: right;
    padding: 9px 6px;
    border-bottom: 1px solid var(--hairline);
    white-space: nowrap;
  }
  thead th.tm, tbody td.tm { text-align: left; }
  tbody td { padding: 8px 6px; text-align: right; border-bottom: 1px solid var(--hairline); white-space: nowrap; }
  tbody tr:last-child td { border-bottom: none; }
  td.tm { display: flex; align-items: center; gap: 8px; }
  td.tm .nm { font-size: 13.5px; }
  td.rk { position: relative; padding-left: 14px; text-align: left; color: var(--muted); font-size: 12.5px; }
  td.rk::before {
    content: '';
    position: absolute;
    left: 2px; top: 6px; bottom: 6px;
    width: 3px; border-radius: 2px;
    background: transparent;
  }
  tr.z-top td.rk::before { background: var(--accent); }
  tr.z-mid td.rk::before { background: var(--hairline-strong); }
  tr.z-drop td.rk::before { background: var(--loss); }
  td.pts { font-weight: 700; color: var(--ink); }
  .box-team {
    font-family: var(--serif); font-size: 13.5px; font-weight: 600;
    color: var(--ink); margin: 12px 0 2px;
  }
  .box-team:first-of-type { margin-top: 2px; }
  .starter {
    font-family: var(--narrow); font-size: 9px; font-weight: 700;
    letter-spacing: .06em; background: var(--accent-soft); color: var(--accent-ink);
    border-radius: 2px; padding: 1px 4px; flex-shrink: 0;
  }
  .bpos { font-family: var(--narrow); font-size: 10.5px; color: var(--muted); flex-shrink: 0; }

  /* ---- F1 podium call ---- */
  .pod-slots { display: flex; gap: 6px; }
  .pod-slot {
    flex: 1; min-width: 0; cursor: pointer;
    display: flex; flex-direction: column; align-items: flex-start; gap: 2px;
    background: none; border: 1px solid var(--hairline); border-radius: 2px;
    padding: 7px 9px; font: inherit; text-align: left;
  }
  .pod-slot b {
    font-family: var(--narrow); font-size: 9.5px; font-weight: 700;
    letter-spacing: .1em; color: var(--muted);
  }
  .pod-slot span {
    font-family: var(--serif); font-size: 13px; font-weight: 600; color: var(--muted);
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 100%;
  }
  .pod-slot.on { border-color: var(--accent); background: var(--accent-soft); }
  .pod-slot.on b { color: var(--accent-ink); }
  .pod-slot.on span { color: var(--accent-ink); }
  .pod-field { display: flex; flex-wrap: wrap; gap: 5px; margin-top: 9px; }
  .pod-driver {
    cursor: pointer; font-family: var(--serif); font-size: 11.5px; font-weight: 600;
    background: none; color: var(--ink-2);
    border: 1px solid var(--hairline); border-radius: 2px; padding: 4px 10px;
  }
  .pod-driver:hover:not(:disabled) { border-color: var(--accent); color: var(--accent); }
  .pod-driver.used { opacity: .35; cursor: default; }
  .pod-hint {
    font-family: var(--narrow); font-size: 10.5px; letter-spacing: .06em;
    color: var(--muted); margin-top: 8px;
  }
  .pod-row {
    display: flex; align-items: baseline; gap: 9px;
    padding: 8px 0; border-bottom: 1px solid var(--hairline);
  }
  .pod-row:last-child { border-bottom: none; }
  .pod-place {
    font-family: var(--narrow); font-size: 10px; font-weight: 700;
    letter-spacing: .1em; color: var(--muted); width: 30px; flex-shrink: 0;
  }
  .pod-name { font-family: var(--serif); font-size: 13.5px; font-weight: 600; }
  .pod-row.exact .pod-name { color: var(--win); }
  .pod-row.off .pod-name { color: var(--muted); }
  .pod-real {
    margin-left: auto; font-size: 11.5px; color: var(--muted); white-space: nowrap;
  }
  tr.fav { background: var(--accent-soft); }
  .legend { display: flex; flex-wrap: wrap; gap: 14px; font-size: 11.5px; color: var(--muted); margin-top: 10px; }
  .legend i { display: inline-block; width: 3px; height: 11px; border-radius: 2px; vertical-align: -1px; margin-right: 5px; }
  /* Same dateline rule as .day-head and .detail h4 — every label on the page
     hands off to a hairline, so the eye learns one divider instead of three. */
  .group-name {
    display: flex;
    align-items: center;
    gap: 9px;
    font-family: var(--narrow);
    font-size: 12px;
    font-weight: 700;
    letter-spacing: .1em;
    text-transform: uppercase;
    color: var(--muted);
    margin: 18px 0 6px;
  }
  .group-name::after {
    content: '';
    flex: 1;
    height: 1px;
    background: var(--hairline);
  }

  /* ---- my teams ---- */
  .team-card { margin-top: 12px; }
  .team-card .tc-head {
    display: flex;
    align-items: center;
    gap: 9px;
    padding: 12px 14px;
    border-bottom: 1px solid var(--hairline);
  }
  .team-card .tc-head .nm { font-size: 15px; font-weight: 700; }
  .team-card .tc-head .lg { margin-left: auto; font-size: 11.5px; color: var(--muted); font-family: var(--narrow); letter-spacing: .08em; text-transform: uppercase; }
  .fix { display: flex; gap: 10px; align-items: baseline; padding: 9px 14px; border-bottom: 1px solid var(--hairline); font-size: 13px; }
  .fix:last-child { border-bottom: none; }
  .fix .when { color: var(--muted); font-size: 12px; min-width: 86px; flex-shrink: 0; }
  .fix .res { font-weight: 700; margin-left: auto; }
  .fix .res.W { color: var(--win); }
  .fix .res.L { color: var(--loss); }
  .fix .res.D { color: var(--draw); }
  .news-item { padding: 11px 14px; border-bottom: 1px solid var(--hairline); }
  .news-item:last-child { border-bottom: none; }
  .news-item .hl { font-size: 13.5px; font-weight: 600; margin-bottom: 3px; }
  .news-item p { margin: 0 0 5px; font-size: 12.5px; color: var(--muted); }
  .news-item a { font-size: 12px; color: var(--accent); text-decoration: none; }
  .news-item a:hover { text-decoration: underline; }

  /* ---- settings ---- */
  .panel {
    background: var(--surface);
    border: 1px solid var(--hairline);
    border-radius: 10px;
    padding: 15px;
    margin-top: 14px;
    box-shadow: var(--shadow);
  }
  .panel p.hint { margin: 0 0 10px; font-size: 12.5px; color: var(--muted); }
  .picker { max-height: 260px; overflow-y: auto; border: 1px solid var(--hairline); border-radius: 8px; }
  .picker label {
    display: flex;
    align-items: center;
    gap: 9px;
    padding: 8px 11px;
    border-bottom: 1px solid var(--hairline);
    font-size: 13.5px;
    cursor: pointer;
  }
  .picker label:last-child { border-bottom: none; }
  .picker input { accent-color: var(--accent); width: 16px; height: 16px; flex-shrink: 0; }
  .panel-foot { display: flex; align-items: center; gap: 10px; margin-top: 12px; flex-wrap: wrap; }
  .btn {
    background: var(--accent);
    color: var(--on-accent);
    border: none;
    border-radius: 7px;
    padding: 8px 16px;
    font: inherit;
    font-size: 13px;
    font-weight: 600;
    cursor: pointer;
  }
  .count { font-size: 12px; color: var(--muted); }

  /* ---- match stats comparison ---- */
  .stat { display: grid; grid-template-columns: 46px 1fr 46px; gap: 5px 8px; align-items: center; margin: 9px 0; }
  .stat .sv { font-size: 12.5px; font-weight: 600; color: var(--ink); }
  .stat .sv.r { text-align: right; }
  .stat .sl { text-align: center; font-size: 11px; color: var(--muted); }
  .sbar { grid-column: 1 / -1; display: grid; grid-template-columns: 1fr 1fr; gap: 4px; }
  .sbar .lw { display: flex; justify-content: flex-end; }
  .sbar i { display: block; height: 5px; border-radius: 3px; min-width: 2px; }
  .sbar .lw i { background: var(--accent); }
  .sbar .rw i { background: var(--loss); }
  .pitch { margin-top: 8px; }
  .xi-head { display: flex; justify-content: space-between; gap: 10px; font-size: 12px; margin-top: 2px; }
  .xi-team { display: inline-flex; align-items: center; gap: 6px; color: var(--ink); font-weight: 600; }
  .xi-team i { width: 9px; height: 9px; border-radius: 3px; display: inline-block; }
  .xi-team b { font-family: var(--narrow); font-weight: 700; color: var(--muted); letter-spacing: .06em; }
  /* ---- F1 ---- */
  .gp {
    display: flex; align-items: center; gap: 11px;
    width: 100%; background: none; border: none;
    border-top: 1px solid var(--hairline);
    padding: 11px 12px; font: inherit; color: inherit; text-align: left; cursor: pointer;
  }
  .gp:first-child { border-top: none; }
  .gp:hover { background: var(--surface-2); }
  .gp.done { color: var(--muted); }
  .gp.next { background: var(--accent-soft); }
  .rd {
    font-family: var(--narrow); font-size: 11px; font-weight: 700; letter-spacing: .06em;
    color: var(--muted); min-width: 26px; flex-shrink: 0;
  }
  .gp .info { flex: 1; min-width: 0; }
  .gp .gp-name {
    display: block; font-size: 14px; font-weight: 600; color: var(--ink);
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .gp.done .gp-name { color: var(--ink-2); font-weight: 500; }
  .gp .sub {
    display: block; font-size: 11.5px; color: var(--muted);
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .gp-win, .gp-when {
    display: inline-flex; align-items: center; gap: 5px;
    font-size: 12.5px; flex-shrink: 0; max-width: 42%;
  }
  .gp-win { color: var(--ink); font-weight: 600; }
  .gp-when { color: var(--muted); font-variant-numeric: tabular-nums; }
  .flag {
    width: 18px; height: 12px; object-fit: cover; border-radius: 2px; flex-shrink: 0;
    box-shadow: 0 0 0 1px var(--hairline);
  }
  .dportrait {
    display: inline-flex; align-items: flex-end; justify-content: center;
    border-radius: 50%; overflow: hidden; flex-shrink: 0;
  }
  .dportrait img { width: 100%; height: 100%; object-fit: cover; object-position: top center; }
  table.f1res { min-width: 520px; }
  table.f1res td, table.f1res th { padding: 7px 6px; }
  table.f1res .dteam { text-align: left; color: var(--muted); font-size: 12px; }
  table.f1res .gap { font-size: 12px; color: var(--ink-2); }
  table.f1res tr.p1 td.rk { color: #C9A227; font-weight: 700; }
  table.f1res tr.p2 td.rk { color: #9AA3A8; font-weight: 700; }
  table.f1res tr.p3 td.rk { color: #B07A4A; font-weight: 700; }
  .fl-tag {
    font-family: var(--narrow); font-size: 9.5px; font-weight: 700; letter-spacing: .06em;
    background: var(--accent-soft); color: var(--accent-ink);
    border-radius: 3px; padding: 1px 4px; margin-left: 5px; white-space: nowrap;
  }
  .pk-num {
    font-family: var(--narrow); font-weight: 700; font-size: 11px;
    color: var(--muted); min-width: 16px;
  }
  .pk-team { margin-left: auto; font-size: 11px; color: var(--muted); }

  /* ---- 选手选择：按量级分，照片优先 ---- */
  .picker.faces { max-height: 430px; }
  .fpick-bar {
    position: sticky; top: 0; z-index: 2;
    display: flex; gap: 6px; overflow-x: auto;
    padding: 8px 9px; background: var(--surface);
    border-bottom: 1px solid var(--hairline);
    scrollbar-width: none;
  }
  .fpick-bar::-webkit-scrollbar { display: none; }
  .fpick-bar button {
    flex: 0 0 auto; cursor: pointer; white-space: nowrap;
    border: 1px solid var(--hairline); background: transparent;
    color: var(--muted); border-radius: 2px;
    padding: 4px 11px; font: inherit; font-size: 12px;
  }
  .fpick-bar button[aria-pressed="true"] {
    background: var(--accent); color: var(--on-accent); border-color: var(--accent);
  }
  .fpick-grid {
    display: grid; gap: 8px; padding: 10px;
    grid-template-columns: repeat(auto-fill, minmax(94px, 1fr));
  }
  .fpick {
    position: relative; cursor: pointer; font: inherit; color: inherit;
    display: flex; flex-direction: column; align-items: center; gap: 4px;
    border: 1px solid var(--hairline); border-radius: 10px;
    background: transparent; padding: 9px 5px 8px; text-align: center;
  }
  .fpick[aria-pressed="true"] {
    border-color: var(--accent); background: var(--accent-soft);
  }
  .fpick .fp-shot {
    width: 54px; height: 54px; border-radius: 50%;
    object-fit: cover; object-position: top center;
    background: var(--surface-2); border: 1px solid var(--hairline);
  }
  .fpick .fp-nm { font-size: 12px; font-weight: 600; line-height: 1.25; }
  .fpick .fp-rec { font-family: var(--narrow); font-size: 10.5px; color: var(--muted); }
  .fpick .fp-rank {
    position: absolute; top: 5px; left: 7px;
    font-family: var(--narrow); font-size: 10px; font-weight: 700; color: var(--muted);
  }
  .fpick[aria-pressed="true"] .fp-rank,
  .fpick[aria-pressed="true"] .fp-rec { color: var(--accent-ink); }
  .fpick .fp-flag {
    position: absolute; top: 6px; right: 6px;
    width: 17px; height: 12px; border-radius: 2px;
  }
  .fpick-none { padding: 18px 12px; font-size: 13px; color: var(--muted); text-align: center; }

  /* ---- 格斗 ---- */
  .card-tag {
    font-family: var(--narrow); font-size: 10px; font-weight: 700;
    letter-spacing: .1em; text-transform: uppercase; color: var(--muted);
    padding: 9px 14px 3px;
  }
  /* a bout row only invites a click when there are numbers behind it */
  .bout { cursor: default; }
  .bout:hover { background: none; }
  .bout.opens { cursor: pointer; }
  .bout.opens:hover { background: var(--surface-2); }
  .bout-detail { padding: 10px 13px 13px; }
  .stat-head {
    display: flex; justify-content: space-between;
    font-size: 11px; font-weight: 700; color: var(--ink-2);
    padding-bottom: 7px; margin-bottom: 3px;
    border-bottom: 1px solid var(--hairline);
  }
  .stat-head span { max-width: 46%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  /* ---- bout panel ---- */
  .bout-hero {
    display: grid; grid-template-columns: 1fr auto 1fr;
    align-items: center; gap: 8px; padding: 2px 0 10px;
  }
  .bh-side { display: flex; flex-direction: column; align-items: center; gap: 4px; min-width: 0; }
  .bh-shot {
    width: 62px; height: 62px; border-radius: 50%;
    background: var(--surface-2); border: 1px solid var(--hairline);
    overflow: hidden; display: block; flex-shrink: 0;
  }
  .bh-shot img { width: 100%; height: 100%; object-fit: cover; object-position: top center; }
  .bh-name {
    font-size: 12px; font-weight: 600; color: var(--ink);

  /* Each sport carries its own accent, so the board feels like it belongs to

     the same score would read differently depending on where you are. */
  var SPORT_SKIN = {
    /* Printed ink, not screen light: every accent is knocked back so it sits on

       warmth as --ground so they never read as a cold grey patch. */
    today:      { l: ['#1D5843', '#E3EAE2', '#103527'], d: ['#5FAE8D', '#182A22', '#A5D6BE'] },
    football:   { l: ['#1D5843', '#E3EAE2', '#103527'], d: ['#5FAE8D', '#182A22', '#A5D6BE'] },

  /* auto → 浅 → 深 → auto. The system preference is still the default, but a

  var THEME_MODES = ['auto', 'light', 'dark'];

  if (THEME_MODES.indexOf(themeMode) === -1) themeMode = 'auto';

    if (themeMode === 'dark') return true;

  function applySkin(id) {

    if (cs) cs.setAttribute('content', themeMode === 'auto' ? 'light dark' : themeMode);
    var btn = $('themeBtn');

         stored — "auto" is a detail of how the choice is kept, not a thing
         worth making someone tap past. */
      var dark = isDark();
      btn.textContent = dark ? '●' : '○';

  /* One tap always flips what is on screen.

     It used to walk auto → 浅 → 深, which meant that on a phone set to light

     nothing — and you had to tap twice to reach dark. So the toggle is now
     two-state, and "auto" survives underneath: if the appearance you land on
     is the one the system is already asking for, that is what gets stored, so
     a phone that flips at sunset keeps steering until you ask for otherwise. */
  function cycleTheme() {
    var wantDark = !isDark();
    var sysDark = !!(darkQuery && darkQuery.matches);
    themeMode = (wantDark === sysDark) ? 'auto' : (wantDark ? 'dark' : 'light');
    lsSet('theme', themeMode);
    applyTheme();

    var s = SPORTS.filter(function (x) { return x.id === id; })[0] || SPORTS[0];

    var ready = !!s.ready;
    var isToday = id === 'today';
    $('footballHead').hidden = !ready || isToday;
    $('chips').hidden = (id !== 'football' && id !== 'esports' && id !== 'basketball' && id !== 'fight');
    $('chips2').hidden = id !== 'esports';
    if (id === 'football') renderChips();
    $('status').hidden = !ready || isToday;
    $('settings').hidden = true;
    $('panel-soon').hidden = ready;
    $('panel-today').hidden = !isToday;
    $('gearBtn').hidden = !ready || isToday ||
      (id === 'basketball' && bballLeague !== 'nba');
    $('refreshBtn').hidden = !ready;

    if (isToday) {

        ' 还没接进来</div><p>' + esc(s.blurb || '') +

  /* ---------- header chrome ---------- */
  function renderChips() {
    $('chips').innerHTML = LEAGUES.map(function (l) {

  }
  var TABS = {
    football: [['fixtures', '赛程'], ['table', '积分榜'], ['mine', '我的球队']],
    f1: [['fixtures', '赛历'], ['table', '积分榜'], ['mine', '我的车手']],
    basketball: [['fixtures', '赛程'], ['table', '排名'], ['mine', '我的球队']],
    esports: [['fixtures', '赛程'], ['table', '积分榜'], ['mine', '我的战队']],
    fight: [['fixtures', '赛历'], ['table', '排名'], ['mine', '我的选手']],
    boxing: [['fixtures', '赛程'], ['mine', '我的拳手']],
    esports_other: [['fixtures', '赛程'], ['table', '战绩榜'], ['mine', '我的战队']],
    single: [['fixtures', '赛程']]
  };
  function renderSegTabs() {
    var defs = (sport === 'esports' && esportsGame !== 'lol') ? TABS.esports_other

  function setFavCount() {

    if (el) el.textContent = favorites.length;
  }

  /* Every panel is filled asynchronously, and nothing used to check whether the
     view had moved on by the time the data landed. Switch sport while a feed is
     in flight and its answer would paint over whichever panel was on screen by
     then — the leftovers between sections. Each switch takes a new token and a
     render drops its result if the token has moved. */
  var viewSeq = 0;
  function viewStale(token) { return token !== viewSeq; }
  /* A renderer asks for its panel through this and writes to it as usual; the
     write is dropped if the view moved on while the data was loading. */
  function panelFor(id) {
    var el = $(id);
    var token = viewSeq;
    return {
      get innerHTML() { return el.innerHTML; },
      set innerHTML(html) {
        if (viewStale(token)) return;
        el.innerHTML = html;
        // loading states shouldn't animate in and then out again a moment later
        if (html.indexOf('class="skeleton"') !== -1) { el.classList.remove('panel-in'); return; }
        el.classList.remove('panel-in');

    };
  }
