<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="Grandstand — 足球、F1、电竞、格斗、篮球的实时赛事板">
<meta name="color-scheme" content="light dark">
<style>
  html { padding: env(safe-area-inset-top, 0px) 0 env(safe-area-inset-bottom, 0px); }
  body { margin: 0; }
  img { max-width: 100%; }
  [hidden] { display: none !important; }
</style>
<title>Grandstand</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700&family=Archivo+Narrow:wght@500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --ground: #F2F4F3;
    --surface: #FFFFFF;
    --surface-2: #EDF0EE;
    --hairline: #E0E5E3;
    --hairline-strong: #CBD3D0;
    --ink: #101614;
    --ink-2: #3D4744;
    --muted: #6B7873;
    --accent: #12564A;
    --accent-soft: #DCEBE6;
    --accent-ink: #0B3B33;
    --on-accent: #FFFFFF;
    --live: #C9421C;
    --live-soft: #FBE7E0;
    --win: #1B7F55;
    --loss: #B93C4C;
    --draw: #8B9591;
    --crest-pad: transparent;
    --pitch: #E7EFEA;
    --pitch-line: #C7D6CD;
    --shadow: 0 1px 2px rgba(16, 32, 28, .05), 0 6px 18px -12px rgba(16, 32, 28, .28);
    --display: 'Archivo', 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif;
    --narrow: 'Archivo Narrow', 'Archivo', 'PingFang SC', 'Microsoft YaHei', sans-serif;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --ground: #0D1211;
      --surface: #151C1A;
      --surface-2: #1C2523;
      --hairline: #263230;
      --hairline-strong: #36443F;
      --ink: #ECF2F0;
      --ink-2: #C3CECA;
      --muted: #8B9994;
      --accent: #45B795;
      --accent-soft: #14312A;
      --accent-ink: #9BDCC6;
      --on-accent: #06130F;
      --live: #FF7A53;
      --live-soft: #3A1B12;
      --win: #3DB07C;
      --loss: #E06070;
      --draw: #7A8681;
      --crest-pad: rgba(255, 255, 255, .92);
      --pitch: #15241E;
      --pitch-line: #27392F;
      --shadow: 0 1px 2px rgba(0, 0, 0, .4);
    }
  }
  :root[data-theme="dark"] {
    --ground: #0D1211;
    --surface: #151C1A;
    --surface-2: #1C2523;
    --hairline: #263230;
    --hairline-strong: #36443F;
    --ink: #ECF2F0;
    --ink-2: #C3CECA;
    --muted: #8B9994;
    --accent: #45B795;
    --accent-soft: #14312A;
    --accent-ink: #9BDCC6;
    --on-accent: #06130F;
    --live: #FF7A53;
    --live-soft: #3A1B12;
    --win: #3DB07C;
    --loss: #E06070;
    --draw: #7A8681;
    --crest-pad: rgba(255, 255, 255, .92);
    --pitch: #15241E;
    --pitch-line: #27392F;
    --shadow: 0 1px 2px rgba(0, 0, 0, .4);
  }

  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--ground);
    color: var(--ink);
    font-family: var(--display);
    font-size: 15px;
    line-height: 1.5;
    -webkit-font-smoothing: antialiased;
    font-variant-numeric: tabular-nums;
  }
  .wrap { max-width: 660px; margin: 0 auto; padding: 0 16px; padding-block: 0 56px; }

  /* ---- header ---- */
  header {
    position: sticky;
    top: env(safe-area-inset-top, 0px);
    z-index: 20;
    background: var(--ground);
    padding-block: 18px 0;
    margin: 0 -16px;
    padding-inline: 16px;
    border-bottom: 1px solid var(--hairline);
  }
  .head-row { display: flex; align-items: flex-start; justify-content: space-between; gap: 12px; }
  .eyebrow {
    font-family: var(--narrow);
    font-size: 11px;
    font-weight: 600;
    letter-spacing: .16em;
    text-transform: uppercase;
    color: var(--muted);
  }
  h1 {
    font-family: var(--narrow);
    font-size: 27px;
    font-weight: 700;
    letter-spacing: .06em;
    margin: 0;
    line-height: 1.1;
    text-wrap: balance;
  }
  .head-row .eyebrow { margin-top: 4px; }
  .sportnav {
    display: flex;
    gap: 2px;
    background: var(--surface-2);
    border: 1px solid var(--hairline);
    border-radius: 10px;
    padding: 3px;
    margin-top: 14px;
    overflow-x: auto;
    scrollbar-width: none;
  }
  .sportnav::-webkit-scrollbar { display: none; }
  .sportnav button {
    flex: 0 0 auto;
    border: none;
    background: none;
    font: inherit;
    font-size: 13px;
    font-weight: 600;
    color: var(--muted);
    padding: 6px 15px;
    border-radius: 7px;
    cursor: pointer;
    white-space: nowrap;
  }
  .sportnav button[aria-pressed="true"] {
    background: var(--surface);
    color: var(--ink);
    box-shadow: var(--shadow);
  }
  .sportnav button:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
  .soon {
    text-align: center;
    padding: 56px 20px;
    color: var(--muted);
  }
  .soon .big {
    font-family: var(--narrow);
    font-size: 21px;
    font-weight: 700;
    letter-spacing: .04em;
    color: var(--ink);
    margin-bottom: 8px;
  }
  .soon p { margin: 0 auto; max-width: 30em; font-size: 13.5px; line-height: 1.7; }
  .head-actions { display: flex; gap: 8px; flex-shrink: 0; padding-top: 6px; }
  .icon-btn {
    background: var(--surface);
    border: 1px solid var(--hairline);
    color: var(--ink-2);
    border-radius: 999px;
    height: 34px;
    padding: 0 13px;
    font: inherit;
    font-size: 13px;
    cursor: pointer;
    display: inline-flex;
    align-items: center;
    gap: 6px;
  }
  .icon-btn:hover { border-color: var(--hairline-strong); }
  .icon-btn:focus-visible, .chip:focus-visible, .seg button:focus-visible, .match:focus-visible {
    outline: 2px solid var(--accent); outline-offset: 2px;
  }
  .spin { display: inline-block; transition: transform .6s ease; }
  .spinning .spin { transform: rotate(360deg); }

  .chips {
    display: flex;
    gap: 6px;
    overflow-x: auto;
    margin-top: 14px;
    padding-bottom: 2px;
    scrollbar-width: none;
  }
  .chips::-webkit-scrollbar { display: none; }
  .chip {
    flex: 0 0 auto;
    font-family: var(--narrow);
    font-weight: 600;
    font-size: 14px;
    letter-spacing: .02em;
    padding: 6px 13px;
    border-radius: 999px;
    border: 1px solid var(--hairline);
    background: var(--surface);
    color: var(--ink-2);
    cursor: pointer;
  }
  .chip[aria-pressed="true"] {
    background: var(--accent);
    border-color: var(--accent);
    color: var(--on-accent);
  }
  .seg {
    display: flex;
    gap: 22px;
    margin-top: 12px;
  }
  .seg button {
    background: none;
    border: none;
    padding: 8px 0 10px;
    font: inherit;
    font-size: 14px;
    font-weight: 600;
    color: var(--muted);
    cursor: pointer;
    border-bottom: 2px solid transparent;
    margin-bottom: -1px;
  }
  .seg button[aria-selected="true"] { color: var(--ink); border-bottom-color: var(--accent); }
  .seg .badge {
    display: inline-block;
    min-width: 17px;
    margin-left: 5px;
    padding: 0 5px;
    border-radius: 999px;
    background: var(--surface-2);
    color: var(--muted);
    font-size: 11px;
    font-weight: 600;
    vertical-align: 1px;
  }

  .status-line {
    font-size: 12px;
    color: var(--muted);
    margin: 14px 0 4px;
    display: flex;
    align-items: center;
    gap: 6px;
  }
  .dot {
    width: 7px; height: 7px; border-radius: 50%;
    background: var(--live);
    box-shadow: 0 0 0 0 var(--live);
    animation: pulse 2s infinite;
  }
  @keyframes pulse {
    0% { box-shadow: 0 0 0 0 color-mix(in srgb, var(--live) 55%, transparent); }
    70% { box-shadow: 0 0 0 7px transparent; }
    100% { box-shadow: 0 0 0 0 transparent; }
  }
  @media (prefers-reduced-motion: reduce) {
    .dot { animation: none; }
    .spin { transition: none; }
  }

  /* ---- day groups + matches ---- */
  .day { margin-top: 22px; }
  .day-head {
    display: flex;
    align-items: baseline;
    gap: 9px;
    margin-bottom: 8px;
    padding-left: 2px;
  }
  .day-head .d {
    font-family: var(--narrow);
    font-size: 15px;
    font-weight: 700;
    letter-spacing: .04em;
    text-transform: uppercase;
  }
  .day-head .n { font-size: 12px; color: var(--muted); }
  .day.past .day-head .d { color: var(--muted); }
  .day.past .card { opacity: .88; }
  .jump {
    margin-left: auto;
    background: var(--surface);
    border: 1px solid var(--hairline);
    border-radius: 999px;
    color: var(--ink-2);
    font: inherit;
    font-size: 11.5px;
    padding: 3px 10px;
    cursor: pointer;
  }
  .jump:hover { border-color: var(--hairline-strong); }
  .day-head .today {
    font-family: var(--narrow);
    font-size: 11px;
    font-weight: 700;
    letter-spacing: .08em;
    color: var(--accent-ink);
    background: var(--accent-soft);
    border-radius: 3px;
    padding: 1px 6px;
  }
  .card {
    background: var(--surface);
    border: 1px solid var(--hairline);
    border-radius: 10px;
    box-shadow: var(--shadow);
    overflow: hidden;
  }
  .match {
    display: grid;
    grid-template-columns: 1fr 78px 1fr;
    align-items: center;
    gap: 8px;
    width: 100%;
    background: none;
    border: none;
    border-top: 1px solid var(--hairline);
    padding: 11px 12px;
    font: inherit;
    color: inherit;
    text-align: left;
    cursor: pointer;
  }
  .match:first-child { border-top: none; }
  .match:hover { background: var(--surface-2); }
  .side { display: flex; align-items: center; gap: 8px; min-width: 0; }
  .side.home { justify-content: flex-end; }
  .side.home .nm { text-align: right; }
  .nm {
    font-size: 14px;
    font-weight: 600;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .nm.dim { color: var(--muted); font-weight: 500; }
  .crest {
    width: 24px; height: 24px;
    flex-shrink: 0;
    object-fit: contain;
    border-radius: 50%;
    background: var(--crest-pad);
  }
  span.crest {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    font-family: var(--narrow);
    font-size: 9px;
    font-weight: 700;
    color: #fff;
    letter-spacing: .02em;
  }
  .mid { text-align: center; }
  .score {
    font-size: 17px;
    font-weight: 700;
    letter-spacing: .02em;
    white-space: nowrap;
  }
  .kick { font-size: 15px; font-weight: 600; }
  .state {
    font-family: var(--narrow);
    font-size: 10.5px;
    font-weight: 600;
    letter-spacing: .09em;
    text-transform: uppercase;
    color: var(--muted);
    margin-top: 1px;
  }
  .state.is-live { color: var(--live); }
  .match.live { background: linear-gradient(90deg, var(--live-soft), transparent 60%); }

  .detail {
    border-top: 1px solid var(--hairline);
    background: var(--surface-2);
    padding: 12px 14px 15px;
    font-size: 13px;
    color: var(--ink-2);
  }
  .detail h4 {
    font-family: var(--narrow);
    font-size: 11px;
    font-weight: 700;
    letter-spacing: .12em;
    text-transform: uppercase;
    color: var(--muted);
    margin: 14px 0 6px;
  }
  .detail h4:first-child { margin-top: 0; }
  .goals { display: grid; gap: 3px; }
  .goal { display: flex; gap: 7px; align-items: baseline; font-size: 13px; }
  .goal .min {
    font-family: var(--narrow);
    font-weight: 700;
    color: var(--accent);
    min-width: 34px;
  }
  .goal.away { flex-direction: row-reverse; text-align: right; }
  .goal.away .min { text-align: right; }
  .odds-bar {
    display: flex;
    height: 7px;
    border-radius: 4px;
    overflow: hidden;
    background: var(--hairline);
    margin: 7px 0 5px;
  }
  .odds-bar i { display: block; }
  .odds-bar .h { background: var(--accent); }
  .odds-bar .d { background: var(--draw); }
  .odds-bar .a { background: var(--loss); }
  .odds-key { display: flex; justify-content: space-between; font-size: 12px; gap: 8px; }
  .odds-key b { font-weight: 600; }
  .kv { display: flex; gap: 10px; font-size: 12.5px; padding: 3px 0; }
  .kv .k { color: var(--muted); flex: 0 0 auto; min-width: 74px; }
  .lineup { font-size: 12.5px; line-height: 1.65; }
  .lineup b { font-weight: 600; }
  .form { display: inline-flex; gap: 3px; vertical-align: -3px; margin-left: 4px; }
  .f {
    width: 16px; height: 16px; border-radius: 4px;
    font-size: 9px; font-weight: 700; color: #fff;
    display: inline-flex; align-items: center; justify-content: center;
    font-family: var(--narrow);
  }
  .f.W { background: var(--win); }
  .f.D { background: var(--draw); }
  .f.L { background: var(--loss); }

  /* ---- standings ---- */
  .table-scroll { overflow-x: auto; }
  table { border-collapse: collapse; width: 100%; min-width: 460px; font-size: 13.5px; }
  thead th {
    font-family: var(--narrow);
    font-size: 11px;
    font-weight: 700;
    letter-spacing: .1em;
    text-transform: uppercase;
    color: var(--muted);
    text-align: right;
    padding: 9px 6px;
    border-bottom: 1px solid var(--hairline);
    white-space: nowrap;
  }
  thead th.tm, tbody td.tm { text-align: left; }
  tbody td { padding: 8px 6px; text-align: right; border-bottom: 1px solid var(--hairline); white-space: nowrap; }
  tbody tr:last-child td { border-bottom: none; }
  td.tm { display: flex; align-items: center; gap: 8px; }
  td.tm .nm { font-size: 13.5px; }
  td.rk { position: relative; padding-left: 14px; text-align: left; color: var(--muted); font-size: 12.5px; }
  td.rk::before {
    content: '';
    position: absolute;
    left: 2px; top: 6px; bottom: 6px;
    width: 3px; border-radius: 2px;
    background: transparent;
  }
  tr.z-top td.rk::before { background: var(--accent); }
  tr.z-mid td.rk::before { background: var(--hairline-strong); }
  tr.z-drop td.rk::before { background: var(--loss); }
  td.pts { font-weight: 700; color: var(--ink); }
  tr.fav { background: var(--accent-soft); }
  .legend { display: flex; flex-wrap: wrap; gap: 14px; font-size: 11.5px; color: var(--muted); margin-top: 10px; }
  .legend i { display: inline-block; width: 3px; height: 11px; border-radius: 2px; vertical-align: -1px; margin-right: 5px; }
  .group-name {
    font-family: var(--narrow);
    font-size: 12px;
    font-weight: 700;
    letter-spacing: .1em;
    text-transform: uppercase;
    color: var(--muted);
    margin: 18px 0 6px;
  }

  /* ---- my teams ---- */
  .team-card { margin-top: 12px; }
  .team-card .tc-head {
    display: flex;
    align-items: center;
    gap: 9px;
    padding: 12px 14px;
    border-bottom: 1px solid var(--hairline);
  }
  .team-card .tc-head .nm { font-size: 15px; font-weight: 700; }
  .team-card .tc-head .lg { margin-left: auto; font-size: 11.5px; color: var(--muted); font-family: var(--narrow); letter-spacing: .08em; text-transform: uppercase; }
  .fix { display: flex; gap: 10px; align-items: baseline; padding: 9px 14px; border-bottom: 1px solid var(--hairline); font-size: 13px; }
  .fix:last-child { border-bottom: none; }
  .fix .when { color: var(--muted); font-size: 12px; min-width: 86px; flex-shrink: 0; }
  .fix .res { font-weight: 700; margin-left: auto; }
  .fix .res.W { color: var(--win); }
  .fix .res.L { color: var(--loss); }
  .fix .res.D { color: var(--draw); }
  .news-item { padding: 11px 14px; border-bottom: 1px solid var(--hairline); }
  .news-item:last-child { border-bottom: none; }
  .news-item .hl { font-size: 13.5px; font-weight: 600; margin-bottom: 3px; }
  .news-item p { margin: 0 0 5px; font-size: 12.5px; color: var(--muted); }
  .news-item a { font-size: 12px; color: var(--accent); text-decoration: none; }
  .news-item a:hover { text-decoration: underline; }

  /* ---- settings ---- */
  .panel {
    background: var(--surface);
    border: 1px solid var(--hairline);
    border-radius: 10px;
    padding: 15px;
    margin-top: 14px;
    box-shadow: var(--shadow);
  }
  .panel p.hint { margin: 0 0 10px; font-size: 12.5px; color: var(--muted); }
  .picker { max-height: 260px; overflow-y: auto; border: 1px solid var(--hairline); border-radius: 8px; }
  .picker label {
    display: flex;
    align-items: center;
    gap: 9px;
    padding: 8px 11px;
    border-bottom: 1px solid var(--hairline);
    font-size: 13.5px;
    cursor: pointer;
  }
  .picker label:last-child { border-bottom: none; }
  .picker input { accent-color: var(--accent); width: 16px; height: 16px; flex-shrink: 0; }
  .panel-foot { display: flex; align-items: center; gap: 10px; margin-top: 12px; flex-wrap: wrap; }
  .btn {
    background: var(--accent);
    color: var(--on-accent);
    border: none;
    border-radius: 7px;
    padding: 8px 16px;
    font: inherit;
    font-size: 13px;
    font-weight: 600;
    cursor: pointer;
  }
  .count { font-size: 12px; color: var(--muted); }

  /* ---- match stats comparison ---- */
  .stat { display: grid; grid-template-columns: 46px 1fr 46px; gap: 5px 8px; align-items: center; margin: 9px 0; }
  .stat .sv { font-size: 12.5px; font-weight: 600; color: var(--ink); }
  .stat .sv.r { text-align: right; }
  .stat .sl { text-align: center; font-size: 11px; color: var(--muted); }
  .sbar { grid-column: 1 / -1; display: grid; grid-template-columns: 1fr 1fr; gap: 4px; }
  .sbar .lw { display: flex; justify-content: flex-end; }
  .sbar i { display: block; height: 5px; border-radius: 3px; min-width: 2px; }
  .sbar .lw i { background: var(--accent); }
  .sbar .rw i { background: var(--loss); }
  .pitch { margin-top: 8px; }
  .xi-head { display: flex; justify-content: space-between; gap: 10px; font-size: 12px; margin-top: 2px; }
  .xi-team { display: inline-flex; align-items: center; gap: 6px; color: var(--ink); font-weight: 600; }
  .xi-team i { width: 9px; height: 9px; border-radius: 3px; display: inline-block; }
  .xi-team b { font-family: var(--narrow); font-weight: 700; color: var(--muted); letter-spacing: .06em; }
  .bench { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  .bench-team {
    display: flex; align-items: center; gap: 6px;
    font-size: 11.5px; font-weight: 600; color: var(--ink);
    margin-bottom: 5px;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .bench-team i { width: 8px; height: 8px; border-radius: 2px; flex-shrink: 0; }
  .bench-row {
    display: flex; align-items: baseline; gap: 6px;
    font-size: 12px; padding: 2.5px 0;
    color: var(--muted);
  }
  .bench-row.on { color: var(--ink-2); }
  .bench-row .bn {
    font-family: var(--narrow); font-weight: 700; font-size: 11px;
    min-width: 16px; text-align: right; color: var(--muted);
  }
  .bench-row .bnm { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .bench-row .bin { margin-left: auto; font-size: 10.5px; color: var(--win); white-space: nowrap; }
  .ev .in { color: var(--win); font-weight: 700; }
  .ev .out { color: var(--loss); font-weight: 700; }
  @media (max-width: 420px) {
    .bench { grid-template-columns: 1fr; gap: 14px; }
  }
  .schips { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 12px; }
  .schip {
    background: var(--surface);
    border: 1px solid var(--hairline);
    border-radius: 999px;
    padding: 3px 10px;
    font-size: 11.5px;
    color: var(--muted);
    white-space: nowrap;
  }
  .schip b { color: var(--ink); font-weight: 600; }
  .schip .sep { margin: 0 3px; opacity: .5; }
  .ev { display: flex; gap: 8px; align-items: baseline; padding: 2px 0; font-size: 12.5px; }
  .ev.away { flex-direction: row-reverse; text-align: right; }
  .ev .min { font-family: var(--narrow); font-weight: 700; color: var(--muted); min-width: 40px; }
  .ev.away .min { text-align: right; }
  .yc, .rc {
    display: inline-block; width: 8px; height: 11px; border-radius: 2px;
    vertical-align: -1px; margin-right: 4px;
  }
  .yc { background: #E3B02B; }
  .rc { background: #D6453F; }

    host.innerHTML = groups.map(function (g) {
      var isPast = g.items.every(function (it) {
        var st = (teamsOf(it.ev).comp.status || {}).type || {};
        return st.completed;
      });
      var rows = g.items.map(function (it) {
        var t = teamsOf(it.ev);
        var status = (t.comp.status && t.comp.status.type) || {};
        var state = status.state || 'pre';
        if (state === 'in') liveCount++;
        var hName = cn(t.home.team && t.home.team.displayName, t.home.team && t.home.team.shortDisplayName);
        var aName = cn(t.away.team && t.away.team.displayName, t.away.team && t.away.team.shortDisplayName);
        var mid, label, cls = '';
        if (state === 'pre') {
          mid = '<div class="kick">' + (it.ok ? fmtTime(it.d) : '--:--') + '</div>';
          label = '<div class="state">未开始</div>';
        } else {
          mid = '<div class="score">' + esc(t.home.score) + ' <span style="color:var(--muted)">-</span> ' + esc(t.away.score) + '</div>';
          if (state === 'in') {
            cls = ' live';
            label = '<div class="state is-live">' + esc(status.shortDetail || '进行中') + '</div>';
          } else {
            label = '<div class="state">完场</div>';
          }
        }
        var hDim = state === 'post' && t.away.winner ? ' dim' : '';
        var aDim = state === 'post' && t.home.winner ? ' dim' : '';
        return '<button class="match' + cls + '" type="button" data-ev="' + esc(it.ev.id) + '">' +
            '<span class="side home"><span class="nm' + hDim + '">' + esc(hName) + '</span>' + crest(t.home.team) + '</span>' +
            '<span class="mid">' + mid + label + '</span>' +
            '<span class="side away">' + crest(t.away.team) + '<span class="nm' + aDim + '">' + esc(aName) + '</span></span>' +
          '</button>';
      }).join('');
      return '<div class="day' + (isPast ? ' past' : '') + '"' +
          (g.key === todayKey ? ' id="todayGroup"' : '') + '>' +
          '<div class="day-head"><span class="d">' + esc(g.label) + '</span>' +
            (g.key === todayKey ? '<span class="today">今天</span>' : '') +
            '<span class="n">' + g.items.length + ' 场' + (isPast ? ' · 已结束' : '') + '</span></div>' +
          '<div class="card">' + rows + '</div>' +
        '</div>';
    }).join('');

    var s = $('status');
    var hasPast = !!host.querySelector('.day.past');
    s.innerHTML = (liveCount ? '<span class="dot"></span>' : '') +
      (liveCount ? liveCount + ' 场比赛进行中 · ' : '') + '更新于 ' +
      new Date().toLocaleTimeString('zh-CN', { hour: '2-digit', minute: '2-digit' }) +
      (hasPast && document.getElementById('todayGroup') ? '<button class="jump" type="button" id="jumpToday">跳到今天 ↓</button>' : '');
    var jump = $('jumpToday');
    if (jump) {
      jump.addEventListener('click', function () {
        var el = document.getElementById('todayGroup');
        if (el) window.scrollTo({ top: el.offsetTop - 120, behavior: 'smooth' });
      });
    }
  }

  function scheduleAutoRefresh() {
    if (timer) clearInterval(timer);
    var anyLive = events.some(function (ev) {
      var t = teamsOf(ev);
      return t.comp.status && t.comp.status.type && t.comp.status.type.state === 'in';
    });
    if (anyLive) {
      timer = setInterval(function () {
        summaryCache = {};
        loadFixtures(true);
      }, 60000);
    }
  }

  /* ---------- match detail ---------- */
  function toggleDetail(btn) {
    var id = btn.dataset.ev;
    var next = btn.nextElementSibling;
    if (next && next.classList.contains('detail')) { next.remove(); return; }
    var box = document.createElement('div');
    box.className = 'detail';
    box.innerHTML = renderGoals(id) + '<div class="skeleton" style="padding:14px 0">正在获取赛况…</div>';
    btn.parentNode.insertBefore(box, btn.nextSibling);
    loadSummary(id).then(function (html) {
      if (box.isConnected) box.innerHTML = html;
    });
  }

  function renderGoals(id) {
    var ev = eventById[id];
    if (!ev) return '';
    var t = teamsOf(ev);
    var details = t.comp.details || [];
    var goals = details.filter(function (d) { return d.scoringPlay; });
    if (!goals.length) return '';
    var homeId = String((t.home.team && t.home.team.id) || '');
    return '<h4>进球</h4><div class="goals">' + goals.map(function (g) {
      var who = (g.athletesInvolved || []).map(function (a) { return a.displayName; }).join('、') || '进球';
      var min = (g.clock && g.clock.displayValue) || '';
      var own = g.ownGoal ? '（乌龙）' : (g.penaltyKick ? '（点球）' : '');
      var side = String((g.team && g.team.id) || '') === homeId ? '' : ' away';
      return '<div class="goal' + side + '"><span class="min">' + esc(min) + '</span><span>' +
        esc(who) + esc(own) + '</span></div>';
    }).join('') + '</div>';
  }

  /* name of whoever an event happened to */
  function evName(k) {
    var p = (k.participants || []).map(function (x) { return x.athlete && x.athlete.displayName; }).filter(Boolean);
    if (p.length) return p.join('、');
    var a = (k.athletesInvolved || []).map(function (x) { return x.displayName; }).filter(Boolean);
    if (a.length) return a.join('、');
    var m = k.text && k.text.match(/\.\s*([^.()]{2,40}?)\s*\(/);
    return m ? m[1] : '';
  }

  /* goal + card timeline from the summary's key events */
  function timelineHTML(keyEvents, homeId) {
    var goals = [], cards = [];
    (keyEvents || []).forEach(function (k) {
      var type = (k.type && k.type.text) || '';
      var min = (k.clock && k.clock.displayValue) || '';
      var side = String((k.team && k.team.id) || '') === String(homeId) ? '' : ' away';
      var who = evName(k);
      if (k.scoringPlay === true) {
        // participants on a goal are [scorer, assister]
        var parts = (k.participants || []).map(function (x) { return x.athlete && x.athlete.displayName; }).filter(Boolean);
        var scorer = parts[0] || who || '进球';
        var assist = parts[1] ? '（助攻 ' + parts[1] + '）' : '';
        var extra = /own goal/i.test(k.text || '') ? '（乌龙）'
          : (/penalt/i.test(type) || /converts the penalty/i.test(k.text || '') ? '（点球）' : '');
        goals.push('<div class="ev' + side + '"><span class="min">' + esc(min) + '</span><span>⚽ ' +
          esc(scorer) + extra + '<span style="color:var(--muted)">' + esc(assist) + '</span></span></div>');
      } else if (/card/i.test(type)) {
        var red = /red/i.test(type);
        cards.push('<div class="ev' + side + '"><span class="min">' + esc(min) + '</span><span><i class="' +
          (red ? 'rc' : 'yc') + '"></i>' + esc(who || (red ? '红牌' : '黄牌')) + '</span></div>');
      }
    });
    var html = '';
    if (goals.length) html += '<h4>进球</h4>' + goals.join('');
    if (cards.length) html += '<h4>红黄牌</h4>' + cards.join('');
    return html;
  }

  // The handful people actually read get a two-colour bar; everything else
  // rides along as a compact pill so the panel stays scannable.
  var STAT_BARS = [
    ['possessionPct', '控球率', '%'],
    ['totalShots', '射门'],
    ['shotsOnTarget', '射正'],
    ['wonCorners', '角球'],
    ['passPct', '传球成功率', '%']
  ];
  var STAT_PILLS = [
    ['blockedShots', '封堵'],
    ['totalCrosses', '传中'],
    ['totalPasses', '传球'],
    ['totalLongBalls', '长传'],
    ['totalTackles', '抢断'],
    ['interceptions', '拦截'],
    ['totalClearance', '解围'],
    ['offsides', '越位'],
    ['foulsCommitted', '犯规'],
    ['yellowCards', '黄牌'],
    ['redCards', '红牌'],
    ['saves', '扑救']
  ];

  function statsHTML(boxTeams, homeId, hColor, aColor) {
    if (!boxTeams || boxTeams.length < 2) return '';
    function statsOf(entry) {
      var map = {};
      ((entry && entry.statistics) || []).forEach(function (s) { map[s.name] = s.displayValue; });
      return map;
    }
    var hEntry = boxTeams.filter(function (x) { return String(x.team && x.team.id) === String(homeId); })[0];
    var aEntry = boxTeams.filter(function (x) { return String(x.team && x.team.id) !== String(homeId); })[0];
    var h = statsOf(hEntry), a = statsOf(aEntry);

    function pair(key) {
      if (!(key in h) && !(key in a)) return null;
      var hv = parseFloat(h[key]), av = parseFloat(a[key]);
      if (isNaN(hv)) hv = 0;
      if (isNaN(av)) av = 0;
      // passPct/shotPct come back as a 0-1 ratio; possessionPct already 0-100
      if (key === 'passPct' || key === 'shotPct') {
        if (hv <= 1) hv *= 100;
        if (av <= 1) av *= 100;
      }
      return { h: hv, a: av };
    }
    function num(v, unit) { return unit === '%' ? Math.round(v) + '%' : String(Math.round(v * 10) / 10); }

    var kit = twoColors(hColor, aColor);
    var left = kit.home, right = kit.away;

    var bars = STAT_BARS.map(function (r) {
      var p = pair(r[0]);
      if (!p || (p.h === 0 && p.a === 0)) return '';
      var unit = r[2] || '';
      var sum = p.h + p.a;
      var hw = sum > 0 ? p.h / sum * 100 : 50;
      return '<div class="stat"><span class="sv">' + num(p.h, unit) + '</span><span class="sl">' + r[1] +
        '</span><span class="sv r">' + num(p.a, unit) + '</span>' +
        '<span class="sbar"><span class="lw"><i style="width:' + hw.toFixed(1) + '%;background:' + left +
        '"></i></span><span class="rw"><i style="width:' + (100 - hw).toFixed(1) + '%;background:' + right +
        '"></i></span></span></div>';
    }).filter(Boolean);

    var pills = STAT_PILLS.map(function (r) {
      var p = pair(r[0]);
      if (!p || (p.h === 0 && p.a === 0)) return '';
      return '<span class="schip">' + r[1] + ' <b>' + num(p.h) + '</b><span class="sep">:</span><b>' +
        num(p.a) + '</b></span>';
    }).filter(Boolean);

    if (!bars.length && !pills.length) return '';
    return '<h4>全场数据</h4>' + bars.join('') +
      (pills.length ? '<div class="schips">' + pills.join('') + '</div>' : '');
  }

  /* ---------- starting XI drawn on a pitch ---------- */
  // ESPN position abbreviations look like G, LB, CD-R, DM, AM, LW, ST.
  function lineIndex(abbr) {
    var a = (abbr || '').toUpperCase();
    if (a === 'G' || a.indexOf('GK') === 0) return 0;
    if (/^(SW|CD|LB|RB|LWB|RWB|D)/.test(a)) return 1;
    if (/^(DM|CM|M|LM|RM)/.test(a)) return 2;
    if (/^AM/.test(a)) return 3;
    return 4;
  }
  function sideIndex(abbr) {
    var a = (abbr || '').toUpperCase();
    if (/^L/.test(a) || /-L$/.test(a)) return 0;
    if (/^R/.test(a) || /-R$/.test(a)) return 2;
    return 1;
  }
  // Two clubs in near-identical kit colours (Atlético vs Osasuna, both red) would be
  // impossible to tell apart, so fall back to the page's own two colours.
  function twoColors(hColor, aColor) {
    function rgb(hex) {
      var v = parseInt(String(hex || '').replace('#', ''), 16);
      return isNaN(v) ? null : [(v >> 16) & 255, (v >> 8) & 255, v & 255];
    }
    var ch = rgb(hColor), ca = rgb(aColor);
    if (ch && ca) {
      var d = Math.sqrt(Math.pow(ch[0] - ca[0], 2) + Math.pow(ch[1] - ca[1], 2) + Math.pow(ch[2] - ca[2], 2));
      if (d > 110) return { home: '#' + hColor, away: '#' + aColor, distinct: true };
    }
    return { home: '#12564A', away: '#B93C4C', distinct: false };
  }

  function readableOn(hex) {
    var v = parseInt(String(hex || '').replace('#', ''), 16);
    if (isNaN(v)) return '#fff';
    var lum = 0.299 * ((v >> 16) & 255) + 0.587 * ((v >> 8) & 255) + 0.114 * (v & 255);
    return lum > 150 ? '#12181A' : '#fff';
  }

  // Substitutions: participants are [player coming on, player going off].
  function subMap(keyEvents) {
    var on = {}, off = {}, list = [];
    (keyEvents || []).forEach(function (k) {
      if (!/substitut/i.test((k.type && k.type.text) || '')) return;
      var parts = (k.participants || []).map(function (x) { return x.athlete && x.athlete.displayName; });
      var inName = parts[0], outName = parts[1];
      if (!inName || !outName) {
        var m = (k.text || '').match(/\.\s*(.+?)\s+replaces\s+(.+?)\.?\s*$/i);
        if (m) { inName = inName || m[1]; outName = outName || m[2]; }
      }
      var clock = (k.clock && k.clock.displayValue) || '';
      if (inName) on[inName] = clock;
      if (outName) off[outName] = clock;
      list.push({ on: inName, off: outName, clock: clock, team: String((k.team && k.team.id) || '') });
    });
    return { on: on, off: off, list: list };
  }

  // ESPN only stores headshots for a handful of footballers — a constructed URL
  // 404s for most of them. Only trust the field, and only switch a team over to
  // photos when most of its XI actually has one, so the row stays consistent.
  function headshot(ath) {
    return (ath && ath.headshot && ath.headshot.href) || '';
  }
  function photoWorthIt(starters) {
    var have = starters.filter(function (p) { return headshot(p.athlete); }).length;
    return have >= Math.ceil(starters.length / 2);
  }

  function pitchHTML(rosters, hColor, aColor, keyEvents) {
    if (!rosters || rosters.length < 2) return '';
    var sides = rosters.map(function (r) {
      return {
        team: r.team || {},
        formation: r.formation || '',
        homeAway: r.homeAway,
        starters: (r.roster || []).filter(function (p) { return p.starter; }),
        bench: (r.roster || []).filter(function (p) { return !p.starter; })
      };
    });
    if (sides.some(function (s) { return s.starters.length < 7; })) return '';

    var home = sides.filter(function (s) { return s.homeAway === 'home'; })[0] || sides[0];
    var away = sides.filter(function (s) { return s !== home; })[0];
    if (!away) return '';

    var subs = subMap(keyEvents);
    var kit = twoColors(hColor, aColor);
    var W = 100, H = 68, R = 3.4;

    function dots(side, fill, isHome) {
      var ink = readableOn(fill);
      var photos = photoWorthIt(side.starters);
      var lines = [[], [], [], [], []];
      side.starters.forEach(function (p) {
        var abbr = (p.position && (p.position.abbreviation || p.position.name)) || '';
        lines[lineIndex(abbr)].push({ p: p, side: sideIndex(abbr), place: parseInt(p.formationPlace, 10) || 99 });
      });
      var used = lines.filter(function (l) { return l.length; });
      var out = '';
      used.forEach(function (line, i) {
        line.sort(function (a, b) { return a.side - b.side || a.place - b.place; });
        var t = used.length > 1 ? i / (used.length - 1) : 0;
        var x = isHome ? 6 + 38 * t : 94 - 38 * t;
        line.forEach(function (item, j) {
          var y = H * (j + 1) / (line.length + 1);
          var ath = item.p.athlete || {};
          var name = ath.shortName || ath.displayName || '';
          var img = photos ? headshot(ath) : '';
          var num = esc(item.p.jersey || '');
          var offClock = item.p.subbedOut ? (subs.off[ath.displayName] || '') : null;

          out += '<g>' +
            '<circle cx="' + x.toFixed(1) + '" cy="' + y.toFixed(1) + '" r="' + R + '" fill="' + fill + '"></circle>' +
            '<text x="' + x.toFixed(1) + '" y="' + (y + 1).toFixed(1) + '" text-anchor="middle" font-size="2.8" ' +
              'font-weight="700" fill="' + ink + '">' + num + '</text>' +
            (img ? '<image href="' + esc(img) + '" x="' + (x - R).toFixed(1) + '" y="' + (y - R).toFixed(1) +
              '" width="' + (R * 2) + '" height="' + (R * 2) + '" preserveAspectRatio="xMidYMid slice" ' +
              'style="clip-path:circle(50%)" onerror="this.style.display=\'none\'"></image>' : '') +
            '<circle cx="' + x.toFixed(1) + '" cy="' + y.toFixed(1) + '" r="' + R + '" fill="none" stroke="' + fill +
              '" stroke-width=".9"></circle>' +
            (offClock !== null ? '<text x="' + (x + R + .6).toFixed(1) + '" y="' + (y - R + 1).toFixed(1) +
              '" font-size="2" fill="var(--loss)" font-weight="700">↓' + esc(offClock) + '</text>' : '') +
            '<text x="' + x.toFixed(1) + '" y="' + (y + R + 3).toFixed(1) + '" text-anchor="middle" font-size="2.3" ' +
              'fill="var(--ink-2)"><tspan fill="var(--muted)">' + num + '</tspan> ' + esc(name) + '</text>' +
            '</g>';
        });
      });
      return out;
    }

    var line = 'stroke="var(--pitch-line)" stroke-width=".4" fill="none"';
    var svg = '<svg viewBox="0 0 ' + W + ' ' + H + '" width="100%" role="img" aria-label="首发阵容" ' +
      'style="display:block;overflow:visible">' +
      '<rect x="1" y="1" width="' + (W - 2) + '" height="' + (H - 2) + '" rx="2" fill="var(--pitch)" ' + line + '></rect>' +
      '<line x1="50" y1="1" x2="50" y2="' + (H - 1) + '" ' + line + '></line>' +
      '<circle cx="50" cy="' + (H / 2) + '" r="7.5" ' + line + '></circle>' +
      '<rect x="1" y="' + (H / 2 - 14) + '" width="11" height="28" ' + line + '></rect>' +
      '<rect x="' + (W - 12) + '" y="' + (H / 2 - 14) + '" width="11" height="28" ' + line + '></rect>' +
      '<rect x="1" y="' + (H / 2 - 6.5) + '" width="4.5" height="13" ' + line + '></rect>' +
      '<rect x="' + (W - 5.5) + '" y="' + (H / 2 - 6.5) + '" width="4.5" height="13" ' + line + '></rect>' +
      dots(home, kit.home, true) + dots(away, kit.away, false) +
      '</svg>';

    function cap(s, color) {
      return '<span class="xi-team"><i style="background:' + color + '"></i>' +
        esc(cn(s.team.displayName, s.team.shortDisplayName)) +
        (s.formation ? '<b>' + esc(s.formation) + '</b>' : '') + '</span>';
    }

    // --- bench / matchday squad ---
    function benchList(side, fill) {
      if (!side.bench.length) return '';
      return '<div class="bench-col"><div class="bench-team"><i style="background:' + fill + '"></i>' +
        esc(cn(side.team.displayName, side.team.shortDisplayName)) + '</div>' +
        side.bench.map(function (p) {
          var ath = p.athlete || {};
          var nm = ath.shortName || ath.displayName || '';
          var came = p.subbedIn;
          var clock = came ? (subs.on[ath.displayName] || '') : '';
          var forWho = p.subbedInFor && p.subbedInFor.athlete &&
            (p.subbedInFor.athlete.shortName || p.subbedInFor.athlete.displayName);
          return '<div class="bench-row' + (came ? ' on' : '') + '">' +
            '<span class="bn">' + esc(p.jersey || '') + '</span>' +
            '<span class="bnm">' + esc(nm) + '</span>' +
            (came ? '<span class="bin">↑' + esc(clock) + (forWho ? ' 替下 ' + esc(forWho) : '') + '</span>' : '') +
            '</div>';
        }).join('') + '</div>';
    }
    var bench = benchList(home, kit.home) + benchList(away, kit.away);

    // --- substitution log ---
    var homeId = String(home.team.id || '');
    var subLog = subs.list.map(function (s) {
      if (!s.on && !s.off) return '';
      var side = s.team === homeId ? '' : ' away';
      return '<div class="ev' + side + '"><span class="min">' + esc(s.clock) + '</span><span>' +
        '<span class="in">↑</span>' + esc(s.on || '') +
        '<span class="out"> ↓</span><span style="color:var(--muted)">' + esc(s.off || '') + '</span></span></div>';
    }).filter(Boolean).join('');

    return '<h4>首发阵容</h4><div class="xi-head">' + cap(home, kit.home) + cap(away, kit.away) + '</div>' +
      '<div class="pitch">' + svg + '</div>' +
      (bench ? '<h4>替补席</h4><div class="bench">' + bench + '</div>' : '') +
      (subLog ? '<h4>换人</h4>' + subLog : '');
  }

  function impliedProb(ml) {
    var v = parseFloat(ml);
    if (isNaN(v)) return null;
    return v > 0 ? 100 / (v + 100) * 100 : (-v) / ((-v) + 100) * 100;
  }

  function loadSummary(id) {
    if (summaryCache[id]) return Promise.resolve(summaryCache[id]);
    var ev = eventById[id];
    var t = ev ? teamsOf(ev) : null;
    var homeId = t && t.home.team && t.home.team.id;
    var awayId = t && t.away.team && t.away.team.id;
    var hName = t ? cn(t.home.team && t.home.team.displayName, t.home.team && t.home.team.shortDisplayName) : '';
    var aName = t ? cn(t.away.team && t.away.team.displayName, t.away.team && t.away.team.shortDisplayName) : '';

    return Promise.all([
      getJSON(API + 'site/v2/sports/soccer/' + league + '/summary?event=' + id),
      homeId ? getJSON(API + 'site/v2/sports/soccer/' + league + '/teams/' + homeId + '/schedule') : null,
      awayId ? getJSON(API + 'site/v2/sports/soccer/' + league + '/teams/' + awayId + '/schedule') : null
    ]).then(function (r) {
      var data = r[0], hSched = r[1], aSched = r[2];
      var html = '';
      if (!data) return '<div class="err" style="padding:14px 0">赛况没取到，收起再展开试一次。</div>';

      // goals and cards, then the full match stats — only populated once it kicks off
      html += timelineHTML(data.keyEvents, homeId);
      html += statsHTML(data.boxscore && data.boxscore.teams, homeId,
        t && t.home.team && t.home.team.color, t && t.away.team && t.away.team.color);

      // win probability, from the sportsbook line (ESPN's predictor rarely covers soccer)
      var pick = (data.pickcenter && data.pickcenter[0]) || null;
      var hP = null, dP = null, aP = null;
      if (pick) {
        var hI = impliedProb(pick.homeTeamOdds && pick.homeTeamOdds.moneyLine);
        var aI = impliedProb(pick.awayTeamOdds && pick.awayTeamOdds.moneyLine);
        var dI = impliedProb(pick.drawOdds && pick.drawOdds.moneyLine);
        var tot = (hI || 0) + (aI || 0) + (dI || 0);
        if (tot > 0) { hP = (hI || 0) / tot * 100; dP = (dI || 0) / tot * 100; aP = (aI || 0) / tot * 100; }
      }
      if (hP != null && (hP + dP + aP) > 0) {
        html += '<h4>赛前胜负预测</h4>' +
          '<div class="odds-bar"><i class="h" style="width:' + hP.toFixed(1) + '%"></i>' +
          '<i class="d" style="width:' + dP.toFixed(1) + '%"></i>' +
          '<i class="a" style="width:' + aP.toFixed(1) + '%"></i></div>' +
          '<div class="odds-key"><span><b>' + esc(hName) + '</b> ' + hP.toFixed(0) + '%</span>' +
          '<span>平 ' + dP.toFixed(0) + '%</span>' +
          '<span><b>' + esc(aName) + '</b> ' + aP.toFixed(0) + '%</span></div>';
        var bits = [];
        if (pick.details) bits.push('让球 ' + pick.details);
        if (pick.overUnder) bits.push('大小球 ' + pick.overUnder);
        if (bits.length) html += '<div class="kv"><span class="k">盘口</span><span>' + esc(bits.join(' · ')) + '</span></div>';
      }

      // season form
      function line(sched) {
        var tm = sched && sched.team;
        if (!tm) return null;
        var parts = [];
        if (tm.recordSummary) parts.push('战绩 ' + tm.recordSummary);
        if (tm.standingSummary) {
          parts.push(tm.standingSummary
            .replace('English Premier League', '英超').replace('Spanish LALIGA', '西甲')
            .replace('Italian Serie A', '意甲').replace('German Bundesliga', '德甲')
            .replace('French Ligue 1', '法甲').replace('UEFA Champions League', '欧冠')
            .replace(/^(\d+)(st|nd|rd|th) in /, '第 $1 名 · '));
        }
        return parts.length ? parts.join(' · ') : null;
      }
      var hl = line(hSched), al = line(aSched);
      if (hl || al) {
        html += '<h4>赛季状态</h4>';
        if (hl) html += '<div class="kv"><span class="k">' + esc(hName) + '</span><span>' + esc(hl) + '</span></div>';
        if (al) html += '<div class="kv"><span class="k">' + esc(aName) + '</span><span>' + esc(al) + '</span></div>';
      }

      // lineups — drawn on a pitch when the XI is out, otherwise a note
      var rosters = data.rosters || [];
      var pitch = pitchHTML(rosters, t && t.home.team && t.home.team.color, t && t.away.team && t.away.team.color, data.keyEvents);
      if (pitch) html += pitch;
      else if (rosters.length) html += '<h4>首发阵容</h4><div class="kv"><span>开赛前约 1 小时公布</span></div>';

      // injuries
      var inj = (data.injuries || []).map(function (g) {
        var list = (g.injuries || []).map(function (i) {
          var n = i.athlete && i.athlete.displayName;
          var st = i.status || (i.details && i.details.type) || '';
          return n ? n + (st ? '（' + st + '）' : '') : '';
        }).filter(Boolean);
        if (!list.length) return '';
        var nm = cn(g.team && g.team.displayName, g.team && g.team.shortDisplayName);
        return '<div class="lineup"><b>' + esc(nm) + '</b><br>' + esc(list.join(' · ')) + '</div>';
      }).filter(Boolean);
      if (inj.length) html += '<h4>伤病名单</h4>' + inj.join('<div style="height:8px"></div>');

      // officials
      var offs = (data.gameInfo && data.gameInfo.officials) || [];
      if (offs.length) {
        var refs = offs.map(function (o) {
          var n = o.displayName || o.fullName || '';
          var p = (o.position && (o.position.displayName || o.position.name)) || '';
          return n ? n + (p ? '（' + p + '）' : '') : '';
        }).filter(Boolean);
        if (refs.length) html += '<h4>裁判</h4><div class="lineup">' + esc(refs.join(' · ')) + '</div>';
      }

      // venue
      var venue = (ev && teamsOf(ev).comp.venue) || null;
      if (venue && venue.fullName) {
        html += '<div class="kv" style="margin-top:12px"><span class="k">球场</span><span>' +
          esc(venue.fullName) + (venue.address && venue.address.city ? ' · ' + esc(venue.address.city) : '') + '</span></div>';
      }

      if (!html) html = '<div class="kv"><span>这场比赛暂时没有更多资料。</span></div>';
      summaryCache[id] = html;
      return html;
    });
  }

  /* ---------- standings ---------- */
  function loadStandings() {
    var host = $('panel-table');
    if (standingsCache[league]) { host.innerHTML = standingsCache[league]; return; }
    host.innerHTML = '<div class="skeleton">正在获取积分榜…</div>';
    getJSON(API + 'v2/sports/soccer/' + league + '/standings').then(function (data) {
      if (!data) { host.innerHTML = '<div class="err">积分榜没取到，切走再切回来试一次。</div>'; return; }
      var groups = [];
      if (data.children && data.children.length) {
        data.children.forEach(function (c) {
          if (c.standings && c.standings.entries) groups.push({ name: c.name || '', entries: c.standings.entries });
        });
      } else if (data.standings && data.standings.entries) {
        groups.push({ name: '', entries: data.standings.entries });
      }
      if (!groups.length) { host.innerHTML = '<div class="empty">这个联赛暂时没有积分榜。</div>'; return; }

      var favIds = favorites.map(function (f) { return String(f.id); });
      var html = groups.map(function (g) {
        var rows = g.entries.slice().map(function (e) {
          var s = {};
          (e.stats || []).forEach(function (st) { s[st.name] = st.displayValue; });
          return { e: e, s: s, rank: parseInt(s.rank, 10) || 999 };
        }).sort(function (a, b) { return a.rank - b.rank; });

        var total = rows.length;
        var body = rows.map(function (r) {
          var tm = r.e.team || {};
          var zone = '';
          if (league === 'uefa.champions') {
            if (r.rank <= 8) zone = 'z-top';
            else if (r.rank <= 24) zone = 'z-mid';
            else zone = 'z-drop';
          } else {
            var z = ZONES[league] || { top: 4, drop: 3 };
            if (r.rank <= z.top) zone = 'z-top';
            else if (r.rank > total - z.drop) zone = 'z-drop';
          }
          var fav = favIds.indexOf(String(tm.id)) !== -1 ? ' fav' : '';
          return '<tr class="' + zone + fav + '">' +
            '<td class="rk">' + r.rank + '</td>' +
            '<td class="tm">' + crest(tm, 20) + '<span class="nm">' + esc(cn(tm.displayName, tm.shortDisplayName)) + '</span></td>' +
            '<td>' + esc(r.s.gamesPlayed || '0') + '</td>' +
            '<td>' + esc(r.s.wins || '0') + '</td>' +
            '<td>' + esc(r.s.ties || '0') + '</td>' +
            '<td>' + esc(r.s.losses || '0') + '</td>' +
            '<td>' + esc(r.s.pointDifferential || '0') + '</td>' +
            '<td class="pts">' + esc(r.s.points || '0') + '</td>' +
          '</tr>';
        }).join('');

        return (g.name && groups.length > 1 ? '<div class="group-name">' + esc(g.name) + '</div>' : '') +
          '<div class="card" style="margin-top:14px"><div class="table-scroll"><table>' +
          '<thead><tr><th class="rk" style="text-align:left">#</th><th class="tm">球队</th>' +
          '<th>赛</th><th>胜</th><th>平</th><th>负</th><th>净胜</th><th>积分</th></tr></thead>' +
          '<tbody>' + body + '</tbody></table></div></div>';
      }).join('');

      html += league === 'uefa.champions'
        ? '<div class="legend"><span><i style="background:var(--accent)"></i>前 8 直接晋级 16 强</span>' +
          '<span><i style="background:var(--hairline-strong)"></i>9-24 名附加赛</span>' +
          '<span><i style="background:var(--loss)"></i>25 名后出局</span></div>'
        : '<div class="legend"><span><i style="background:var(--accent)"></i>' +
          ((ZONES[league] && ZONES[league].topLabel) || '欧冠资格区') + '</span>' +
          '<span><i style="background:var(--loss)"></i>降级区</span></div>';

      standingsCache[league] = html;
      host.innerHTML = html;

      // the standings list is the complete team list — use it for the picker
      teamsOfLeague = [];
      groups.forEach(function (g) {
        g.entries.forEach(function (e) {
          if (e.team) teamsOfLeague.push({ id: String(e.team.id), name: cn(e.team.displayName, e.team.shortDisplayName), team: e.team });
        });
      });
      if (!$('settings').hidden) renderPicker();
    });
  }

  /* ---------- my teams: last week's results, next two weeks, cards, club news ---------- */
  var DAY = 86400000;

  function renderMine() {
    var host = $('panel-mine');
    if (!favorites.length) {
      host.innerHTML = '<div class="empty">还没有设主队。<br>点右上角的「主队」挑最多 5 支球队，这里会显示过去一周的战绩（含红黄牌）、接下来两周的赛程，还有俱乐部新闻和转会消息。</div>';
      return;
    }
    host.innerHTML = '<div class="skeleton">正在获取主队动态…</div>';

    Promise.all(favorites.map(function (f) {
      var base = API + 'site/v2/sports/soccer/' + (f.league || 'eng.1') + '/';
      return Promise.all([
        getJSON(base + 'teams/' + f.id + '/schedule'),
        getJSON(base + 'teams/' + f.id + '/schedule?fixture=true'),
        getJSON(base + 'news?team=' + f.id + '&limit=12')
      ]);
    })).then(function (all) {
      var pending = [];
      var html = all.map(function (r, i) {
        var f = favorites[i];
        var past = r[0], future = r[1], news = r[2];
        var lgName = (LEAGUES.filter(function (l) { return l.id === f.league; })[0] || {}).name || '';
        var tm = (past && past.team) || (future && future.team) || {};
        var body = '';

        // --- last 7 days ---
        var since = Date.now() - 7 * DAY;
        var done = ((past && past.events) || []).filter(function (e) {
          var t = new Date(e.date).getTime();
          return t >= since && t <= Date.now() + DAY;
        }).sort(function (a, b) { return new Date(b.date) - new Date(a.date); });

        body += '<div class="sec-label">过去一周</div>';
        if (done.length) {
          body += done.map(function (e) {
            var slot = 'cards-' + f.id + '-' + e.id;
            pending.push({ id: e.id, league: f.league, teamId: f.id, slot: slot });
            return resultRow(e, f.id) + '<div class="fix-sub" id="' + slot + '">正在读取红黄牌…</div>';
          }).join('');
        } else {
          body += '<div class="fix"><span>过去一周没有比赛</span></div>';
        }

        // --- next 14 days ---
        var until = Date.now() + 14 * DAY;
        var next = ((future && future.events) || []).filter(function (e) {
          var t = new Date(e.date).getTime();
          return t >= Date.now() - 3 * 3600000 && t <= until;
        }).sort(function (a, b) { return new Date(a.date) - new Date(b.date); });

        // an international break can leave the next two weeks nearly empty —
        // top the list up so there is always something to look forward to
        var allNext = ((future && future.events) || []).filter(function (e) {
          return new Date(e.date).getTime() >= Date.now() - 3 * 3600000;
        }).sort(function (a, b) { return new Date(a.date) - new Date(b.date); });
        var extra = next.length < 3 ? allNext.slice(next.length, 3) : [];

        body += '<div class="sec-label">接下来两周</div>';
        if (next.length) {
          body += next.map(function (e) { return upcomingRow(e, f.id); }).join('');
        } else {
          body += '<div class="fix"><span>两周内没有安排比赛（多半是国家队比赛周）</span></div>';
        }
        if (extra.length) {
          body += '<div class="sec-label">再往后</div>' +
            extra.map(function (e) { return upcomingRow(e, f.id); }).join('');
        }

        // --- club news, transfers flagged ---
        var arts = ((news && news.articles) || []).slice(0, 5);
        if (arts.length) {
          body += '<div class="sec-label">俱乐部新闻</div>';
          body += arts.map(function (a) {
            var link = a.links && a.links.web && a.links.web.href;
            var text = ((a.headline || '') + ' ' + (a.description || ''));
            var isTransfer = /transfer|signing|signs|sign |deal|loan|move|join|bid|contract|fee/i.test(text);
            var desc = (a.description || '').trim();
            if (desc === (a.headline || '').trim()) desc = '';
            return '<div class="news-item"><div class="hl">' + esc(a.headline || '') +
              (isTransfer ? '<span class="tag">转会</span>' : '') + '</div>' +
              (desc ? '<p>' + esc(desc) + '</p>' : '') +
              (link ? '<a href="' + esc(link) + '" target="_blank" rel="noopener">查看原文 →</a>' : '') + '</div>';
          }).join('');
        }

        return '<div class="card team-card"><div class="tc-head">' + crest(tm, 26) +
          '<span class="nm">' + esc(f.name) + '</span><span class="lg">' + esc(lgName) + '</span></div>' +
          body + '</div>';
      }).join('');

      host.innerHTML = html;
      pending.forEach(fillMatchCards);
    });
  }

  function sideOf(e, teamId) {
    var c = (e.competitions && e.competitions[0]) || {};
    var cs = c.competitors || [];
    var me = cs.filter(function (x) { return String(x.team && x.team.id) === String(teamId); })[0] || cs[0] || {};
    var opp = cs.filter(function (x) { return x !== me; })[0] || {};
    return { comp: c, me: me, opp: opp };
  }
  function scoreOf(c) {
    if (c == null) return '';
    var s = c.score;
    if (s && typeof s === 'object') return s.displayValue != null ? s.displayValue : (s.value != null ? s.value : '');
    return s == null ? '' : s;
  }

  function resultRow(e, teamId) {
    var s = sideOf(e, teamId);
    var d = new Date(e.date);
    var ha = s.me.homeAway === 'home' ? '主' : '客';
    var opp = cn(s.opp.team && s.opp.team.displayName, s.opp.team && s.opp.team.shortDisplayName);
    var mark = s.me.winner === true ? 'W' : (s.opp.winner === true ? 'L' : 'D');
    var word = mark === 'W' ? '胜' : mark === 'L' ? '负' : '平';
    return '<div class="fix"><span class="when">' + esc(fmtDay(d)) + '</span>' +
      '<span class="vs">' + ha + ' vs ' + esc(opp) + '</span>' +
      '<span class="res ' + mark + '">' + esc(scoreOf(s.me)) + '-' + esc(scoreOf(s.opp)) + ' ' + word + '</span></div>';
  }

  function upcomingRow(e, teamId) {
    var s = sideOf(e, teamId);
    var d = new Date(e.date);
    var ha = s.me.homeAway === 'home' ? '主' : '客';
    var opp = cn(s.opp.team && s.opp.team.displayName, s.opp.team && s.opp.team.shortDisplayName);
    var st = (s.comp.status && s.comp.status.type) || {};
    var right = st.state === 'in'
      ? '<span class="res D">进行中</span>'
      : '<span class="res" style="color:var(--muted);font-weight:600">' + fmtTime(d) + '</span>';
    return '<div class="fix"><span class="when">' + esc(fmtDay(d)) + '</span>' +
      '<span class="vs">' + ha + ' vs ' + esc(opp) + '</span>' + right + '</div>';
  }

  /* pull the cards out of one finished match and drop them under its row */
  function fillMatchCards(job) {
    getJSON(API + 'site/v2/sports/soccer/' + job.league + '/summary?event=' + job.id).then(function (data) {
      var el = document.getElementById(job.slot);
      if (!el) return;
      if (!data) { el.textContent = '红黄牌没取到'; return; }

      var mine = [], theirs = [], scorers = [];
      (data.keyEvents || []).forEach(function (k) {
        var type = (k.type && k.type.text) || '';
        var isMine = String((k.team && k.team.id) || '') === String(job.teamId);
        if (k.scoringPlay === true) {
          if (isMine) {
            var parts = (k.participants || []).map(function (x) { return x.athlete && x.athlete.displayName; }).filter(Boolean);
            scorers.push((parts[0] || evName(k)) + ' ' + ((k.clock && k.clock.displayValue) || ''));
          }
        } else if (/card/i.test(type)) {
          var red = /red/i.test(type);
          var item = { red: red, who: evName(k), min: (k.clock && k.clock.displayValue) || '' };
          (isMine ? mine : theirs).push(item);
        }
      });

      var bits = [];
      if (scorers.length) bits.push('进球：' + esc(scorers.join('、')));
      if (mine.length) {
        bits.push(mine.map(function (c) {
          return '<i class="' + (c.red ? 'rc' : 'yc') + '"></i>' + esc(c.who) + ' ' + esc(c.min);
        }).join('　'));
      }
      var oppY = theirs.filter(function (c) { return !c.red; }).length;
      var oppR = theirs.filter(function (c) { return c.red; }).length;
      if (oppY || oppR) bits.push('对手 ' + oppY + ' 黄' + (oppR ? ' ' + oppR + ' 红' : ''));

      el.innerHTML = bits.length ? bits.join(' · ') : '本场无进球、无红黄牌';
    });
  }

  /* ---------- picker ---------- */
  function renderPicker() {
    var host = $('picker');
    if (!teamsOfLeague.length) {
      host.innerHTML = '<div class="skeleton">正在载入球队…</div>';
      loadStandings();
      return;
    }
    var favIds = favorites.map(function (f) { return String(f.id); });
    host.innerHTML = teamsOfLeague.map(function (t) {
      return '<label><input type="checkbox" value="' + esc(t.id) + '" data-name="' + esc(t.name) +
        '" data-raw="' + esc((t.team && t.team.displayName) || t.name) + '"' +
        (favIds.indexOf(t.id) !== -1 ? ' checked' : '') + '>' + esc(t.name) + '</label>';
    }).join('');
    updateCount();
  }
  function currentPicked() {
    return Array.prototype.slice.call(document.querySelectorAll('#picker input:checked'));
  }
  function updateCount() {
    var others = favorites.filter(function (f) { return f.league !== league; }).length;
    $('pickCount').textContent = '已选 ' + (currentPicked().length + others) + ' / ' + MAX_TEAMS;
  }

  /* ---------- notifications (only while this page is open) ---------- */
  function enableNotifications() {
    if (!('Notification' in window)) { alert('这个浏览器不支持网页通知。'); return; }
    Notification.requestPermission().then(function (p) {
      if (p === 'granted') { notifyOn = true; $('notifyBtn').textContent = '🔔 提醒已开'; }
      else alert('浏览器没给通知权限，可以在浏览器设置里重新打开。');
    });
  }
  function checkKickoffs() {
    if (!notifyOn || !favorites.length) return;
    var favIds = favorites.map(function (f) { return String(f.id); });
    events.forEach(function (ev) {
      var t = teamsOf(ev);
      var ids = [t.home.team && t.home.team.id, t.away.team && t.away.team.id].map(String);
      if (!ids.some(function (i) { return favIds.indexOf(i) !== -1; })) return;
      var mins = (new Date(ev.date) - new Date()) / 60000;
      var key = 'kick-' + ev.id;
      if (mins > 0 && mins <= 60 && !lsGet(key, false)) {
        try {
          new Notification(cn(t.home.team && t.home.team.displayName) + ' vs ' +
            cn(t.away.team && t.away.team.displayName), { body: '约 ' + Math.round(mins) + ' 分钟后开球' });
        } catch (e) {}
        lsSet(key, true);
      }
    });
  }

  /* ---------- events ---------- */
  $('chips').addEventListener('click', function (e) {
    var b = e.target.closest('.chip');
    if (!b) return;
    league = b.dataset.lg;
    lsSet('lg', league);
    renderChips();
    summaryCache = {};
    teamsOfLeague = [];
    loadFixtures();
    if (tab === 'table') loadStandings();
    if (!$('settings').hidden) renderPicker();
  });

  $('sportnav').addEventListener('click', function (e) {
    var b = e.target.closest('button[data-sport]');
    if (b) setSport(b.dataset.sport);
  });

  document.querySelector('.seg').addEventListener('click', function (e) {
    var b = e.target.closest('button[data-tab]');
    if (b) setTab(b.dataset.tab);
  });

  $('panel-fixtures').addEventListener('click', function (e) {
    var b = e.target.closest('.match');
    if (b) toggleDetail(b);
  });

  $('refreshBtn').addEventListener('click', function () {
    var el = $('refreshBtn');
    el.classList.add('spinning');
    summaryCache = {};
    standingsCache = {};
    loadFixtures().then(function () {
      if (tab === 'table') loadStandings();
      if (tab === 'mine') renderMine();
      checkKickoffs();
      setTimeout(function () { el.classList.remove('spinning'); }, 500);
    });
  });

  $('gearBtn').addEventListener('click', function () {
    var p = $('settings');
    p.hidden = !p.hidden;
    if (!p.hidden) renderPicker();
  });

  $('picker').addEventListener('change', function (e) {
    var others = favorites.filter(function (f) { return f.league !== league; }).length;
    if (currentPicked().length + others > MAX_TEAMS) {
      e.target.checked = false;
      alert('最多只能选 ' + MAX_TEAMS + ' 支球队。');
    }
    updateCount();
  });

  $('saveTeams').addEventListener('click', function () {
    var kept = favorites.filter(function (f) { return f.league !== league; });
    var picked = currentPicked().map(function (c) {
      return { id: c.value, name: c.dataset.name, raw: c.dataset.raw, league: league };
    });
    favorites = kept.concat(picked).slice(0, MAX_TEAMS);
    lsSet('favTeams', favorites);
    $('favCount').textContent = favorites.length;
    $('settings').hidden = true;
    standingsCache = {};
    if (tab === 'table') loadStandings();
    setTab('mine');
  });

  $('notifyBtn').addEventListener('click', enableNotifications);

  /* ---------- boot ---------- */
  renderChips();
  renderSportNav();
  setSport(sport);
  $('favCount').textContent = favorites.length;
  loadFixtures().then(checkKickoffs);
})();
</script>

</body>
</html>
