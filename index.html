  /* The field offered: the drivers you follow, plus the top of the
     championship, because a twenty-name list is a menu nobody reads. */
  /* Keyed on the driver's name, not ESPN's athlete id. The standings carry an
     id but the race results do not — `athlete` there is name and flag only —
     so an id-keyed call could never be matched against a finished race, and
     the old single-driver version silently settled every call as a miss.
     driverCN runs on both sides, so the two always agree. */
  function f1DriverKey(name) {
    return String(driverCN(name) || name || '').replace(/~/g, '').trim();
  }
  function f1Field() {
    var field = favDrivers.map(function (f) { return f1DriverKey(f.name); });
    var entries = (((f1Cache.standings || {}).children || []).filter(function (c) {
      return /driver/i.test(c.name || '');
    })[0] || {});
    var top = ((entries.standings || {}).entries || []).slice(0, 8).map(function (e) {
      return f1DriverKey((e.athlete || {}).displayName);
    });
    var seen = {}, list = [];
    top.concat(field).forEach(function (name) {
      if (!name || seen[name]) return;
      seen[name] = 1;
      list.push(name);
    });
    return list;
  }

  var PODIUM_PLACE = ['冠军', '亚军', '季军'];

  function f1PickHTML(ev, mine) {
    var list = f1Field();
    var nameOf = function (key) { return key; };

    if (mine && mine.result) {
      var mineIds = podiumParse(mine.side);
      var actual = podiumParse(mine.result);
      return '<h4>你的领奖台</h4>' +
        '<div class="podium settled">' + mineIds.map(function (idv, i) {
          var right = idv && idv === actual[i];
          var onBox = idv && actual.indexOf(idv) !== -1;
          return '<div class="pod-row ' + (right ? 'exact' : (onBox ? 'near' : 'off')) + '">' +
            '<span class="pod-place">' + PODIUM_PLACE[i] + '</span>' +
            '<span class="pod-name">' + esc(idv ? nameOf(idv) : '—') + '</span>' +
            '<span class="pod-real">实际 ' + esc(actual[i] ? nameOf(actual[i]) : '—') + '</span>' +
            '</div>';
        }).join('') + '</div>' +
        (mine.note ? '<div class="pd-line ' + (mine.hit ? '' : 'muted') + '">' +
          (mine.hit ? '✓ ' : '✗ ') + esc(mine.note) + '</div>' : '');
    }

    if (!list.length) return '';
    var chosen = podiumParse(mine && mine.side);
    var filled = chosen.filter(Boolean).length;

    return '<h4>预判领奖台</h4>' +
      '<div class="pd-line muted" style="padding:0 0 8px">' +
      '按顺序点出前三名。三个人都站上台就算命中，位置对了几个另外记。</div>' +
      '<div class="podium" data-podium-for="f1|' + esc(ev.id) + '"' +
      ' data-when="' + esc(ev.date || '') + '"' +
      ' data-tag="' + esc(ev.shortName || ev.name || '') + '">' +
      '<div class="pod-slots">' + chosen.map(function (idv, i) {
        return '<button type="button" class="pod-slot' + (idv ? ' on' : '') +
          '" data-slot="' + i + '">' +
          '<b>' + PODIUM_PLACE[i] + '</b>' +
          '<span>' + esc(idv ? nameOf(idv) : '—') + '</span></button>';
      }).join('') + '</div>' +
      '<div class="pod-field">' + list.slice(0, 10).map(function (name) {
        var used = chosen.indexOf(name) !== -1;
        return '<button type="button" class="pod-driver' + (used ? ' used' : '') +
          '" data-key="' + esc(name) + '"' + (used ? ' disabled' : '') + '>' +
          esc(name) + '</button>';
      }).join('') + '</div>' +
      '<div class="pod-hint">' + (filled === PODIUM_N ? '已记下，开赛前都能改'
        : '再选 ' + (PODIUM_N - filled) + ' 位') + '</div></div>';
  }

  /* Rebuilds the picker in place after a tap, so the slots, the greyed-out
     drivers and the hint all move together without re-fetching the race. */
  function f1PodiumRefresh(box, evId, when, tag) {
    var mine = pickOf('f1', evId);
    var fake = { id: evId, date: when, shortName: tag };
    var html = f1PickHTML(fake, mine);
    var wrap = document.createElement('div');
    wrap.innerHTML = html;
    var fresh = wrap.querySelector('.podium');
    if (fresh && box.parentNode) {
      box.parentNode.replaceChild(fresh, box);
      return fresh;
    }
    return box;
  }

  function toggleGp(btn) {
    var next = btn.nextElementSibling;
    if (next && next.classList.contains('detail')) { next.remove(); return; }
    var id = btn.dataset.ev;
    // the call needs the championship order, which the calendar view has not
    // fetched — ask for both so the driver list is never empty
    Promise.all([f1Season(), f1Standings()]).then(function (all) {
      var d = all[0];
      var ev = ((d && d.events) || []).filter(function (e) { return String(e.id) === String(id); })[0];
      if (!ev) return;
      var html = '';

      /* A call on the race winner. The field is the drivers you follow plus
         whoever is top of the championship, because a twenty-name list is a
         menu nobody reads. */
      var race0 = raceOf(ev) || {};
      var over = ((ev.status || {}).type || {}).state === 'post';
      if (over) {
        var top3 = (race0.competitors || []).slice()
          .sort(function (x, y) { return (x.order || 99) - (y.order || 99); })
          .slice(0, PODIUM_N)
          .map(function (c) { return f1DriverKey((c.athlete || {}).displayName); })
          .filter(Boolean);
        var myCall = pickOf('f1', ev.id);
        if (myCall && !myCall.result && top3.length === PODIUM_N) {
          var mineIds = podiumParse(myCall.side);
          var grade = podiumGrade(mineIds, top3);
          settlePick('f1', ev.id, podiumSide(top3), '', grade);
        }
      }
      var myF1 = pickOf('f1', ev.id);
      if (!over || (myF1 && myF1.result)) {
        html += f1PickHTML(ev, myF1);
      }

      var comps = (ev.competitions || []).slice().sort(function (a, b) {
        return new Date(a.date) - new Date(b.date);
      });
      if (comps.length) {
        html += '<h4>赛程安排</h4>' + comps.map(function (c) {
          var t = (c.type && (c.type.text || c.type.abbreviation)) || '';
          var cd = new Date(c.date);
          return '<div class="kv"><span class="k">' + esc(SESSION_CN[t] || t) + '</span><span>' +
            (isNaN(cd) ? '待定' : esc(fmtDay(cd) + ' ' + fmtTime(cd))) + '</span></div>';
        }).join('');
      }
      var race = raceOf(ev);
      var finished = !!(ev.status && ev.status.type && ev.status.type.completed);
      if (!finished && ev.status && ev.status.type && ev.status.type.state === 'post') {
        html += '<div class="kv" style="margin-top:10px"><span>这一站官方没有提供成绩数据。</span></div>';
      }
      if (finished) html += '<h4>正赛成绩</h4><div id="res-' + esc(id) + '">' +
        '<div class="skeleton" style="padding:12px 0">正在获取成绩…</div></div>';
      var rDate = new Date((race && race.date) || ev.date);
      html += clipSearchHTML(
        'F1 ' + (isNaN(rDate) ? '' : rDate.getFullYear()) + ' ' +
        String(ev.name || '').replace(/^[^ ]+ /, '') + ' race highlights',
        'F1 ' + gpName(ev.name) + ' 正赛 集锦 ' + dayCN(rDate));
      html += linksHTML(ev.links, '官方页面');
      if (ev.circuit) {
        var ci = ev.circuit;
        html += '<div class="kv" style="margin-top:12px"><span class="k">赛道</span><span>' +
          esc(ci.fullName || '') + (ci.address && ci.address.city ? ' · ' + esc(ci.address.city) : '') +
          '</span></div>';
      }
      var box = document.createElement('div');
      box.className = 'detail';
      box.innerHTML = html || '<div class="kv"><span>这一站暂时没有更多资料。</span></div>';
      btn.parentNode.insertBefore(box, btn.nextSibling);

      if (!finished) return;
      var slot = document.getElementById('res-' + id);
      sessionKeyFor((race && race.date) || ev.date).then(function (key) {
        if (!key) { if (slot) slot.innerHTML = '<div class="kv"><span>这一站还没有详细成绩。</span></div>'; return; }
        return Promise.all([f1RaceData(key), f1DriverMap()]).then(function (r) {
          if (!slot || !slot.isConnected) return;
          var data = r[0], drivers = r[1];
          var table = resultTable(data, drivers);
          slot.innerHTML = (table || '<div class="err" style="padding:12px 0">成绩接口暂时限流了，' +
            '收起再展开重试一次。</div>') +
            stintsHTML(data.stints, drivers, data.rows) +
            stewardsHTML(data.rc, drivers) +
            weatherHTML(data.weather);
        });
      });
    });
  }

  function renderF1Table() {
    var host = panelFor('panel-table');
    host.innerHTML = '<div class="skeleton">正在获取积分榜…</div>';
    f1Standings().then(function (d) {
      var groups = (d && d.children) || [];
      if (!groups.length) { host.innerHTML = '<div class="err">积分榜没取到。</div>'; return; }
      host.innerHTML = groups.map(function (g) {
        var isDriver = /driver/i.test(g.name || '');
        var rows = ((g.standings && g.standings.entries) || []).map(function (e) {
          var s = {};
          (e.stats || []).forEach(function (x) { s[x.name] = x.displayValue; });
          var who = e.athlete || e.team || {};
          var label = isDriver ? driverCN(who.displayName) : teamCN(who.displayName);
          var pts = s.championshipPts || s.points || '0';
          var rank = parseInt(s.rank, 10) || 99;
          return { rank: rank, label: label, pts: pts, ath: isDriver ? who : null, team: isDriver ? null : who };
        }).sort(function (a, b) { return a.rank - b.rank; });

        return '<div class="group-name">' + (isDriver ? '车手积分榜' : '车队积分榜') + '</div>' +
          '<div class="card"><div class="table-scroll"><table><thead><tr>' +
          '<th class="rk" style="text-align:left">#</th><th class="tm">' + (isDriver ? '车手' : '车队') +
          '</th><th>积分</th></tr></thead><tbody>' +
          rows.map(function (r) {
            var zone = r.rank <= 3 ? 'z-top' : '';
            var logo = r.team && r.team.logos && r.team.logos[0] && r.team.logos[0].href;
            return '<tr class="' + zone + '"><td class="rk">' + r.rank + '</td>' +
              '<td class="tm">' + (r.ath ? flagImg(r.ath) : (logo ?
                '<img class="crest" src="' + esc(logo) + '" alt="" loading="lazy" style="width:20px;height:20px">' : '')) +
              '<span class="nm">' + esc(r.label) + '</span></td>' +
              '<td class="pts">' + esc(r.pts) + '</td></tr>';
          }).join('') + '</tbody></table></div></div>';
      }).join('');
    });
  }

  /* ---------- OpenF1: classification, pit stops, lap times, driver portraits ----------
     ESPN gives the calendar and session times; OpenF1 fills in everything ESPN
     leaves empty. Races are matched between the two by calendar date. */
  var OF1 = 'https://api.openf1.org/v1/';
  var MAX_DRIVERS = 3;
  var favDrivers = lsGet('favDrivers', []);

  // OpenF1 rate-limits bursts (HTTP 429), so requests go out one at a time with
  // a gap, a 429 is retried with backoff, and only real answers are cached.
  var of1Queue = Promise.resolve();
  var of1Pending = {};
  function wait(ms) { return new Promise(function (r) { setTimeout(r, ms); }); }

  function of1Fetch(url, attempt) {
    return fetch(url).then(function (r) {
      if (r.status === 429 && attempt < 3) {
        return wait(1000 * (attempt + 1)).then(function () { return of1Fetch(url, attempt + 1); });
      }
      return r.ok ? r.json() : null;
    }).catch(function () { return null; });
  }

  function of1(path) {
    if (f1Cache[path]) return Promise.resolve(f1Cache[path]);
    if (of1Pending[path]) return of1Pending[path];
    var run = of1Queue.then(function () { return of1Fetch(OF1 + path, 0); })
      .then(function (d) {
        delete of1Pending[path];
        if (d) f1Cache[path] = d;   // a failure is never cached, so it can retry later
        return d || [];
      });
    of1Pending[path] = run;
    of1Queue = run.catch(function () {}).then(function () { return wait(350); });
    return run;
  }
  function f1DriverMap() {
    if (f1Cache.drivers) return Promise.resolve(f1Cache.drivers);
    return of1('drivers?session_key=latest').then(function (list) {
      var map = {};
      (list || []).forEach(function (d) { map[d.driver_number] = d; });
      if (list && list.length) f1Cache.drivers = map;
      return map;
    });
  }
  function f1RaceSessions() {
    return of1('sessions?year=' + new Date().getFullYear() + '&session_type=Race');
  }
  function sessionKeyFor(dateISO) {
    var day = String(dateISO || '').slice(0, 10);
    return f1RaceSessions().then(function (list) {
      var hit = (list || []).filter(function (s) {
        return String(s.date_start || '').slice(0, 10) === day;
      })[0];
      return hit ? hit.session_key : null;
    });
  }
  function f1RaceData(key) {
    var tag = 'race' + key;
    if (f1Cache[tag]) return Promise.resolve(f1Cache[tag]);
    return Promise.all([
      of1('session_result?session_key=' + key),
      of1('pit?session_key=' + key),
      of1('laps?session_key=' + key),
      of1('race_control?session_key=' + key),
      of1('stints?session_key=' + key),
      of1('weather?session_key=' + key)
    ]).then(function (r) {
      var rows = (r[0] || []).slice().sort(function (a, b) {
        return (a.position || 99) - (b.position || 99);
      });
      var pits = {};
      (r[1] || []).forEach(function (p) {
        var n = p.driver_number;
        pits[n] = pits[n] || { count: 0, best: null };
        pits[n].count++;
        var d = p.pit_duration || p.lane_duration;
        if (d && (pits[n].best === null || d < pits[n].best)) pits[n].best = d;
      });
      var fastest = null;
      (r[2] || []).forEach(function (l) {
        if (!l.lap_duration) return;
        if (!fastest || l.lap_duration < fastest.lap_duration) fastest = l;
      });
      var out = {
        rows: rows, pits: pits, fastest: fastest,
        rc: r[3] || [], stints: r[4] || [], weather: r[5] || []
      };
      if (rows.length) f1Cache[tag] = out;
      return out;
    }).catch(function () {
      return { rows: [], pits: {}, fastest: null, rc: [], stints: [], weather: [] };
    });
  }

  function lapTime(sec) {
    if (!sec && sec !== 0) return '';
    var h = Math.floor(sec / 3600);
    var m = Math.floor((sec - h * 3600) / 60);
    var s = (sec - h * 3600 - m * 60).toFixed(3);
    var pad = (s < 10 ? '0' : '') + s;
    if (h) return h + ':' + String(m).padStart(2, '0') + ':' + pad;
    return m ? m + ':' + pad : s;
  }
  function gapText(row, lead) {
    if (row.dnf) return '退赛';
    if (row.dsq) return '取消成绩';
    if (row.dns) return '未发车';
    if (row.position === 1) return lapTime(row.duration);
    if (row.gap_to_leader === null || row.gap_to_leader === undefined) return '';
    if (typeof row.gap_to_leader === 'string') return row.gap_to_leader;
    return '+' + Number(row.gap_to_leader).toFixed(3);
  }
  function driverChip(d, size) {
    if (!d) return '';
    var px = size || 26;
    var col = d.team_colour ? '#' + d.team_colour : 'var(--muted)';
    return '<span class="dportrait" style="width:' + px + 'px;height:' + px + 'px;background:' + col + '">' +
      (d.headshot_url ? '<img src="' + esc(d.headshot_url) + '" alt="" loading="lazy">' : '') + '</span>';
  }

  function resultTable(data, drivers) {
    if (!data.rows.length) return '';
    var body = data.rows.map(function (r) {
      var d = drivers[r.driver_number] || {};
      var p = data.pits[r.driver_number];
      var pos = r.dnf || r.dns || r.dsq ? '—' : r.position;
      var cls = r.position === 1 ? ' p1' : r.position === 2 ? ' p2' : r.position === 3 ? ' p3' : '';
      var isFast = data.fastest && data.fastest.driver_number === r.driver_number;
      return '<tr class="' + cls.trim() + '">' +
        '<td class="rk">' + esc(pos) + '</td>' +
        '<td class="tm">' + driverChip(d, 22) +
          '<span class="nm">' + esc(driverCN(d.full_name || '') || d.name_acronym || r.driver_number) + '</span>' +
          (isFast ? '<span class="fl-tag">最快圈</span>' : '') + '</td>' +
        '<td class="dteam">' + esc(teamCN(d.team_name || '')) + '</td>' +
        '<td>' + esc(r.number_of_laps || '') + '</td>' +
        '<td class="gap">' + esc(gapText(r)) + '</td>' +
        '<td>' + (p ? p.count : 0) + '</td>' +
        '<td class="pts">' + (r.points ? r.points : '') + '</td>' +
      '</tr>';
    }).join('');

    var fl = '';
    if (data.fastest) {
      var fd = drivers[data.fastest.driver_number] || {};
      fl = '<div class="kv" style="margin-top:10px"><span class="k">全场最快圈</span><span>' +
        esc(driverCN(fd.full_name || '') || fd.name_acronym || '') + ' · ' +
        esc(lapTime(data.fastest.lap_duration)) + ' （第 ' + esc(data.fastest.lap_number || '?') + ' 圈）</span></div>';
    }
    return '<div class="table-scroll"><table class="f1res"><thead><tr>' +
      '<th class="rk" style="text-align:left">#</th><th class="tm">车手</th><th class="dteam">车队</th>' +
      '<th>圈数</th><th class="gap">用时 / 差距</th><th>进站</th><th>积分</th>' +
      '</tr></thead><tbody>' + body + '</tbody></table></div>' + fl;
  }

  /* ---------- tyre strategy, stewards' decisions, weather ---------- */
  var TYRE = {
    SOFT: { c: '#E8413C', n: '软胎' }, MEDIUM: { c: '#E3C534', n: '中性胎' },
    HARD: { c: '#DDE2E0', n: '硬胎' }, INTERMEDIATE: { c: '#3FA34D', n: '半雨胎' },
    WET: { c: '#2F6FD0', n: '全雨胎' }, TEST_UNKNOWN: { c: '#8A9491', n: '未知' }
  };
  function tyre(c) { return TYRE[String(c || '').toUpperCase()] || TYRE.TEST_UNKNOWN; }

  function stintsHTML(stints, drivers, rows) {
    if (!stints || !stints.length) return '';
    var byDriver = {};
    var maxLap = 0;
    stints.forEach(function (s) {
      (byDriver[s.driver_number] = byDriver[s.driver_number] || []).push(s);
      if (s.lap_end > maxLap) maxLap = s.lap_end;
    });
    if (!maxLap) return '';

    // keep the classification order so the strategy lines up with the result table
    var order = (rows || []).map(function (r) { return r.driver_number; })
      .filter(function (n) { return byDriver[n]; });
    Object.keys(byDriver).forEach(function (n) {
      if (order.indexOf(Number(n)) === -1 && order.indexOf(n) === -1) order.push(Number(n));
    });

    var used = {};
    var body = order.map(function (num) {
      var list = (byDriver[num] || []).slice().sort(function (a, b) { return a.lap_start - b.lap_start; });
      if (!list.length) return '';
      var d = drivers[num] || {};
      var bar = list.map(function (s) {
        var laps = Math.max(1, (s.lap_end || 0) - (s.lap_start || 0) + 1);
        var t = tyre(s.compound);
        used[s.compound] = t;
        return '<i style="flex:' + laps + ';background:' + t.c + '" title="' +
          esc(t.n + ' ' + laps + ' 圈') + '">' + (laps >= 6 ? laps : '') + '</i>';
      }).join('');
      return '<div class="stint-row"><span class="sn">' +
        esc(d.name_acronym || num) + '</span><span class="sbarline">' + bar + '</span></div>';
    }).join('');

    var legend = Object.keys(used).map(function (k) {
      return '<span><i style="background:' + used[k].c + '"></i>' + used[k].n + '</span>';
    }).join('');
    return '<h4>轮胎策略</h4><div class="stints">' + body + '</div>' +
      '<div class="legend">' + legend + '</div>';
  }

  var RC_CN = [
    [/VIRTUAL SAFETY CAR DEPLOYED/gi, '虚拟安全车启用'], [/VIRTUAL SAFETY CAR ENDING/gi, '虚拟安全车结束'],
    [/SAFETY CAR DEPLOYED/gi, '安全车出动'], [/SAFETY CAR IN THIS LAP/gi, '安全车本圈返回'],
    [/DRIVE THROUGH PENALTY/gi, '通过维修道处罚'], [/STOP AND GO PENALTY/gi, '停车罚时'],
    [/(\d+) SECOND TIME PENALTY/gi, '$1 秒罚时'], [/TIME PENALTY/gi, '罚时'],
    [/GRID (?:PLACE )?PENALTY/gi, '发车位罚退'], [/PENALTY POINTS?/gi, '罚分'],
    [/UNDER INVESTIGATION/gi, '调查中'], [/INVESTIGATION AFTER THE RACE/gi, '赛后调查'],
    [/NO FURTHER ACTION/gi, '不予处罚'], [/NOTED/gi, '已记录'],
    [/INCIDENT INVOLVING/gi, '事故涉及'], [/INCIDENT/gi, '事故'],
    [/TRACK LIMITS/gi, '越出赛道界限'], [/DELETED/gi, '成绩取消'],
    [/DISQUALIFIED/gi, '取消资格'], [/REPRIMAND/gi, '书面警告'], [/WARNING/gi, '警告'],
    [/FALSE START/gi, '起步违例'], [/UNSAFE RELEASE/gi, '危险放车'],
    [/PIT LANE/gi, '维修道'], [/RED FLAG/gi, '红旗'], [/CHEQUERED FLAG/gi, '方格旗'],
    [/TURN (\d+)/gi, '$1 号弯'], [/LAP (\d+)/gi, '第 $1 圈'],
    [/CARS? (\d+) \(([A-Z]{3})\)/gi, '$1 号车（$2）'], [/CAR (\d+)/gi, '$1 号车'],
    [/\bAND\b/g, '与'], [/\bFOR\b/g, '原因：'], [/\bIN\b/g, '于'], [/\bAT\b/g, '于']
  ];
  function rcCN(msg) {
    var out = String(msg || '');
    RC_CN.forEach(function (r) { out = out.replace(r[0], r[1]); });
    return out.replace(/\s+/g, ' ').trim();
  }

  function stewardsHTML(rc, drivers) {
    if (!rc || !rc.length) return '';
    var keep = /PENALTY|INVESTIGAT|WARNING|DELETED|REPRIMAND|DISQUALIF|DRIVE.THROUGH|STOP.GO|GRID DROP|BLACK/i;
    var rows = rc.filter(function (m) {
      var txt = m.message || '';
      if (keep.test(txt)) return true;
      if (m.category === 'SafetyCar') return true;
      if (m.flag === 'RED') return true;
      return false;
    });
    if (!rows.length) return '';
    return '<h4>判罚与赛会通告</h4><div class="steward">' + rows.map(function (m) {
      var txt = m.message || '';
      var d = drivers[m.driver_number];
      var who = d ? (driverCN(d.full_name || '') || d.name_acronym) : '';
      var kind, tag;
      if (/DISQUALIF/i.test(txt)) { kind = 'pen'; tag = '取消资格'; }
      else if (/PENALTY|DRIVE.THROUGH|STOP.GO/i.test(txt)) { kind = 'pen'; tag = '罚时'; }
      else if (/DELETED/i.test(txt)) { kind = 'del'; tag = '成绩取消'; }
      else if (/INVESTIGAT|NOTED/i.test(txt)) { kind = 'inv'; tag = '调查'; }
      else if (/REPRIMAND|WARNING/i.test(txt)) { kind = 'inv'; tag = '警告'; }
      else if (m.category === 'SafetyCar') { kind = 'sc'; tag = '安全车'; }
      else if (m.flag === 'RED') { kind = 'red'; tag = '红旗'; }
      else { kind = ''; tag = '通告'; }
      return '<div class="st-row ' + kind + '">' +
        '<span class="st-tag">' + tag + '</span>' +
        '<span class="msg">' + (who ? '<b>' + esc(who) + '</b> ' : '') + esc(rcCN(txt)) + '</span>' +
        '<span class="lap">' + (m.lap_number ? 'L' + esc(m.lap_number) : '') + '</span>' +
        '</div>';
    }).join('') + '</div>';
  }

  function weatherHTML(w) {
    if (!w || !w.length) return '';
    var air = w.map(function (x) { return x.air_temperature; }).filter(function (v) { return v || v === 0; });
    var trk = w.map(function (x) { return x.track_temperature; }).filter(function (v) { return v || v === 0; });
    var rain = w.some(function (x) { return x.rainfall; });
    if (!air.length && !trk.length) return '';
    function rng(a) {
      var lo = Math.min.apply(null, a), hi = Math.max.apply(null, a);
      return Math.round(lo) === Math.round(hi) ? Math.round(lo) + '°C'
        : Math.round(lo) + '–' + Math.round(hi) + '°C';
    }
    var pills = [];
    if (air.length) pills.push(['气温', rng(air)]);
    if (trk.length) pills.push(['地表温度', rng(trk)]);
    pills.push(['路况', rain ? '有降雨' : '干地']);
    return '<h4>赛道条件</h4><div class="wx">' + pills.map(function (p) {
      return '<span class="wx-pill"><span class="wl">' + p[0] + '</span><b>' + esc(p[1]) + '</b></span>';
    }).join('') + '</div>';
  }

  /* ---------- head-to-head history and recent form ---------- */

    }).slice(0, 8).map(function (e) {

      var hn = nameFn(home.team && home.team.displayName, home.team && home.team.abbreviation);

        esc(home.score) + ' - ' + esc(away.score) + ' ' +
        '<b' + (aw ? '' : ' style="font-weight:500;color:var(--muted)"') + '>' + esc(an) + '</b>' +
        '</span></div>';
    }).join('');
    var head = s0.summary ? '<div class="kv"><span class="k">交锋</span><span>' +
      esc(seriesCN(s0.summary)) + '</span></div>' : '';

  /* ---------- post-match highlights ---------- */
  function clipTime(sec) {
    if (!sec) return '';
    var m = Math.floor(sec / 60), ss = sec % 60;
    return m + ':' + String(ss).padStart(2, '0');
  }
  function videosHTML(videos, title) {
    var list = (videos || []).filter(function (v) {
      return v && (v.headline || v.description);
    }).slice(0, 6);
    if (!list.length) return '';
    return '<h4>' + (title || '赛后集锦') + '</h4><div class="clips">' + list.map(function (v) {
      var link = (v.links && v.links.web && v.links.web.href) ||
        (v.links && v.links.source && v.links.source.href) || '';
      var thumb = v.thumbnail || (v.posterImages && v.posterImages.default && v.posterImages.default.href) || '';
      var inner = '<span class="clip-thumb">' +
        (thumb ? '<img src="' + esc(thumb) + '" alt="" loading="lazy">' : '') +
        '<span class="clip-play">▶</span>' +
        (v.duration ? '<span class="clip-dur">' + esc(clipTime(v.duration)) + '</span>' : '') +
        '</span><span class="clip-title">' + esc(v.headline || v.description || '') + '</span>';
      return link
        ? '<a class="clip" href="' + esc(link) + '" target="_blank" rel="noopener">' + inner + '</a>'
        : '<span class="clip">' + inner + '</span>';
    }).join('') + '</div>';
  }
  // No highlight feed covers everything, so offer a search on both sides of the
  // firewall. The query carries the score and the date because the same fixture
  // comes round every season and a bare "A vs B" lands on a years-old video.
  /* Where a feed hands us real clips we show those; everywhere else this is
     the fallback, and it is drawn as the same tile grid so highlights look the
     same in every section rather than a link in some and thumbnails in others. */
  function clipSearchHTML(en, zh, label) {
    var tiles = [];
    if (en) {
      // sp=EgIIAw%3D%3D restricts YouTube results to the past year
      tiles.push(searchTile(
        'https://www.youtube.com/results?search_query=' +
          encodeURIComponent(en) + '&sp=EgIIAw%253D%253D',
        'yt', 'YouTube', en));
    }
    if (zh) {
      // order=pubdate puts the newest uploads first on Bilibili
      tiles.push(searchTile(
        'https://search.bilibili.com/all?keyword=' + encodeURIComponent(zh) + '&order=pubdate',
        'bili', '哔哩哔哩', zh));
    }
    if (!tiles.length) return '';
    return '<h4>' + (label || '赛后集锦') + '</h4><div class="clips">' + tiles.join('') + '</div>';
  }
  function searchTile(href, kind, site, query) {
    return '<a class="clip" href="' + esc(href) + '" target="_blank" rel="noopener">' +
      '<span class="clip-thumb search ' + kind + '"><span class="clip-play">▶</span>' +
      '<span class="clip-site">' + esc(site) + '</span></span>' +
      '<span class="clip-title">搜索「' + esc(query) + '」</span></a>';
  }
  function dayCN(d) {
    return isNaN(d) ? '' : (d.getFullYear() + '年' + (d.getMonth() + 1) + '月' + d.getDate() + '日');
  }
  function dayEN(d) {
    var M = ['January','February','March','April','May','June','July','August','September','October','November','December'];
    return isNaN(d) ? '' : M[d.getMonth()] + ' ' + d.getDate() + ' ' + d.getFullYear();
  }

  function linksHTML(links, title) {
    var list = (links || []).filter(function (l) { return l.href && l.text; }).slice(0, 5);
    if (!list.length) return '';
    return '<h4>' + (title || '相关链接') + '</h4><div class="schips">' + list.map(function (l) {
      return '<a class="schip" href="' + esc(l.href) + '" target="_blank" rel="noopener">' +
        esc(l.text) + ' →</a>';
    }).join('') + '</div>';
  }

  /* ---------- 今天: everything the viewer follows, in one screen ---------- */
  function within(dateStr, hoursBack, hoursAhead) {
    var t = new Date(dateStr).getTime();
    if (isNaN(t)) return false;
    var now = Date.now();
    return t >= now - hoursBack * 3600000 && t <= now + hoursAhead * 3600000;
  }

  /* This page answers "what is next for the people I follow", and a one-week
     window cannot answer that: a UFC champion fights twice a year and an
     esports team sits out the gap between splits, so a week of lookahead left
     the page empty for anyone who followed them. Look most of a season ahead
     and keep only each follow's next couple of fixtures, so one club with a
     busy calendar can't crowd everyone else out of the list. */
  var AHEAD_H = 24 * 75;
  var BACK_H = 24 * 10;
  var PER_FOLLOW = 2;
  function soonest(list, n) {
    return list.sort(function (a, b) { return a.when - b.when; }).slice(0, n || PER_FOLLOW);
  }

  // Today shows every sport at once, so these are fixed mid-tones that hold up
  // in both themes rather than the live accent — but the same family as it.
  var SPORT_TINT = {
    football: '#2E8B74', basketball: '#E07A3C', f1: '#D6453F',
    esports: '#7C6BDD', fight: '#C25A38'
  };
  var SPORT_LABEL = {
    football: '足球', basketball: '篮球', f1: 'F1', esports: '电竞', fight: '格斗'
  };
  var todayTimer = null;

  function countdown(when) {
    var ms = when - Date.now();
    if (ms <= 0) return '即将开始';
    var mins = Math.floor(ms / 60000);
    if (mins < 60) return '还有 ' + mins + ' 分钟';
    var hrs = Math.floor(mins / 60);
    if (hrs < 24) return '还有 ' + hrs + ' 小时 ' + (mins % 60) + ' 分';
    return '还有 ' + Math.floor(hrs / 24) + ' 天 ' + (hrs % 24) + ' 小时';
  }

  function renderToday() {
    var host = panelFor('panel-today');
    host.innerHTML = '<div class="skeleton">正在汇总…</div>';
    if (todayTimer) { clearInterval(todayTimer); todayTimer = null; }

    var jobs = [];
    favorites.forEach(function (f) {
      var base = API + 'site/v2/sports/soccer/' + (f.league || 'eng.1') + '/teams/' + f.id + '/schedule';
      jobs.push(Promise.all([getJSON(base), getJSON(base + '?fixture=true')]).then(function (r) {
        return { kind: 'team', fav: f, past: r[0], future: r[1] };
      }));
    });
    favNba.forEach(function (f) {
      jobs.push(getJSON(API + NBA + 'teams/' + f.id + '/schedule').then(function (d) {
        return { kind: 'nba', fav: f, sched: d };
      }));
    });
    if (favDrivers.length) {
      jobs.push(Promise.all([f1Season(), f1Standings()]).then(function (r) {
        return { kind: 'f1', season: r[0], standings: r[1] };
      }));
    }
    if (favLol.length) {
      // every league, not just the one the board happens to be showing — a
      // followed LCK team is invisible while the chip row sits on LPL
      jobs.push(lolLeagues().then(function (ls) {
        return Promise.all(ls.map(function (l) {
          return lolGet('getSchedule?hl=zh-CN&leagueId=' + l.id);
        })).then(function (all) { return { kind: 'lol', scheds: all }; });
      }));
    }
    if (favFighters.length) {
      jobs.push(ufcCardsForFighters(favFighters.map(function (f) { return f.id; })).then(function (chunks) {
        return { kind: 'fight', chunks: chunks };
      }));
    }
    if (favBoxers.length) {
      jobs.push(archiveGet('boxing.json').then(function (d) {
        return { kind: 'boxing', data: d || {} };
      }));
    }

    if (!jobs.length) {
      // following nothing is not the same as having nothing: a call made on
      // any fixture still belongs on this page
      host.innerHTML = '<div class="empty">还没有关注任何队伍。<br><br>' +
        '到「足球」「篮球」点右上角的「主队」，到「F1」点「车手」，到「电竞」点「战队」，' +
        '到「格斗」点「选手」或「拳手」，选完之后这一页会把他们的下一场比赛汇总在一起。</div>' +
        recordCardHTML();
      return;
    }

    Promise.all(jobs).then(function (results) {
      // a follow with nothing on the calendar is still worth saying out loud,
      // otherwise the page reads as broken rather than quiet
      var upcoming = [], recent = [], idle = [];

      results.forEach(function (res) {
        if (res.kind === 'team') {
          var f = res.fav;
          var lgName = (LEAGUES.filter(function (l) { return l.id === f.league; })[0] || {}).name || '';
          var mine = [];
          ((res.future && res.future.events) || []).forEach(function (e) {
            if (!within(e.date, 3, AHEAD_H)) return;
            var sd = sideOf(e, f.id);
            var st = (sd.comp.status && sd.comp.status.type) || {};
            mine.push({
              id: e.id,   // lets the headline notice a call riding on it
              when: new Date(e.date), sport: 'football', tag: lgName, live: st.state === 'in',
              title: esc(f.name) + ' <span class="vs-mid">vs</span> ' +
                esc(cn(sd.opp.team && sd.opp.team.displayName, sd.opp.team && sd.opp.team.shortDisplayName)),
              sub: (sd.me.homeAway === 'home' ? '主场' : '客场')
            });
          });
          soonest(mine).forEach(function (u) { upcoming.push(u); });
          var done = ((res.past && res.past.events) || []).filter(function (e) {
            return within(e.date, BACK_H, 3);
          }).sort(function (a, b) { return new Date(b.date) - new Date(a.date); })[0];
          if (done) {
            var s2 = sideOf(done, f.id);
            var mark = s2.me.winner === true ? 'W' : (s2.opp.winner === true ? 'L' : 'D');
            recent.push({
              id: done.id,

        if (res.kind === 'nba') {
          var f2 = res.fav;

          var mineNba = [];
          evs2.forEach(function (e) {
            var c = (e.competitions || [])[0] || {};
            var st = (c.status && c.status.type) || {};
            var cs = c.competitors || [];

            var opp = cs.filter(function (x) { return x !== me; })[0] || {};
            if (!st.completed && within(e.date, 3, AHEAD_H)) {

                  esc(nbaCN(opp.team && opp.team.displayName)),
                sub: me.homeAway === 'home' ? '主场' : '客场'
              });
            } else if (st.completed && within(e.date, BACK_H, 3)) {
              var mk = me.winner === true ? 'W' : 'L';
              recent.push({
                when: new Date(e.date), sport: 'basketball', mark: mk,
                title: esc(f2.name) + ' <span class="vs-mid">vs</span> ' +
                  esc(nbaCN(opp.team && opp.team.displayName)),
                score: esc(scoreOf(me)) + '-' + esc(scoreOf(opp)),
                word: mk === 'W' ? '胜' : '负'
              });
            }
          });
          soonest(mineNba).forEach(function (u) { upcoming.push(u); });
        }

        if (res.kind === 'f1') {
          var evs = ((res.season && res.season.events) || []).slice().sort(function (a, b) {
            return new Date(a.date) - new Date(b.date);
          });
          var now = Date.now();
          var nextEv = evs.filter(function (e) {
            var st = (e.status && e.status.type) || {};
            return st.state !== 'post' &&
              new Date((raceOf(e) || {}).date || e.date).getTime() >= now - 6 * 3600000;
          })[0];
          if (nextEv) {
            (nextEv.competitions || []).forEach(function (c) {
              var type = (c.type && (c.type.text || c.type.abbreviation)) || '';
              if (type !== 'Race' && type !== 'Qual' && type !== 'Sprint') return;
              if (!within(c.date, 3, AHEAD_H)) return;
              upcoming.push({
                when: new Date(c.date), sport: 'f1', tag: 'F1',
                title: esc(gpName(nextEv.name)), sub: SESSION_CN[type] || type
              });
            });
          }
          var dStand = ((res.standings && res.standings.children) || []).filter(function (c) {
            return /driver/i.test(c.name || '');
          })[0];
          var entries = (dStand && dStand.standings && dStand.standings.entries) || [];
          favDrivers.forEach(function (fd) {
            var surname = plain(fd.name).split(' ').slice(-1)[0];
            var st = entries.filter(function (e) {
              return plain((e.athlete && e.athlete.displayName) || '').indexOf(surname) !== -1;
            })[0];
            if (!st) return;
            var mm = {};
            (st.stats || []).forEach(function (x) { mm[x.name] = x.displayValue; });
            recent.push({
              when: null, sport: 'f1', mark: '',
              title: esc(driverCN(fd.name) || fd.name),
              score: (mm.championshipPts || '0') + ' 分', word: '第 ' + (mm.rank || '?') + ' 名'
            });
          });
        }

        if (res.kind === 'lol') {
          var codes = favLol.map(function (f) { return f.code; });
          var byTeam = {};
          codes.forEach(function (c) { byTeam[c] = []; });
          (res.scheds || []).forEach(function (sched) {
            ((((sched && sched.data) || {}).schedule || {}).events || []).forEach(function (e) {
              if (e.type !== 'match' || !e.match) return;
              var ts = e.match.teams || [];
              var me = ts.filter(function (t) { return codes.indexOf(t.code) !== -1; })[0];
              if (!me) return;
              var opp = ts.filter(function (t) { return t !== me; })[0] || {};
              var title = esc(me.code) + ' <span class="vs-mid">vs</span> ' + esc(opp.code || '');
              if (e.state === 'completed' && within(e.startTime, BACK_H, 3)) {
                var won = (me.result || {}).outcome === 'win';
                recent.push({
                  when: new Date(e.startTime), sport: 'esports', mark: won ? 'W' : 'L', title: title,
                  score: esc((me.result || {}).gameWins) + '-' + esc((opp.result || {}).gameWins),
                  word: won ? '胜' : '负'
                });
              } else if (e.state !== 'completed' && within(e.startTime, 3, AHEAD_H)) {
                byTeam[me.code].push({
                  id: e.match.id,
                  when: new Date(e.startTime), sport: 'esports',
                  tag: (e.league && e.league.name) || 'LOL', live: e.state === 'inProgress',
                  title: title,
                  sub: e.match.strategy ? 'BO' + e.match.strategy.count : ''
                });
              }
            });
          });
          codes.forEach(function (c) {
            soonest(byTeam[c]).forEach(function (u) { upcoming.push(u); });
            if (!byTeam[c].length) idle.push({ sport: 'esports', name: c });
          });
        }

        if (res.kind === 'fight') {
          favFighters.forEach(function (f) {
            var booked = [];
            boutsOfFighter(res.chunks, f.id).forEach(function (x) {
              var st = (x.comp.status || {}).type || {};
              var oppName = (x.opp.athlete && x.opp.athlete.displayName) || '';
              var title = esc(f.name) + ' <span class="vs-mid">vs</span> ' + esc(oppName);
              var card = String(x.ev.shortName || x.ev.name || '').split(':')[0];
              if (st.state === 'post' && within(x.comp.date, BACK_H, 3)) {
                var won = x.me.winner === true, lost = x.opp.winner === true;
                var m = methodOf(x.comp);
                recent.push({
                  when: new Date(x.comp.date), sport: 'fight',
                  mark: won ? 'W' : (lost ? 'L' : 'D'), title: title,
                  score: won ? '胜' : (lost ? '负' : '平'),
                  word: m || ''
                });
              } else if (st.state !== 'post' && within(x.comp.date, 3, AHEAD_H)) {
                booked.push({
                  id: x.comp.id,
                  when: new Date(x.comp.date), sport: 'fight', tag: card,
                  live: st.state === 'in', title: title,
                  sub: weightCN(x.comp.type && x.comp.type.abbreviation)
                });
              }
            });
            soonest(booked, 1).forEach(function (u) { upcoming.push(u); });
            if (!booked.length) idle.push({ sport: 'fight', name: f.name });
          });
        }

        if (res.kind === 'boxing') {
          favBoxers.forEach(function (f) {
            var list = boutsOfBoxer(res.data, boxerKey(f.name));
            var booked = [];
            list.forEach(function (x) {
              var opp = x.side === 'a' ? x.bout.b : x.bout.a;
              var title = esc(f.name) + ' <span class="vs-mid">vs</span> ' +
                esc((opp && opp.name) || 'TBD');
              if (x.done && within(x.bout.start, BACK_H, 24)) {
                var won = x.bout.winner === x.side;
                var lost = x.bout.winner && x.bout.winner !== x.side;
                recent.push({
                  when: new Date(x.bout.start), sport: 'fight',
                  mark: won ? 'W' : (lost ? 'L' : 'D'), title: title,
                  score: won ? '胜' : (lost ? '负' : '平'), word: x.bout.method || ''
                });
              } else if (!x.done && within(x.bout.start, 24, AHEAD_H)) {
                booked.push({
                  when: new Date(x.bout.start), sport: 'fight',
                  tag: '拳击', title: title, sub: x.bout.weight || ''
                });
              }
            });
            soonest(booked, 1).forEach(function (u) { upcoming.push(u); });
            if (!booked.length) idle.push({ sport: 'fight', name: f.name });
          });
        }
      });

      upcoming.sort(function (a, b) { return a.when - b.when; });
      recent.sort(function (a, b) { return (b.when || 0) - (a.when || 0); });

      var live = upcoming.filter(function (u) { return u.live; });
      var future = upcoming.filter(function (u) { return !u.live; });

      /* The headline is the one worth opening the app for, not merely the
         soonest. In order: something happening now, something you have a call
         riding on, something with a storyline, then whatever is closest. */
      var hero = null, heroScore = -1;
      future.concat(live).forEach(function (u) {
        var score = 0;
        if (u.live) score += 1000;
        if (u.id && pickOf(u.sport, u.id)) score += 500;
        score += (u.story && u.story.weight) || 0;
        var hours = (u.when - Date.now()) / 3600000;
        score += Math.max(0, 120 - hours);       // sooner is better
        if (score > heroScore) { heroScore = score; hero = u; }
      });
      var html = '';

      if (hero) {
        var reason = '';
        var mine = hero.id ? pickOf(hero.sport, hero.id) : null;
        if (hero.live) reason = '正在进行';
        else if (mine) {
          /* A colon, not a space: the name after it may be Chinese or Latin,
             and a bare space that is correct before "Raoni" is wrong before
             "荷兰". The colon reads right in front of either. */
          reason = '你的预判：' + (mine.side === 'draw' ? '踢平'
            : (mine.side === 'home' ? mine.home : mine.away) || '这场');
        } else if (hero.story && hero.story.line) reason = hero.story.line;

        html += '<div class="hero' + (hero.live ? ' is-live' : '') +
          '" style="--tint:' + SPORT_TINT[hero.sport] + '">' +
          '<span class="hero-badge">' + esc(SPORT_LABEL[hero.sport] || '') +
          (hero.tag && hero.tag !== SPORT_LABEL[hero.sport] ? ' · ' + esc(hero.tag) : '') + '</span>' +
          '<div class="hero-title">' + hero.title + '</div>' +
          (reason ? '<div class="hero-why">' + esc(reason) + '</div>' : '') +
          '<div class="hero-sub">' + (hero.sub ? esc(hero.sub) + ' · ' : '') +
          esc(fmtDay(hero.when) + ' ' + fmtTime(hero.when)) + '</div>' +
          '<div class="hero-count" id="heroCount">' +
          esc(hero.live ? '正在进行' : countdown(hero.when)) + '</div>' +
          '</div>';
      }

      // the headline is no longer always the first row, so drop it by identity
      var notHero = function (u) { return u !== hero; };
      var liveRest = live.filter(notHero), futureRest = future.filter(notHero);

      if (liveRest.length) {
        html += '<div class="group-name"><span class="dot"></span>正在进行</div><div class="card">' +
          liveRest.map(rowUpcoming).join('') + '</div>';
      }
      if (futureRest.length) {
        html += '<div class="group-name">接下来</div><div class="card">' +
          futureRest.slice(0, 12).map(rowUpcoming).join('') + '</div>';
      } else if (!live.length && !hero) {
        html += '<div class="group-name">接下来</div><div class="card">' +
          '<div class="fix"><span>关注的队伍和选手都还没有排赛</span></div></div>';
      }
      if (idle.length) {
        var shown = idle.slice(0, 6);
        html += '<div class="card" style="margin-top:10px">' + shown.map(function (x) {
          return '<div class="fix"><span class="rail" style="background:' +
            (SPORT_TINT[x.sport] || 'var(--muted)') + '"></span>' +
            '<span class="vs">' + esc(x.name) + '</span>' +
            '<span class="res" style="font-weight:500;color:var(--muted)">下一场还没公布</span></div>';
        }).join('') +
          (idle.length > shown.length
            ? '<div class="fix"><span class="vs" style="color:var(--muted)">另有 ' +
              (idle.length - shown.length) + ' 个也还没有排赛</span></div>'
            : '') + '</div>';
      }
      if (recent.length) {
        /* One line of aftermath, on the result that earned it — a call you got
           right, or a scoreline that was not close. Same rule as the fixture
           storylines: at most one, or it stops being worth reading. */
        var shownRecent = recent.slice(0, 12);
        var topResult = null, topWeight = 0;
        shownRecent.forEach(function (r) {
          var weight = 0, note = '';
          var call = r.id ? pickOf(r.sport, r.id) : null;
          if (call && call.result) {
            weight = 90;
            note = call.hit ? '这场你预判命中' : '这场你预判落空';
          }
          var nums = String(r.score || '').match(/^(\d+)-(\d+)$/);
          if (nums) {
            var diff = Math.abs(Number(nums[1]) - Number(nums[2]));
            if (diff >= 4 && diff * 10 > weight) {
              weight = diff * 10;
              note = (r.mark === 'W' ? '赢了 ' : '输了 ') + diff + ' 个球';
            }
          }
          if (weight > topWeight) { topWeight = weight; topResult = { row: r, note: note }; }
        });

        html += '<div class="group-name">最近</div><div class="card">' +
          shownRecent.map(function (r) {
            var line = (topResult && topResult.row === r) ? topResult.note : '';
            return '<div class="fix"><span class="rail" style="background:' + SPORT_TINT[r.sport] + '"></span>' +
              '<span class="when">' + (r.when ? esc(fmtDay(r.when)) : esc(SPORT_LABEL[r.sport])) + '</span>' +
              '<span class="vs">' + r.title + '</span>' +
              '<span class="res ' + (r.mark || '') + '">' + r.score + ' ' + esc(r.word) + '</span></div>' +
              (line ? '<div class="after-line">' + esc(line) + '</div>' : '');
          }).join('') + '</div>';
      }
      html += recordCardHTML();
      html += '<div class="ics-row"><button class="btn" type="button" id="icsBtn">导出到日历 (.ics)</button>' +
        '<span class="count">加进手机日历，开赛前 30 分钟提醒</span></div>';

      host.innerHTML = html;
      remindFrom(upcoming);
      var b = $('icsBtn');
      if (b) b.addEventListener('click', function () { exportICS(upcoming); });
      if (hero) {
        todayTimer = setInterval(function () {
          var el = $('heroCount');
          if (!el || !el.isConnected) { clearInterval(todayTimer); todayTimer = null; return; }
          el.textContent = countdown(hero.when);
        }, 30000);
      }
    });
  }

  /* The scoreboard of your own calls. Sits on Today because that is the page
     people open, and because an open call is itself a reason to come back. */
  function recordCardHTML() {
    var s = pickStats();
    if (!s.total && !s.open.length) {
      return '<div class="group-name">我的战绩</div><div class="card">' +
        '<div class="fix"><span>在赛程里点「主胜 / 平 / 客胜」就是落下一个预判，' +
        '赛后自动对账。</span></div></div>';
    }
    var line = '';
    if (s.total >= 3) {
      if (s.current >= 3) line = '连中 ' + s.current + ' 场，手不要抖';
      else if (s.rate >= 60) line = s.total + ' 场判中 ' + s.hits + ' 场';
      else if (s.rate <= 30) line = '最近看走眼了，' + s.total + ' 场只中 ' + s.hits + ' 场';
    }
    var stat = function (v, label, hot) {
      return '<div class="rec-cell"><span class="rec-num' + (hot ? ' hot' : '') + '">' +
        esc(v) + '</span><span class="rec-lbl">' + label + '</span></div>';
    };
    var body = '<div class="rec-row">' +
      stat(s.total ? s.rate + '%' : '—', '命中率', s.rate >= 60 && s.total >= 3) +
      stat(s.hits + '/' + s.total, '命中', false) +
      stat(s.best || '—', '最长连中', s.best >= 3) +
      stat(s.open.length || '—', '未决', false) +
      '</div>' + (line ? '<div class="rec-line">' + esc(line) + '</div>' : '');

    var pending = s.open.slice(0, 4).map(function (p) {
      var d = new Date(p.when || '');
      var label = p.side === 'home' ? p.home : (p.side === 'away' ? p.away : '平局');
      return '<div class="fix"><span class="when">' +
        esc(isNaN(d) ? '待定' : fmtDay(d)) + '</span>' +
        '<span class="vs">' + esc(p.home) + ' <span class="vs-mid">vs</span> ' + esc(p.away) + '</span>' +
        '<span class="res" style="color:var(--accent);font-weight:700">判 ' + esc(label) + '</span></div>';
    }).join('');

    var recent = s.done.slice(0, 4).map(function (p) {
      return '<div class="fix"><span class="when">' + esc(p.score || '') + '</span>' +
        '<span class="vs">' + esc(p.home) + ' <span class="vs-mid">vs</span> ' + esc(p.away) + '</span>' +
        '<span class="res ' + (p.hit ? 'W' : 'L') + '">' + (p.hit ? '✓ 命中' : '✗ 落空') + '</span></div>';
    }).join('');

    return '<div class="group-name">我的战绩</div>' +
      '<div class="card rec-card">' + body + '</div>' +
      (pending ? '<div class="sec-label">未决</div><div class="card">' + pending + '</div>' : '') +
      (recent ? '<div class="sec-label">已对账</div><div class="card">' + recent + '</div>' : '');
  }

  function rowUpcoming(u) {
    return '<div class="fix' + (u.live ? ' live-row' : '') + '">' +
      '<span class="rail" style="background:' + (SPORT_TINT[u.sport] || 'var(--muted)') + '"></span>' +
      '<span class="when">' + esc(fmtDay(u.when) + ' ' + fmtTime(u.when)) + '</span>' +
      '<span class="vs">' + u.title + '</span>' +
      '<span class="res" style="font-weight:500;color:var(--muted)">' +
      esc(u.sub || u.tag || '') + '</span></div>';
  }

  /* ---------- calendar export ---------- */
  function icsStamp(d) {
    return d.getUTCFullYear() +
      String(d.getUTCMonth() + 1).padStart(2, '0') +
      String(d.getUTCDate()).padStart(2, '0') + 'T' +
      String(d.getUTCHours()).padStart(2, '0') +
      String(d.getUTCMinutes()).padStart(2, '0') + '00Z';
  }
  function icsEscape(s) {
    return String(s).replace(/<[^>]+>/g, '').replace(/[\\;,]/g, function (c) { return '\\' + c; });
  }
  function exportICS(items) {
    if (!items || !items.length) { alert('现在没有可导出的比赛。'); return; }
    var lines = ['BEGIN:VCALENDAR', 'VERSION:2.0', 'PRODID:-//Grandstand//ZH//', 'CALSCALE:GREGORIAN'];
    items.forEach(function (u, i) {
      if (!u.when || isNaN(u.when)) return;
      var end = new Date(u.when.getTime() + 2 * 3600000);
      lines.push('BEGIN:VEVENT');
      lines.push('UID:grandstand-' + u.when.getTime() + '-' + i + '@grandstand-live.github.io');
      lines.push('DTSTAMP:' + icsStamp(new Date()));
      lines.push('DTSTART:' + icsStamp(u.when));
      lines.push('DTEND:' + icsStamp(end));
      lines.push('SUMMARY:' + icsEscape((u.tag ? '[' + u.tag + '] ' : '') + u.title));
      if (u.sub) lines.push('DESCRIPTION:' + icsEscape(u.sub));
      lines.push('BEGIN:VALARM', 'TRIGGER:-PT30M', 'ACTION:DISPLAY',
        'DESCRIPTION:' + icsEscape(u.title), 'END:VALARM');
      lines.push('END:VEVENT');
    });
    lines.push('END:VCALENDAR');
    var blob = new Blob([lines.join('\r\n')], { type: 'text/calendar;charset=utf-8' });
    var a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = 'grandstand.ics';
    document.body.appendChild(a);
    a.click();
    setTimeout(function () { URL.revokeObjectURL(a.href); a.remove(); }, 1000);
  }

  /* ---------- NBA ---------- */
  var NBA = 'site/v2/sports/basketball/nba/';
  var NBA_CN = {
    'hawks': '老鹰', 'celtics': '凯尔特人', 'nets': '篮网', 'hornets': '黄蜂', 'bulls': '公牛',
    'cavaliers': '骑士', 'mavericks': '独行侠', 'nuggets': '掘金', 'pistons': '活塞',
    'warriors': '勇士', 'rockets': '火箭', 'pacers': '步行者', 'clippers': '快船',
    'lakers': '湖人', 'grizzlies': '灰熊', 'heat': '热火', 'bucks': '雄鹿',
    'timberwolves': '森林狼', 'pelicans': '鹈鹕', 'knicks': '尼克斯', 'thunder': '雷霆',
    'magic': '魔术', '76ers': '76人', 'suns': '太阳', 'trail blazers': '开拓者',
    'kings': '国王', 'spurs': '马刺', 'raptors': '猛龙', 'jazz': '爵士', 'wizards': '奇才'
  };
  var NBA_KEYS = Object.keys(NBA_CN).sort(function (a, b) { return b.length - a.length; });
  function nbaCN(name, fallback) {
    var low = plain(name || '');
    for (var i = 0; i < NBA_KEYS.length; i++) {
      if (low.indexOf(NBA_KEYS[i]) !== -1) return NBA_CN[NBA_KEYS[i]];
    }
    return fallback || name || '';
  }

  var nbaCache = {};
  var favNba = lsGet('favNba', []);
  var MAX_NBA = 5;

  function nbaDay(ymdStr) {
    var key = 'd' + ymdStr;
    if (nbaCache[key]) return Promise.resolve(nbaCache[key]);
    return getJSON(API + NBA + 'scoreboard?dates=' + ymdStr).then(function (d) {
      if (d) nbaCache[key] = d;
      return d || {};
    });
  }

  // Out of season ESPN's default scoreboard points at the next day with games,
  // so use that as the anchor instead of today.
  function nbaWindow() {
    if (nbaCache.window) return Promise.resolve(nbaCache.window);
    return getJSON(API + NBA + 'scoreboard').then(function (d) {
      var anchor = new Date();
      var dd = d && d.day && d.day.date;
      if (dd) {
        var parsed = new Date(dd + 'T12:00:00');
        if (!isNaN(parsed) && parsed.getTime() > Date.now()) anchor = parsed;
      }
      var offsets = [];
      var future = anchor.getTime() > Date.now() + 36e5;
      for (var i = future ? 0 : -3; i <= (future ? 9 : 7); i++) offsets.push(i);
      return Promise.all(offsets.map(function (o) {
        var day = new Date(anchor);
        day.setDate(day.getDate() + o);
        return nbaDay(day.getFullYear() + String(day.getMonth() + 1).padStart(2, '0') +
          String(day.getDate()).padStart(2, '0'));
      })).then(function (parts) {
        var seen = {}, evs = [];
        parts.forEach(function (p) {
          ((p && p.events) || []).forEach(function (ev) {
            if (seen[ev.id]) return;
            seen[ev.id] = 1;
            evs.push(ev);
            eventById[ev.id] = ev;
          });
        });
        evs.sort(function (a, b) { return new Date(a.date) - new Date(b.date); });
        nbaCache.window = { events: evs, preseason: future };
        return nbaCache.window;
      });
    });
  }

  function renderNbaFixtures() {
    var host = panelFor('panel-fixtures');
    host.innerHTML = '<div class="skeleton">正在获取赛程…</div>';
    nbaWindow().then(function (w) {
      var evs = w.events;
      if (!evs.length) {
        host.innerHTML = '<div class="empty">这段时间没有比赛。<br>NBA 常规赛通常十月下旬开打。</div>';
        $('status').textContent = '暂无比赛';
        return;
      }
      var todayKey = dayKey(new Date());
      var groups = [], idx = {};
      evs.forEach(function (ev) {
        var d = new Date(ev.date);
        var k = dayKey(d);
        if (!(k in idx)) { idx[k] = groups.length; groups.push({ key: k, label: fmtDay(d), items: [] }); }
        groups[idx[k]].items.push({ ev: ev, d: d });
      });

      host.innerHTML = groups.map(function (g) {
        var rows = g.items.map(function (it) {
          var comp = (it.ev.competitions || [])[0] || {};
          var cs = comp.competitors || [];
          var home = cs.filter(function (c) { return c.homeAway === 'home'; })[0] || cs[0] || {};
          var away = cs.filter(function (c) { return c.homeAway === 'away'; })[0] || cs[1] || {};
          var st = (comp.status && comp.status.type) || {};
          var mid, label, cls = '';
          if (st.state === 'pre') {
            mid = '<div class="kick">' + fmtTime(it.d) + '</div>';

          }
          var hn = nbaCN(home.team && home.team.displayName);
          var an = nbaCN(away.team && away.team.displayName);
          var hDim = st.state === 'post' && away.winner ? ' dim' : '';
          var aDim = st.state === 'post' && home.winner ? ' dim' : '';
          if (st.state === 'post') {

          }

          // basketball cannot be drawn, so the call is a straight two-way
          var nbaPick = (st.state === 'pre' || (myNba && myNba.result))
            ? pickBarHTML('basketball', it.ev.id, 'two', { home: hn, away: an }) : '';

          return '<button class="match' + cls + '" type="button" data-nba="' + esc(it.ev.id) + '">' +
            '<span class="side home"><span class="nm' + hDim + '">' + esc(hn) + '</span>' + crest(home.team) + '</span>' +
            '<span class="mid">' + mid + label + '</span>' +
            '<span class="side away">' + crest(away.team) + '<span class="nm' + aDim + '">' + esc(an) + '</span></span>' +
          '</button>' +
          (nbaPick ? '<div class="match-note" data-home="' + esc(hn) + '" data-away="' + esc(an) +
            '" data-when="' + esc(it.ev.date || '') + '">' + nbaPick + '</div>' : '');
        }).join('');
        return '<div class="day"><div class="day-head"><span class="d">' + esc(g.label) + '</span>' +
          (g.key === todayKey ? '<span class="today">今天</span>' : '') +
          '<span class="n">' + g.items.length + ' 场</span></div><div class="card">' + rows + '</div></div>';
      }).join('');

      $('status').innerHTML = (w.preseason ? '新赛季尚未开打 · 下面是最近的安排' : '更新于 ' +
        new Date().toLocaleTimeString('zh-CN', { hour: '2-digit', minute: '2-digit' }));
    });
  }

  /* Win probability from win-loss records when there is no market to read.

     Uses each side's split — the home team's home record against the visitor's
     road record — and combines them with the odds ratio (log5): a .600 host
     against a .400 visitor comes out near 69%, not the 60% a naive comparison
     would give. Falls back to overall records early in a season, when the
     splits are still 0-0, and gives up entirely under five games each, where
     a record says nothing yet. */
  function nbaRecordOdds(cs, table, stale) {
    if (!cs || cs.length !== 2) return null;
    var home = cs.filter(function (c) { return c.homeAway === 'home'; })[0] || cs[0];
    var away = cs.filter(function (c) { return c !== home; })[0];
    if (!away) return null;

    function rec(c, type) {
      var hit = ((c && c.record) || []).filter(function (r) { return r.type === type; })[0];
      var parts = String((hit && (hit.summary || hit.displayValue)) || '').split('-');
      var w = Number(parts[0]), l = Number(parts[1]);
      if (!isFinite(w) || !isFinite(l) || w + l < 5) return null;
      return { w: w, l: l, pct: w / (w + l) };
    }
    function fromTable(c) {
      var hit = table && table[String((c && c.team && c.team.id) || '')];
      return hit && (hit.w + hit.l) >= 5 ? hit : null;
    }

    /* Three tiers, best first. The splits already contain home advantage, so
       only the other two get the court nudge added. */
    var h = rec(home, 'home'), a = rec(away, 'road'), basis = '主客场战绩', edge = 1;
    if (!h || !a) {
      h = rec(home, 'total'); a = rec(away, 'total'); basis = '赛季战绩'; edge = 1.4;
    }
    if (!h || !a) {
      /* Nobody has played yet — every record in a new season reads 0-0, which
         is exactly the stretch when someone is looking at fixtures. The
         standings feed has already fallen back to last season's final table
         in that case, and says so. */
      h = fromTable(home); a = fromTable(away);
      basis = (stale ? '上赛季战绩' : '赛季战绩'); edge = 1.4;
    }
    if (!h || !a) return null;

    // keep a perfect or winless record from making the ratio infinite
    var clamp = function (p) { return Math.min(.95, Math.max(.05, p)); };
    var hp = clamp(h.pct), ap = clamp(a.pct);
    var ratio = (hp / (1 - hp)) / (ap / (1 - ap)) * edge;
    var pct = Math.round(ratio / (1 + ratio) * 100);
    return {
      pct: Math.min(93, Math.max(7, pct)),
      basis: basis + ' ' + h.w + '-' + h.l + ' / ' + a.w + '-' + a.l
    };
  }

  /* team id → win-loss, read off whichever standings table nbaStandings()
     decided was the meaningful one. */
  function nbaPctTable(standings) {
    var map = {};
    (((standings || {}).children) || []).forEach(function (g) {
      ((((g.standings || {}).entries) || [])).forEach(function (e) {
        var st = {};
        (e.stats || []).forEach(function (x) { st[x.name] = x.displayValue; });
        var w = parseInt(st.wins, 10), l = parseInt(st.losses, 10);
        if (e.team && e.team.id && isFinite(w) && isFinite(l) && w + l > 0) {
          map[String(e.team.id)] = { w: w, l: l, pct: w / (w + l) };
        }
      });
    });
    return map;
  }

  /* The per-player box score — the thing a basketball page is actually for, and
     the one block this detail never had. Starters first and marked, then the
     bench; anyone who did not play is dropped rather than shown as a row of
     dashes. */
  function nbaBoxHTML(data) {
    var groups = (data.boxscore && data.boxscore.players) || [];
    if (!groups.length) return '';
    var SHOW = ['minutes', 'points', 'rebounds', 'assists',
      'fieldGoalsMade-fieldGoalsAttempted', 'threePointFieldGoalsMade-threePointFieldGoalsAttempted'];
    var HEAD = ['分钟', '得分', '篮板', '助攻', '投篮', '三分'];

    var blocks = groups.map(function (g) {
      var st = (g.statistics || [])[0] || {};
      var keys = st.keys || [];
      var cols = SHOW.map(function (k) { return keys.indexOf(k); });
      if (cols.every(function (i) { return i < 0; })) return '';

      var played = (st.athletes || []).filter(function (a) {
        return a.stats && a.stats.length && !a.didNotPlay;
      });
      if (!played.length) return '';
      played.sort(function (a, b) { return (b.starter ? 1 : 0) - (a.starter ? 1 : 0); });

      var rows = played.map(function (a) {
        var ath = a.athlete || {};
        var pos = (ath.position && ath.position.abbreviation) || '';
        var tds = cols.map(function (i, n) {
          var v = i >= 0 ? (a.stats[i] || '—') : '—';
          return '<td' + (HEAD[n] === '得分' ? ' class="pts"' : '') + '>' + esc(v) + '</td>';
        }).join('');
        return '<tr><td class="tm"><span class="nm">' + esc(ath.shortName || ath.displayName || '') +
          '</span>' + (a.starter ? '<span class="starter">首发</span>' : '') +
          (pos ? '<span class="bpos">' + esc(pos) + '</span>' : '') + '</td>' + tds + '</tr>';
      }).join('');

      return '<div class="box-team">' + esc(nbaCN(g.team && g.team.displayName)) + '</div>' +
        '<div class="table-scroll"><table><thead><tr><th class="tm">球员</th>' +
        HEAD.map(function (h) { return '<th>' + h + '</th>'; }).join('') +
        '</tr></thead><tbody>' + rows + '</tbody></table></div>';
    }).filter(Boolean);

    return blocks.length ? '<h4>球员数据</h4>' + blocks.join('') : '';
  }

  /* ESPN ships the last five for both sides inside the summary, so the board no
     longer fetches two team schedules to work the same thing out. */
  function nbaLastFiveHTML(data, teamIds) {
    var list = data.lastFiveGames || [];
    if (!list.length) return '';
    var cols = list.map(function (t) {
      var games = (t.events || []).slice(0, 5);
      if (!games.length) return '';
      var rows = games.map(function (e) {
        var mine = String(t.team && t.team.id);
        var us = String(e.homeTeamId) === mine ? e.homeTeamScore : e.awayTeamScore;
        var them = String(e.homeTeamId) === mine ? e.awayTeamScore : e.homeTeamScore;
        var won = String(e.gameResult || '').toUpperCase() === 'W';
        var d = new Date(e.gameDate || '');
        return '<div class="bench-row on"><span class="bnm">' +
          (e.atVs === 'vs' ? '' : '@') + esc(nbaCN(e.opponent && e.opponent.displayName,
            e.opponent && e.opponent.abbreviation)) + '</span>' +
          '<span class="bin"><b style="color:var(--' + (won ? 'win' : 'loss') + ')">' +
          (won ? '胜' : '负') + '</b> ' + esc(us + '-' + them) +
          (isNaN(d) ? '' : ' · ' + esc(fmtDay(d))) + '</span></div>';
      }).join('');
      return '<div class="bench-col"><div class="bench-team">' +
        esc(nbaCN(t.team && t.team.displayName, t.team && t.team.abbreviation)) +
        '</div>' + rows + '</div>';
    }).filter(Boolean).join('');
    return cols ? '<h4>近五场</h4><div class="bench">' + cols + '</div>' : '';
  }

  function nbaInjuryHTML(data) {
    var inj = (data.injuries || []).map(function (g) {
      var list = (g.injuries || []).map(function (i) {
        var n = i.athlete && (i.athlete.displayName || i.athlete.shortName);
        var st = i.status || (i.details && i.details.type) || '';
        return n ? n + (st ? '（' + st + '）' : '') : '';
      }).filter(Boolean);

    return inj.length ? '<h4>伤停名单</h4>' + inj.join('<div style="height:8px"></div>') : '';
  }

  function nbaDetail(btn) {
    var id = btn.dataset.nba;
    var next = btn.nextElementSibling;
    if (next && next.classList.contains('detail')) { next.remove(); return; }
    var box = document.createElement('div');
    box.className = 'detail';
    box.innerHTML = '<div class="skeleton" style="padding:12px 0">正在获取赛况…</div>';
    btn.parentNode.insertBefore(box, btn.nextSibling);

    /* The standings ride along because they are the last resort for the
       pre-game read, and nbaStandings() caches, so this costs one request per
       session rather than one per game opened. */
    Promise.all([
      getJSON(API + NBA + 'summary?event=' + id),
      nbaStandings().catch(function () { return null; })
    ]).then(function (got) {
      var data = got[0], table = nbaPctTable(got[1]), tableStale = !!nbaCache.stale;
      if (!box.isConnected) return;
      if (!data) { box.innerHTML = '<div class="err">赛况没取到。</div>'; return; }
      var html = '';

      var comp = (data.header && data.header.competitions && data.header.competitions[0]) || {};
      var cs = comp.competitors || [];

      /* Same read as football's: the book's moneyline, normalised so the two
         sides sum to 100 and the margin drops out. No draws in basketball. */
      var pick0 = (data.pickcenter && data.pickcenter[0]) || null;
      var nbaNames = cs.map(function (c) { return nbaCN(c.team && c.team.displayName); });
      var hPct = null, basis = '';
      if (pick0) {
        var hOdds = impliedProb(pick0.homeTeamOdds && pick0.homeTeamOdds.moneyLine);
        var aOdds = impliedProb(pick0.awayTeamOdds && pick0.awayTeamOdds.moneyLine);
        if (hOdds && aOdds) {
          hPct = Math.round(hOdds / (hOdds + aOdds) * 100);
          basis = pick0.provider && pick0.provider.name ? '盘口 · ' + pick0.provider.name : '盘口';
        }
      }
      /* Books do not price preseason, and they do not post a line for a regular
         season game until a few days out — which left this whole block missing
         for exactly the games someone is looking ahead at. Records fill the gap:
         home record against road record, combined the usual odds-ratio way, so
         home advantage comes from the split itself rather than a fudge factor. */
      if (hPct === null) {
        var fromRecords = nbaRecordOdds(cs, table, tableStale);
        if (fromRecords) { hPct = fromRecords.pct; basis = fromRecords.basis; }
      }
      if (hPct !== null) {
        html += '<h4>赛前胜负预测</h4>' +
          '<div class="odds-bar"><i class="h" style="width:' + hPct + '%"></i>' +
          '<i class="a" style="width:' + (100 - hPct) + '%"></i></div>' +
          '<div class="odds-key"><span><b>' + esc(nbaNames[0] || '') + '</b> ' + hPct + '%</span>' +
          '<span><b>' + esc(nbaNames[1] || '') + '</b> ' + (100 - hPct) + '%</span></div>' +
          (basis ? '<div class="kv"><span class="k">依据</span><span>' + esc(basis) + '</span></div>' : '') +
          (pick0 && pick0.details ? '<div class="kv"><span class="k">让分</span><span>' +
            esc(pick0.details) + '</span></div>' : '') +
          (pick0 && pick0.overUnder ? '<div class="kv"><span class="k">总分线</span><span>' +
            esc(pick0.overUnder) + '</span></div>' : '');
      }

      // quarter by quarter
      if (cs.length === 2 && (cs[0].linescores || []).length) {
        var periods = (cs[0].linescores || []).length;
        var head = '<tr><th class="tm">球队</th>';
        for (var i = 1; i <= periods; i++) head += '<th>' + (i <= 4 ? 'Q' + i : 'OT' + (i - 4)) + '</th>';
        head += '<th>总分</th></tr>';
        var body = cs.map(function (c) {
          var line = (c.linescores || []).map(function (l) { return '<td>' + esc(l.displayValue) + '</td>'; }).join('');
          return '<tr><td class="tm"><span class="nm">' + esc(nbaCN(c.team && c.team.displayName)) +
            '</span></td>' + line + '<td class="pts">' + esc(c.score) + '</td></tr>';
        }).join('');
        html += '<h4>各节得分</h4><div class="table-scroll"><table><thead>' + head +
          '</thead><tbody>' + body + '</tbody></table></div>';
      }

      // team totals worth comparing
      var teams = (data.boxscore && data.boxscore.teams) || [];
      if (teams.length === 2) {
        var WANT = [
          ['fieldGoalPct', '投篮命中率', '%'], ['threePointFieldGoalPct', '三分命中率', '%'],
          ['freeThrowPct', '罚球命中率', '%'], ['totalRebounds', '篮板'],
          ['assists', '助攻'], ['steals', '抢断'], ['blocks', '盖帽'], ['turnovers', '失误']
        ];
        function stats(t) {
          var m = {};
          ((t && t.statistics) || []).forEach(function (s) { m[s.name] = s.displayValue; });
          return m;
        }
        var h = stats(teams[0]), a = stats(teams[1]);
        var bars = WANT.map(function (r) {
          if (!(r[0] in h) && !(r[0] in a)) return '';
          var hv = parseFloat(h[r[0]]) || 0, av = parseFloat(a[r[0]]) || 0;
          if (!hv && !av) return '';
          var sum = hv + av, hw = sum ? hv / sum * 100 : 50;
          var unit = r[2] === '%' ? '%' : '';
          return '<div class="stat"><span class="sv">' + h[r[0]] + unit + '</span><span class="sl">' + r[1] +
            '</span><span class="sv r">' + a[r[0]] + unit + '</span>' +
            '<span class="sbar"><span class="lw"><i style="width:' + hw.toFixed(1) + '%"></i></span>' +
            '<span class="rw"><i style="width:' + (100 - hw).toFixed(1) + '%"></i></span></span></div>';
        }).filter(Boolean).join('');
        if (bars) html += '<h4>全场数据</h4>' + bars;
      }

      html += nbaBoxHTML(data);
      html += nbaInjuryHTML(data);
      html += nbaLastFiveHTML(data);

      // who did the damage
      var leaders = (data.leaders || []);
      if (leaders.length) {
        html += '<h4>数据领先</h4><div class="bench">' + leaders.map(function (t) {
          var rows = (t.leaders || []).map(function (cat) {
            var it = (cat.leaders || [])[0];
            if (!it) return '';
            return '<div class="bench-row on"><span class="bnm">' +
              esc((it.athlete && it.athlete.shortName) || '') + '</span>' +
              '<span class="bin">' + esc(cat.displayName || '') + ' ' + esc(it.displayValue || '') + '</span></div>';
          }).filter(Boolean).join('');
          if (!rows) return '';
          return '<div class="bench-col"><div class="bench-team">' +
            esc(nbaCN(t.team && t.team.displayName)) + '</div>' + rows + '</div>';
        }).filter(Boolean).join('') + '</div>';
      }

      html += seriesHTML(data.seasonseries, function (full, abbr) {
        return nbaCN(full, abbr) || abbr || '';
      });
      var nbaClips = videosHTML(data.videos);
      if (nbaClips) html += nbaClips;
      else {
        var hd = (data.header && data.header.competitions && data.header.competitions[0]) || {};
        var nm = (hd.competitors || []).map(function (c) {
          return (c.team && c.team.displayName) || '';
        }).filter(Boolean).join(' vs ');
        var nmZh = (hd.competitors || []).map(function (c) {
          return nbaCN(c.team && c.team.displayName);
        }).filter(Boolean).join(' ');
        var scores = (hd.competitors || []).map(function (c) { return c.score; })
          .filter(function (x) { return x !== undefined && x !== null && x !== ''; });
        var scTxt = scores.length === 2 ? ' ' + scores.join('-') + ' ' : ' vs ';
        var gDate = new Date(hd.date || '');
        html += clipSearchHTML(
          nm.replace(' vs ', scTxt) + ' highlights ' + dayEN(gDate),
          nmZh + scTxt + '集锦 NBA ' + dayCN(gDate));
      }

      box.innerHTML = html || '<div class="kv"><span>这场比赛暂时没有更多资料。</span></div>';
    });
  }

  function renderNbaTable() {

  function renderNbaMine() {
    var host = panelFor('panel-mine');
    if (!favNba.length) {
      host.innerHTML = '<div class="empty">还没有设主队。<br>点右上角的「主队」挑最多 ' + MAX_NBA +

      return;
    }
    host.innerHTML = '<div class="skeleton">正在获取主队动态…</div>';
    Promise.all(favNba.map(function (f) {
      return getJSON(API + NBA + 'teams/' + f.id + '/schedule');
    })).then(function (list) {
      host.innerHTML = list.map(function (sched, i) {
        var f = favNba[i];
        if (!sched) return '';
        var tm = sched.team || {};
        var evs = ((sched.events || [])).slice().sort(function (a, b) {
          return new Date(a.date) - new Date(b.date);
        });
        var done = [], next = [];
        evs.forEach(function (e) {
          var c = (e.competitions || [])[0] || {};
          var st = (c.status && c.status.type) || {};
          (st.completed ? done : next).push(e);
        });
        var rows = '';
        var last = done[done.length - 1];
        if (last) rows += nbaRow(last, f.id, true);
        next.slice(0, 3).forEach(function (e) { rows += nbaRow(e, f.id, false); });
        if (!rows) rows = '<div class="fix">近期没有查到比赛</div>';
        return '<div class="card team-card"><div class="tc-head">' + crest(tm, 26) +
          '<span class="nm">' + esc(f.name) + '</span><span class="lg">NBA</span></div>' + rows + '</div>';
      }).join('');
    });
  }
  function nbaRow(e, teamId, finished) {
    var c = (e.competitions || [])[0] || {};
    var cs = c.competitors || [];
    var me = cs.filter(function (x) { return String(x.team && x.team.id) === String(teamId); })[0] || cs[0] || {};
    var opp = cs.filter(function (x) { return x !== me; })[0] || {};
    var d = new Date(e.date);
    var ha = me.homeAway === 'home' ? '主' : '客';
    var right = '';
    if (finished) {
      var ms = scoreOf(me), os = scoreOf(opp);
      var mark = me.winner === true ? 'W' : (opp.winner === true ? 'L' : 'D');
      right = '<span class="res ' + mark + '">' + esc(ms) + '-' + esc(os) + ' ' +
        (mark === 'W' ? '胜' : mark === 'L' ? '负' : '平') + '</span>';
    }
    return '<div class="fix"><span class="when">' + esc(isNaN(d) ? '待定' : fmtDay(d)) + '</span>' +
      '<span class="vs">' + ha + ' vs ' + esc(nbaCN(opp.team && opp.team.displayName)) + '</span>' + right + '</div>';
  }

  function nbaStandings() {
    if (nbaCache.standings) return Promise.resolve(nbaCache.standings);
    return getJSON(API + 'v2/sports/basketball/nba/standings').then(function (cur) {
      var entries = ((((cur || {}).children || [])[0] || {}).standings || {}).entries || [];
      var played = entries.some(function (e) {
        return (e.stats || []).some(function (x) {
          return (x.name === 'wins' || x.name === 'losses') && parseInt(x.displayValue, 10) > 0;
        });
      });
      if (played) { nbaCache.standings = cur; nbaCache.stale = false; return cur; }
      return getJSON(API + 'v2/sports/basketball/nba/standings?season=' + new Date().getFullYear())
        .then(function (old) {
          nbaCache.standings = old || cur;
          nbaCache.stale = true;
          return nbaCache.standings;
        });
    });
  }

  // Titles aren't in any standings feed, so read them off the deciding games.
  // ESPN accepts a YYYYMM scoreboard query, which keeps this to two requests.
  function nbaHonours() {
    var cached = lsGet('nbaHonours', null);
    if (cached && cached.t && Date.now() - cached.t < 30 * 24 * 3600 * 1000) {
      return Promise.resolve(cached.v);
    }
    var now = new Date();
    var finalsYear = now.getMonth() >= 6 ? now.getFullYear() : now.getFullYear() - 1;
    function winnerOf(ev) {
      var c = ((ev.competitions || [])[0] || {});
      var w = (c.competitors || []).filter(function (x) { return x.winner; })[0];
      return w ? { team: w.team, date: ev.date, note: (c.notes || [])[0] && c.notes[0].headline } : null;
    }
    function scan(ym, re) {
      return getJSON(API + 'site/v2/sports/basketball/nba/scoreboard?dates=' + ym + '&limit=300')
        .then(function (d) {
          var hits = ((d && d.events) || []).filter(function (e) {
            return (((e.competitions || [])[0] || {}).notes || []).some(function (n) {
              return re.test(n.headline || '');
            });
          }).sort(function (a, b) { return new Date(a.date) - new Date(b.date); });
          var last = hits[hits.length - 1];
          return last ? winnerOf(last) : null;
        });
    }
    return Promise.all([
      scan(finalsYear + '06', /NBA Finals/i),
      scan(finalsYear + '12', /Cup Championship/i).then(function (r) {
        return r || scan((finalsYear - 1) + '12', /Cup Championship/i);
      })
    ]).then(function (r) {
      var v = { champion: r[0], cup: r[1], season: (finalsYear - 1) + '-' + String(finalsYear).slice(2) };
      lsSet('nbaHonours', { t: Date.now(), v: v });
      return v;
    }).catch(function () { return null; });
  }

  // PandaScore: CS2 and Valorant share one shape
  /* CS2 and Valorant used to be two flat lists of 20 rows with no crests and no
     idea which event a match belonged to. They now read like the League of
     Legends board: a chip per event, matches grouped by day, crests, series
     score, and the maps inside a series when you open one. */
  var pandaLeague = { cs2: lsGet('cs2League', ''), valorant: lsGet('valLeague', '') };
  var pandaOpen = {};

  function pandaTeamCell(t, right, dim, win) {
    t = t || {};

      ? '<img class="crest" src="' + esc(t.image) + '" alt="" loading="lazy">'
      : '<span class="crest" aria-hidden="true"></span>';
    var name = '<span class="lol-code' + (dim ? ' dim' : '') + (win ? ' win' : '') + '">' +
      esc(t.acronym || t.name || 'TBD') + '</span>';

  /* Esports has no bookmaker feed, so the estimate comes from the records we
     already counted: each side's win rate over this event, weighted by how
     many games it is drawn from, so a 2-0 team is not treated as certain.
     Labelled as form rather than odds, because that is what it is. */
  function formOdds(a, b) {
    if (!a || !b) return null;
    var pa = a.played, pb = b.played;
    if (pa < 2 || pb < 2) return null;
    // Laplace smoothing: pulls a short record toward even
    var ra = (a.w + 1) / (pa + 2), rb = (b.w + 1) / (pb + 2);
    var sum = ra + rb;
    if (!sum) return null;
    var pct = Math.round(ra / sum * 100);
    return [pct, 100 - pct, Math.min(pa, pb)];
  }

  function pandaOddsHTML(m, game) {
    var d = archive[game === 'cs2' ? 'cs2.json' : 'valorant.json'];
    if (!d) return '';

    var ts = m.teams || [];
    var a = byId[String((ts[0] || {}).id)], b = byId[String((ts[1] || {}).id)];
    var odds = formOdds(a, b);
    if (!odds) return '';
    return '<h4>战绩推算</h4>' +
      '<div class="odds-bar"><i class="h" style="width:' + odds[0] + '%"></i>' +
      '<i class="a" style="width:' + odds[1] + '%"></i></div>' +
      '<div class="odds-key"><span><b>' + esc(a.acronym) + '</b> ' + odds[0] + '%</span>' +
      '<span><b>' + esc(b.acronym) + '</b> ' + odds[1] + '%</span></div>' +
      '<div class="pd-line muted">按双方在本赛事的胜负推算，不是赔率。' +
      a.w + '胜' + a.l + '负 vs ' + b.w + '胜' + b.l + '负。</div>';
